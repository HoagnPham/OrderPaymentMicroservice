<script id="app-script">
(function(){
'use strict';

const CAT_META = {
  trac_nghiem: { label: 'Trắc nghiệm', short: 'TN', cls: 'tn', desc: 'Chọn 1 đáp án đúng, chấm điểm tức thì' },
  ly_thuyet:   { label: 'Lý thuyết',   short: 'LT', cls: 'lt', desc: 'Câu hỏi khái niệm, tự luận' },
  thuc_hanh:   { label: 'Thực hành',   short: 'TH', cls: 'th', desc: 'Bài tập, đoạn code, tình huống kỹ thuật' },
  thuc_te:     { label: 'Thực tế',     short: 'TT', cls: 'tt', desc: 'Tình huống thực tế, phân tích ứng dụng' },
};
const CAT_ORDER = ['trac_nghiem','ly_thuyet','thuc_hanh','thuc_te'];

const app = document.getElementById('app');

let state = { view: 'home' };
let session = null; // active practice session

function esc(s){
  if(s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Render normalized text (paragraphs separated by \n\n; ```code``` fenced blocks)
function renderText(txt){
  if(!txt) return '';
  const blocks = txt.split(/\n\n+/);
  return blocks.map(b => {
    b = b.trim();
    if(!b) return '';
    const m = b.match(/^```\n?([\s\S]*?)\n?```$/);
    if(m){
      return '<pre><code>' + esc(m[1]) + '</code></pre>';
    }
    return '<p>' + esc(b) + '</p>';
  }).join('');
}

function findChapter(cid){ return QUIZ_DATA.find(c => c.id === cid); }
function findSection(cid, sid){ return findChapter(cid).sections.find(s => s.id === sid); }

function chapterStats(ch){
  let total = 0;
  ch.sections.forEach(s => CAT_ORDER.forEach(k => total += (s.categories[k]||[]).length));
  return total;
}
function sectionStats(sec){
  let total = 0;
  CAT_ORDER.forEach(k => total += (sec.categories[k]||[]).length);
  return total;
}

function go(view, params){
  state = Object.assign({view: view}, params || {});
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

// ---------------- Rendering per view ----------------

function render(){
  if(state.view === 'home') return renderHome();
  if(state.view === 'chapter') return renderChapter();
  if(state.view === 'section') return renderSection();
  if(state.view === 'summary') return renderSummary();
  if(state.view === 'practice') return renderPractice();
  if(state.view === 'result') return renderResult();
}

function header(){
  return `
  <header class="top">
    <div class="brand" onclick="__nav.home()">
      <div class="brand-mark">SS</div>
      <div class="brand-text">
        <div class="t1">Trạm ôn tập</div>
        <div class="t2">An toàn phần mềm</div>
      </div>
    </div>
    <div class="course-tag">CSE703093</div>
  </header>`;
}

function crumbs(items){
  // items: [{label, action}] last one current
  const parts = items.map((it, i) => {
    const isLast = i === items.length-1;
    if(isLast) return `<span class="seg current">${esc(it.label)}</span>`;
    return `<span class="seg" onclick="${it.action}">${esc(it.label)}</span>`;
  });
  return `<div class="crumbs">${parts.join('<span class="sep">/</span>')}</div>`;
}

function renderHome(){
  let html = header();
  html += crumbs([{label:'Ngân hàng câu hỏi'}]);
  html += `
  <div class="page-head">
    <div class="eyebrow"><span>Chọn chương</span><span class="line"></span></div>
    <h1 class="page-title">Ngân hàng câu hỏi ôn tập</h1>
    <div class="page-sub">4 chương · Trắc nghiệm, Lý thuyết, Thực hành, Thực tế. Mỗi câu được chấm và giải thích ngay sau khi trả lời.</div>
  </div>
  <div class="grid">`;
  QUIZ_DATA.forEach((ch, idx) => {
    const total = chapterStats(ch);
    html += `
    <div class="card" onclick="__nav.chapter('${ch.id}')">
      <div class="bar"></div>
      <div class="idx">CHƯƠNG ${idx+1} / ${QUIZ_DATA.length}</div>
      <h3>${esc(ch.title.replace(/^Chương \d+:\s*/,''))}</h3>
      <div class="meta">
        <span>◆ ${ch.sections.length} mục</span>
        <span>◆ ${total} câu hỏi</span>
      </div>
    </div>`;
  });
  html += `</div>`;
  html += `<footer class="app-footer">CSE703093 — An toàn phần mềm · Tự luyện tập, không tính điểm chính thức</footer>`;
  app.innerHTML = html;
}

function renderChapter(){
  const ch = findChapter(state.chapterId);
  let html = header();
  html += crumbs([
    {label:'Ngân hàng câu hỏi', action:"__nav.home()"},
    {label: ch.title.split(':')[0]}
  ]);
  html += `
  <div class="page-head">
    <div class="eyebrow"><span>Danh sách mục</span><span class="line"></span></div>
    <h1 class="page-title">${esc(ch.title)}</h1>
    <div class="page-sub">Chọn một mục để xem các dạng câu hỏi.</div>
  </div>
  <div class="row-list">`;
  ch.sections.forEach(sec => {
    const total = sectionStats(sec);
    html += `
    <div class="row" onclick="__nav.section('${ch.id}','${sec.id}')">
      <div class="row-left">
        <div class="row-id">${esc(sec.id)}</div>
        <div class="row-title">${esc(sec.title)}</div>
      </div>
      <div class="row-right">
        <span>${total} câu</span>
        <span class="chev">›</span>
      </div>
    </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}

function renderSection(){
  const ch = findChapter(state.chapterId);
  const sec = findSection(state.chapterId, state.sectionId);
  let html = header();
  html += crumbs([
    {label:'Ngân hàng câu hỏi', action:"__nav.home()"},
    {label: ch.title.split(':')[0], action:`__nav.chapter('${ch.id}')`},
    {label: 'Mục ' + sec.id}
  ]);
  html += `
  <div class="page-head">
    <div class="eyebrow"><span>Mục ${esc(sec.id)}</span><span class="line"></span></div>
    <h1 class="page-title">${esc(sec.title)}</h1>
    <div class="page-sub">Chọn dạng câu hỏi để bắt đầu luyện tập.</div>
  </div>
  <div class="cat-grid">`;
  CAT_ORDER.forEach(key => {
    const meta = CAT_META[key];
    const qs = sec.categories[key] || [];
    const disabled = qs.length === 0;
    html += `
    <div class="cat-tile ${disabled?'disabled':''}" ${disabled?'':`onclick="__nav.practice('${ch.id}','${sec.id}','${key}')"`}>
      <div class="cat-top">
        <span class="cat-icon ${meta.cls}">${meta.short}</span>
        <span class="cat-count">${qs.length} câu</span>
      </div>
      <div class="cat-name">${meta.label}</div>
      <div class="cat-desc">${meta.desc}</div>
    </div>`;
  });
  html += `</div>`;
  if(sec.knowledge_summary){
    html += `<div class="summary-link" onclick="__nav.summary('${ch.id}','${sec.id}')">▤ Xem tóm tắt kiến thức trọng tâm của mục này</div>`;
  }
  app.innerHTML = html;
}

function renderSummary(){
  const ch = findChapter(state.chapterId);
  const sec = findSection(state.chapterId, state.sectionId);
  let html = header();
  html += crumbs([
    {label:'Ngân hàng câu hỏi', action:"__nav.home()"},
    {label: ch.title.split(':')[0], action:`__nav.chapter('${ch.id}')`},
    {label: 'Mục ' + sec.id, action:`__nav.section('${ch.id}','${sec.id}')`},
    {label: 'Tóm tắt'}
  ]);
  html += `
  <div class="page-head">
    <div class="eyebrow"><span>Tóm tắt kiến thức</span><span class="line"></span></div>
    <h1 class="page-title">${esc(sec.title)}</h1>
  </div>
  <div class="summary-card">${renderText(sec.knowledge_summary)}</div>`;
  app.innerHTML = html;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startPractice(chapterId, sectionId, catKey){
  const sec = findSection(chapterId, sectionId);
  const qs = sec.categories[catKey] || [];
  session = {
    chapterId, sectionId, catKey,
    questions: qs, // keep original order for stability
    index: 0,
    correct: 0,
    wrong: 0,
    answered: false,
    userChoice: null,
    selfGrade: null,
  };
  go('practice', {chapterId, sectionId, catKey});
}

function renderPractice(){
  const ch = findChapter(state.chapterId);
  const sec = findSection(state.chapterId, state.sectionId);
  const meta = CAT_META[state.catKey];
  const total = session.questions.length;
  const q = session.questions[session.index];
  const answeredCount = session.correct + session.wrong;

  let html = header();
  html += crumbs([
    {label:'Ngân hàng câu hỏi', action:"__nav.home()"},
    {label: ch.title.split(':')[0], action:`__nav.chapter('${ch.id}')`},
    {label: 'Mục ' + sec.id, action:`__nav.section('${ch.id}','${sec.id}')`},
    {label: meta.label}
  ]);

  html += `
  <div class="practice-bar">
    <div class="prog-wrap">
      <div class="prog-label"><span>Câu ${session.index+1} / ${total}</span><span>${meta.label}</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${(session.index)/total*100}%"></div></div>
    </div>
    <div class="score-pill"><span class="ok">✓ ${session.correct}</span><span class="bad">✕ ${session.wrong}</span></div>
    <button class="exit-btn" onclick="__nav.section('${ch.id}','${sec.id}')">Thoát</button>
  </div>`;

  html += `<div class="qcard">`;
  html += `<div class="qid"><span>MỤC ${esc(sec.id)}</span><span class="dot"></span><span>${meta.label.toUpperCase()}</span><span class="dot"></span><span>CÂU ${q.num}</span></div>`;
  html += `<div class="qtext">${renderText(q.question)}</div>`;

  if(state.catKey === 'trac_nghiem'){
    html += renderMC(q);
  } else {
    html += renderEssay(q, sec);
  }

  html += `</div>`;
  app.innerHTML = html;
}

function renderMC(q){
  const letters = ['A','B','C','D'];
  const answered = session.answered;
  let html = `<div class="options">`;
  letters.forEach(L => {
    const optText = q.options[L];
    if(optText === undefined) return;
    let cls = 'opt';
    if(answered){
      cls += ' locked';
      if(L === q.correct) cls += ' correct';
      else if(L === session.userChoice) cls += ' wrong';
      else cls += ' dim';
    }
    html += `<button class="${cls}" ${answered?'disabled':''} onclick="__nav.answerMC('${L}')">
      <span class="lab">${L}</span><span>${esc(optText)}</span>
    </button>`;
  });
  html += `</div>`;

  if(answered){
    const isCorrect = session.userChoice === q.correct;
    html += `<div class="verdict show ${isCorrect?'ok':'bad'}">
      <span class="vtag">${isCorrect ? 'ĐÚNG' : 'SAI'}</span>
      <span class="vtext">${isCorrect ? 'Chính xác.' : `Đáp án đúng là <b>${esc(q.correct)}</b>.`} ${q.explanation ? esc(q.explanation) : ''}</span>
    </div>`;
    html += `<div class="nav-row"><button class="btn primary" onclick="__nav.next()">${session.index+1 < session.questions.length ? 'Câu tiếp theo →' : 'Xem kết quả →'}</button></div>`;
  }
  return html;
}

function renderEssay(q, sec){
  const answered = session.answered;
  let html = `<textarea class="self-answer" id="essay-input" placeholder="Gõ ý trả lời của bạn ở đây (không bắt buộc)..." ${answered?'readonly':''}></textarea>`;

  if(!answered){
    html += `<div class="btn-row"><button class="btn primary" onclick="__nav.revealAnswer()">Xem đáp án</button></div>`;
  } else {
    if(q.answer){
      html += `<div class="reveal-box show">
        <div class="reveal-label model">Đáp án mẫu</div>
        <div class="reveal-text">${renderText(q.answer)}</div>
      </div>`;
    } else if(sec.knowledge_summary){
      html += `<div class="reveal-box show">
        <div class="reveal-label summary">Không có đáp án mẫu riêng — tham khảo tóm tắt kiến thức của mục</div>
        <div class="reveal-text">${renderText(sec.knowledge_summary)}</div>
        <div class="reveal-note">Hãy tự đối chiếu câu trả lời của bạn với kiến thức trọng tâm ở trên.</div>
      </div>`;
    } else {
      html += `<div class="reveal-box show">
        <div class="reveal-label summary">Chưa có đáp án mẫu cho câu này</div>
        <div class="reveal-text">Hãy tự đánh giá dựa trên kiến thức đã học.</div>
      </div>`;
    }

    if(session.selfGrade === null){
      html += `<div class="btn-row">
        <span style="font-family:var(--mono); font-size:12px; color:var(--text-dim); align-self:center; margin-right:4px;">Bạn trả lời đúng chứ?</span>
        <button class="btn ghost-ok" onclick="__nav.selfGrade(true)">✓ Tôi đã đúng</button>
        <button class="btn ghost-bad" onclick="__nav.selfGrade(false)">✕ Tôi chưa đúng</button>
      </div>`;
    } else {
      html += `<div class="verdict show ${session.selfGrade ? 'ok':'bad'}">
        <span class="vtag">${session.selfGrade ? 'ĐÃ TÍNH ĐÚNG' : 'ĐÃ TÍNH SAI'}</span>
        <span class="vtext">Tự đánh giá đã được ghi nhận cho câu này.</span>
      </div>`;
      html += `<div class="nav-row"><button class="btn primary" onclick="__nav.next()">${session.index+1 < session.questions.length ? 'Câu tiếp theo →' : 'Xem kết quả →'}</button></div>`;
    }
  }
  return html;
}

function renderResult(){
  const ch = findChapter(state.chapterId);
  const sec = findSection(state.chapterId, state.sectionId);
  const meta = CAT_META[state.catKey];
  const total = session.correct + session.wrong;
  const pct = total ? Math.round(session.correct/total*100) : 0;

  let html = header();
  html += crumbs([
    {label:'Ngân hàng câu hỏi', action:"__nav.home()"},
    {label: ch.title.split(':')[0], action:`__nav.chapter('${ch.id}')`},
    {label: 'Mục ' + sec.id, action:`__nav.section('${ch.id}','${sec.id}')`},
    {label: 'Kết quả'}
  ]);

  html += `<div class="qcard result-wrap">
    <div class="eyebrow" style="justify-content:center;"><span>${meta.label} — Mục ${esc(sec.id)}</span></div>
    <div class="result-score">${pct}%</div>
    <div class="result-label">${session.correct} / ${total} câu đúng</div>
    <div class="result-bars">
      <div class="rbar-row"><span style="width:50px;">Đúng</span><div class="rbar-track"><div class="rbar-fill" style="width:${pct}%"></div></div><span>${session.correct}</span></div>
      <div class="rbar-row"><span style="width:50px;">Sai</span><div class="rbar-track"><div class="rbar-fill bad" style="width:${100-pct}%"></div></div><span>${session.wrong}</span></div>
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn primary" onclick="__nav.retry()">↻ Làm lại mục này</button>
      <button class="btn" onclick="__nav.section('${ch.id}','${sec.id}')">Chọn dạng khác</button>
      <button class="btn" onclick="__nav.chapter('${ch.id}')">Về danh sách mục</button>
    </div>
  </div>`;
  app.innerHTML = html;
}

// ---------------- Navigation / actions exposed globally ----------------
window.__nav = {
  home(){ go('home'); },
  chapter(cid){ go('chapter', {chapterId: cid}); },
  section(cid, sid){ go('section', {chapterId: cid, sectionId: sid}); },
  summary(cid, sid){ go('summary', {chapterId: cid, sectionId: sid}); },
  practice(cid, sid, catKey){ startPractice(cid, sid, catKey); },
  retry(){ startPractice(state.chapterId, state.sectionId, state.catKey); },

  answerMC(letter){
    if(session.answered) return;
    session.answered = true;
    session.userChoice = letter;
    const q = session.questions[session.index];
    if(letter === q.correct) session.correct++; else session.wrong++;
    renderPractice();
  },
  revealAnswer(){
    session.answered = true;
    renderPractice();
  },
  selfGrade(isCorrect){
    session.selfGrade = isCorrect;
    if(isCorrect) session.correct++; else session.wrong++;
    renderPractice();
  },
  next(){
    if(session.index + 1 >= session.questions.length){
      go('result', {chapterId: session.chapterId, sectionId: session.sectionId, catKey: session.catKey});
      return;
    }
    session.index++;
    session.answered = false;
    session.userChoice = null;
    session.selfGrade = null;
    renderPractice();
  }
};

go('home');
})();

</script>
</body>
</html>
