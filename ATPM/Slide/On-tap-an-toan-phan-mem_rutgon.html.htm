i cú pháp","B":"Phát hiện memory leak","C":"Lỗi định dạng","D":"Không có ý nghĩa gì"},"correct":"B","explanation":"[memleak]: phát hiện memory leak."},{"num":7,"question":"Clang Static Analyzer dùng kỹ thuật gì?","options":{"A":"Chỉ đọc comment","B":"Symbolic execution (path-sensitive)","C":"Chỉ đếm dòng code","D":"Không phân tích gì cả"},"correct":"B","explanation":"Clang SA dùng symbolic execution (path-sensitive)."},{"num":8,"question":"”Path-sensitive” trong Clang Static Analyzer nghĩa là gì?","options":{"A":"Không quan tâm đường thi hành","B":"Mô phỏng các đường thi hành có thể để phát hiện lỗi theo điều kiện cụ thể","C":"Chỉ áp dụng cho file path","D":"Chỉ kiểm tra tên biến"},"correct":"B","explanation":"Path-sensitive: mô phỏng đường thi hành có thể."},{"num":9,"question":"scan-build dùng để làm gì?","options":{"A":"Quét virus","B":"Chạy Clang Static Analyzer tích hợp với quá trình build","C":"Xóa build cache","D":"Tăng tốc linker"},"correct":"B","explanation":"scan-build: chạy Clang SA tích hợp build."}],"ly_thuyet":[{"num":1,"question":"Trình bày vai trò của Compiler Warnings như tuyến phòng thủ static analysis đầu tiên, rẻ nhất.","answer":"Compiler Warnings tích hợp SẴN trong quá trình biên dịch, không cần công cụ thêm, phát hiện lỗi cú pháp/kiểu dữ liệu cơ bản – rẻ nhất vì không tốn chi phí bổ sung."},{"num":2,"question":"Giải thích các cờ GCC quan trọng cho static analysis: -Wformat=2, -Wconversion, -fanalyzer.","answer":"-Wformat=2: cảnh báo lỗi format string (như printf(input)); -Wconversion: cảnh báo mất dữ liệu ép kiểu ngầm (liên quan integer overflow); -fanalyzer: phân tích sâu hơn phát hiện UAF/double-free/NULL deref."},{"num":3,"question":"Mô tả Cppcheck: ưu điểm, cách hoạt động, và lý do phù hợp CI/CD hàng ngày.","answer":"Cppcheck: mã nguồn mở, KHÔNG CẦN build project (phân tích trực tiếp source), tỷ lệ false positive THẤP hơn nhiều tool khác – phù hợp chạy tự động mỗi commit trong CI/CD."},{"num":4,"question":"Trình bày ví dụ output Cppcheck và giải thích ý nghĩa các mã lỗi (VD [memleak], [nullPointer]).","answer":"VD output: [uninitvar] biến chưa khởi tạo, [memleak] rò rỉ bộ nhớ, [nullPointer] có thể NULL deref – mỗi mã lỗi giúp tra cứu chi tiết và có thể suppress riêng nếu false positive."},{"num":5,"question":"Giải thích Clang Static Analyzer và kỹ thuật symbolic execution/path- sensitive analysis nó sử dụng.","answer":"Clang SA dùng SYMBOLIC EXECUTION: mô phỏng các đường thi hành CÓ THỂ của chương trình với giá trị tượng trưng, phát hiện lỗi PHỤ THUỘC ĐIỀU KIỆN cụ thể mà Cppcheck (heuristic đơn giản) có thể bỏ sót."},{"num":6,"question":"So sánh Cppcheck và Clang Static Analyzer về độ chính xác và tốc độ.","answer":"Cppcheck: nhanh, false positive thấp, heuristic; Clang SA: chậm hơn, path-sensitive nên chính xác hơn với lỗi phức tạp (UAF theo điều kiện cụ thể)."},{"num":7,"question":"Trình bày cách Valgrind hoạt động (instrumentation, CPU ảo) và giải thích tại sao nó chậm.","answer":"Valgrind chạy chương trình trong MỘT CPU ẢO (instrumentation toàn bộ), theo dõi MỌI thao tác bộ nhớ – đây chính là lý do chậm (10-50x) nhưng cho kết quả CHÍNH XÁC trên đường đã chạy."},{"num":8,"question":"Giải thích --leak-check=full --track-origins=yes của Valgrind và ý nghĩa từng tham số.","answer":"--leak-check=full: hiển thị chi tiết TỪNG memory leak; --track-origins=yes: theo dõi NGUỒN GỐC của giá trị chưa khởi tạo được dùng (giúp debug uninitialized read). 26 MẬT – An toàn phần mềm"},{"num":9,"question":"Mô tả bảng so sánh 4 công cụ: Compiler Warnings, Cppcheck, Clang SA, Valgrind theo tiêu chí loại/tốc độ/độ chính xác.","answer":"Bảng: Warnings(nhanh nhất,ít chính xác nhất)→Cppcheck(nhanh,TB-cao chính xác)→Clang SA(chậm hơn,cao chính xác)→Valgrind(chậm nhất,rất cao chính xác nhưng chỉ trên path đã chạy)."},{"num":10,"question":"Bàn luận: tại sao ”kết hợp nhiều công cụ ở nhiều giai đoạn” là best practice thay vì chỉ chọn một công cụ ”tốt nhất”?","answer":"Vì mỗi công cụ có ĐIỂM MẠNH/YẾU riêng (tốc độ vs độ chính xác, static vs dynamic) – không công cụ nào ”tốt nhất tuyệt đối”, kết hợp giúp phủ được nhiều loại lỗi hơn."},{"num":11,"question":"Trình bày AddressSanitizer (ASan) và giải thích tại sao nó nhanh hơn Valgrind đáng kể.","answer":"ASan CHÈN MÃ instrumentation NGAY LÚC BIÊN DỊCH (compile-time) thay vì mô phỏng CPU runtime như Valgrind – overhead thấp hơn nhiều (2-3x vs 10-50x) mà vẫn phát hiện chính xác."},{"num":12,"question":"Giải thích UndefinedBehaviorSanitizer (UBSan) và loại lỗi đặc trưng nó phát hiện (liên hệ Integer Overflow đã học ở 2.3).","answer":"UBSan phát hiện: integer overflow (signed), shift vượt quá số bit, chia cho 0, và các Undefined Behavior khác theo chuẩn C – trực tiếp liên hệ Integer Overflow đã học ở Mục 2.3."},{"num":13,"question":"Mô tả lợi ích của việc kết hợp -fsanitize=address,undefined trong một lần chạy test.","answer":"Kết hợp -fsanitize=address,undefined: một lần chạy TEST phát hiện được CẢ lỗi memory safety (ASan) LẪN undefined behavior (UBSan), tiết kiệm thời gian test so với chạy riêng lẻ."},{"num":14,"question":"Trình bày khái niệm SARIF và vai trò chuẩn hóa báo cáo static analysis.","answer":"SARIF: định dạng JSON CHUẨN HÓA để trao đổi kết quả giữa CÁC static analysis tool khác nhau, cho phép tích hợp thống nhất vào GitHub Code Scanning, IDE, dashboard nội bộ."},{"num":15,"question":"Giải thích False Positive và False Negative, cho ví dụ minh họa mỗi loại trong ngữ cảnh static analysis.","answer":"False Positive: công cụ báo ”có lỗi” nhưng THỰC TẾ không có lỗi (báo động giả); False Negative: công cụ báo ”an toàn” nhưng THỰC TẾ có lỗi (bỏ sót) – False Negative nguy hiểm hơn về mặt bảo mật."}],"thuc_hanh":[{"num":1,"question":"Chạy gcc -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 trên một file C và ghi lại toàn bộ warning.","answer":"Chạy lệnh và ghi lại toàn bộ output warning, phân loại theo mức độ nghiêm trọng."},{"num":2,"question":"Chạy cppcheck --enable=all trên c/ch2_memory/vulnerable.c và liệt kê toàn bộ cảnh báo.","answer":"cppcheck --enable=all vulnerable.c liệt kê: deallocuse, doubleFree, memleak, nullPointer như đã xác nhận thực tế."},{"num":3,"question":"Sửa ít nhất 2 cảnh báo tìm được từ câu 2 và chạy lại để xác nhận cảnh báo biến mất.","answer":"Sửa 2 lỗi (VD null check + free đúng cách), chạy lại xác nhận cảnh báo tương ứng biến mất khỏi output."},{"num":4,"question":"So sánh số lượng lỗi phát hiện được giữa -Wall -Wextra và Cppcheck trên cùng một file.","answer":"So sánh: -Wall -Wextra thường phát hiện lỗi cú pháp/kiểu; Cppcheck phát hiện thêm UAF/leak – Cppcheck thường phát hiện NHIỀU hơn cho lỗi ngữ nghĩa."},{"num":5,"question":"Chạy scan-build gcc -c program.c và mô tả báo cáo HTML sinh ra.","answer":"scan-build gcc -c program.c sinh báo cáo HTML với đường dẫn (path) dẫn tới lỗi được highlight trực quan."},{"num":6,"question":"Chạy valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes trên một chương trình có memory leak cố ý, diễn giải output.","answer":"Output Valgrind: ”definitely lost: N bytes” kèm stack trace dòng malloc gây leak – diễn giải theo function/line cụ thể."},{"num":7,"question":"Biên dịch một chương trình với -fsanitize=address và chạy với input gây buffer overflow, quan sát output ASan.","answer":"Compile với -fsanitize=address, chạy input gây overflow: ASan in ra ”heap-buffer- overflow” kèm địa chỉ và stack trace chính xác."},{"num":8,"question":"Biên dịch với -fsanitize=undefined và chạy với input gây integer overflow, quan sát output UBSan.","answer":"Compile với -fsanitize=undefined, chạy input overflow: UBSan in ”signed integer overflow” kèm dòng code cụ thể."},{"num":9,"question":"Viết Makefile với target check chạy cả compiler warnings và Cppcheck liên tiếp.","answer":"check: n tgcc -Wall -Wextra -fsyntax-only *.c n tcppcheck --enable=all *.c"},{"num":10,"question":"Viết Makefile với target test-memory chạy chương trình dưới Valgrind, trả về error nếu có leak.","answer":"test-memory: prog n tvalgrind --leak-check=full --error-exitcode=1 ./prog 28 MẬT – An toàn phần mềm"},{"num":11,"question":"Dùng Python (atpm.ch2_secure_c.static_check) chạy Cppcheck trên một thư mục và in ra summary.","answer":"from atpm.ch2_secure_c.static_check import scan_directory; print(scan_directory(\"c/ch2_m"},{"num":12,"question":"Viết test pytest xác nhận fixed.c không có finding severity=”error” từ Cppcheck.","answer":"assert [f for f in report.findings if f.severity==\"error\"] == []"},{"num":13,"question":"Viết test pytest xác nhận vulnerable.c CÓ ít nhất 3 loại lỗi cụ thể (deallocuse, doubleFree, memleak) từ Cppcheck. 29 MẬT – An toàn phần mềm","answer":"assert \"deallocuse\",\"doubleFree\",\"memleak\" <= f.check_id for f in report.findings"},{"num":14,"question":"Cho một file C với UAF, chạy cả Cppcheck VÀ -fanalyzer, so sánh kết quả 2 công cụ.","answer":"Cppcheck báo UAF cụ thể theo pattern; -fanalyzer có thể báo tương tự hoặc khác cách diễn đạt – so sánh độ chi tiết."},{"num":15,"question":"Viết script Python parse output XML của Cppcheck (--xml) thành cấu trúc dữ liệu Python.","answer":"import xml.etree.ElementTree as ET; root = ET.fromstring(xml_output) parse thành list finding."}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện Cppcheck báo QUÁ NHIỀU false positive khiến dev bắt đầu bỏ qua mọi cảnh báo. Đề xuất cách khắc phục ”alert fatigue”.","answer":"Khắc phục alert fatigue: dùng --suppress cho false positive đã xác nhận, review định kỳ để tinh chỉnh config, không tắt hoàn toàn công cụ."},{"num":2,"question":"Một tổ chức chỉ dùng Compiler Warnings, chưa từng dùng Cppcheck/Valgrind. Đề xuất lộ trình tích hợp dần các công cụ. 30 MẬT – An toàn phần mềm","answer":"Lộ trình: (1) Warnings hiện tại giữ nguyên, (2) thêm Cppcheck vào CI trong 1 tháng, (3) thêm ASan vào test suite, (4) cuối cùng thêm Valgrind cho nightly build. 29 MẬT – An toàn phần mềm"},{"num":3,"question":"Một dự án CI/CD chạy Valgrind trên MỌI commit, làm pipeline chậm 10x. Phân tích vấn đề và đề xuất tối ưu.","answer":"Vấn đề: Valgrind quá chậm cho mỗi commit; tối ưu: chuyển Valgrind sang nightly/weekly build, giữ Warnings+Cppcheck cho mỗi commit (nhanh)."},{"num":4,"question":"Một công ty phát hiện một lỗi UAF nghiêm trọng đã tồn tại nhiều năm mà Cppcheck KHÔNG phát hiện được. Phân tích giới hạn công cụ và đề xuất bổ sung.","answer":"Giới hạn Cppcheck: heuristic không track được toàn bộ data-flow phức tạp; bổ sung: thêm Clang SA (path-sensitive) hoặc CBMC (Ch.3) cho module tới hạn."},{"num":5,"question":"Một startup nhỏ không đủ ngân sách cho công cụ thương mại, chỉ dùng công cụ miễn phí. Đề xuất bộ công cụ tối ưu chi phí (Cppcheck, ASan, GCC warnings).","answer":"Bộ công cụ tối ưu chi phí: GCC Warnings (miễn phí, có sẵn) + Cppcheck (mã nguồn mở) + ASan (tích hợp GCC/Clang, miễn phí) – đủ mạnh mà không tốn chi phí license."},{"num":6,"question":"Một dự án hàng không yêu cầu ZERO warning từ TẤT CẢ công cụ static analysis trước khi release. Phân tích tính khả thi và đề xuất quy trình.","answer":"Không hoàn toàn khả thi 100% (static analysis luôn có giới hạn); đề xuất: ZERO warning từ TOOLS đã chọn + formal verification (CBMC) bổ sung cho phần tới hạn nhất."},{"num":7,"question":"Một công ty phát hiện ASan làm chương trình chậm 3x khi họ VÔ TÌNH build production với sanitizer bật. Phân tích hậu quả và đề xuất quy trình build tách biệt.","answer":"Hậu quả: hiệu năng giảm đáng kể ảnh hưởng người dùng; đề xuất: tách biệt RÕ build script cho test (có sanitizer) và production (không sanitizer), dùng CI riêng biệt."},{"num":8,"question":"Một tổ chức tài chính yêu cầu MỌI PR phải pass Cppcheck trước khi merge. Phân tích lợi ích và rủi ro của quy định cứng nhắc này.","answer":"Lợi ích: đảm bảo chất lượng tối thiểu cho mọi code; rủi ro: có thể làm chậm velocity nếu Cppcheck có false positive cao – cần tinh chỉnh suppress list cẩn thận."},{"num":9,"question":"Một dự án mã nguồn mở nhận đóng góp từ nhiều lập trình viên, chất lượng code không đồng đều. Đề xuất tích hợp static analysis vào quy trình review.","answer":"Đề xuất: bắt buộc chạy Cppcheck TRONG pre-commit hook hoặc CI pipeline, review bắt buộc trước merge, kèm hướng dẫn cho contributor mới."},{"num":10,"question":"Một công ty phát hiện Valgrind báo ”possibly lost” (không phải ”definitely lost”) cho một số block bộ nhớ. Giải thích ý nghĩa và mức độ cần quan tâm.","answer":"”Possibly lost”: Valgrind không chắc chắn 100% (có thể còn con trỏ ẩn trỏ tới, VD trong container phức tạp); vẫn cần điều tra nhưng ưu tiên thấp hơn ”definitely lost”."},{"num":11,"question":"Một hệ thống nhúng không đủ tài nguyên để chạy Valgrind (yêu cầu nhiều RAM). Đề xuất chiến lược test memory safety thay thế.","answer":"Chiến lược thay thế: dùng static analysis kỹ hơn (Cppcheck+Clang SA), test trên simulator có nhiều RAM trước khi deploy lên thiết bị thật, careful manual review."},{"num":12,"question":"Một dự án game engine phát hiện UBSan báo integer overflow trong một phép tính ”cố ý” (wrap-around mong muốn). Phân tích và đề xuất xử lý false positive hợp lệ này.","answer":"Xử lý: xác nhận đây là hành vi MONG MUỐN (wrap-around cố ý), dùng __attribute__((no_saniti hoặc suppress cụ thể cho dòng đó, ghi comment giải thích rõ."},{"num":13,"question":"Một công ty bảo mật phát hiện một binary sản phẩm đối thủ không hề dùng bất kỳ sanitizer nào khi test. Phân tích rủi ro và viết báo cáo đánh giá.","answer":"Rủi ro: sản phẩm đối thủ có khả năng cao chứa lỗi memory safety chưa phát hiện; báo cáo: khuyến nghị KHÔNG dựa vào sản phẩm đó cho ứng dụng tới hạn cao."},{"num":14,"question":"Một tổ chức yêu cầu chứng minh coverage của static analysis cho auditor bên ngoài. Đề xuất cách đo lường và báo cáo ”độ phủ” của Cppcheck/Clang SA.","answer":"Đề xuất đo lường: % dòng code đã pass Cppcheck+Clang SA không lỗi, kết hợp coverage report từ ASan test suite làm bằng chứng cho auditor."},{"num":15,"question":"Một dự án lớn (1 triệu dòng code) phát hiện chạy Cppcheck mất quá nhiều thời gian (giờ). Đề xuất chiến lược tối ưu (incremental analysis, parallel).","answer":"Chiến lược: chạy Cppcheck INCREMENTAL (chỉ file thay đổi) cho mỗi commit, full scan định kỳ (weekly) cho toàn bộ codebase, dùng parallel processing."}]}}],"id":"ch2"},{"title":"Chương 3: Phát hiện lỗ hổng phần mềm – Phân tích tĩnh","sections":[{"id":"3.1","title":"Giới thiệu kiểm chứng và thẩm định phần mềm (V&V)","knowledge_summary":"Chương 3 tập trung vào Verification (“chúng ta xây dựng sản phẩm đúng cách?”) bằng kỹ thuật phân tích tĩnh – kiểm tra mã nguồn mà KHÔNG thực thi nó. Phân tích tĩnh nằm giữa Testing (Ch.1.3, chạy chương trình với input cụ thể) và Formal Verification/Model Checking (Ch.1.5, xét đầy đủ nhưng cần mô hình trừu tượng). Model-based Verification (NuSMV, SPIN) xây tay mô hình Kripke K = (S, S0 , R, L): trừu tượng cao, dễ suy luận nhưng tốn công sức xây mô hình thủ công. Code-based Verification (CBMC, học ở Mục 3.5) sinh mô hình TỰ ĐỘNG trực tiếp từ mã C – đây là “cầu nối” từ lý thuyết Kripke (Ch.1) sang công cụ áp dụng thực tế. Quy trình V&V điển hình: Đặc tả thuộc tính + Mã nguồn → Công cụ phân tích tĩnh → kết luận “Sound: thuộc tính giữ” hoặc “Counterexample”. Verification Engineer cần: (1) định nghĩa đặc tả hình thức từ yêu cầu tự nhiên, (2) chọn công cụ phù hợp (Cppcheck nhanh vs. CBMC chặt chẽ), (3) diễn giải counterexample (lỗi thật hay false positive), (4) cân bằng độ phủ kiểm chứng với chi phí thời gian/tính toán. Các tiêu chuẩn công nghiệp như Common Criteria EAL6–7 và DO-178C Level A (hàng không) YÊU CẦU formal verification bắt buộc cho các module tới hạn.","categories":{"trac_nghiem":[{"num":1,"question":"Verification trả lời câu hỏi nào?","options":{"A":"Chúng ta xây dựng đúng sản phẩm?","B":"Chúng ta xây dựng sản phẩm đúng cách?","C":"Sản phẩm có bán được không?","D":"Sản phẩm có đẹp không?"},"correct":"B","explanation":""},{"num":2,"question":"Chương 3 tập trung chủ yếu vào kỹ thuật nào?","options":{"A":"Testing thủ công","B":"Phân tích tĩnh (Static Analysis)","C":"Thiết kế giao diện","D":"Quản lý dự án"},"correct":"B","explanation":""},{"num":3,"question":"Phân tích tĩnh nằm ở vị trí nào trong phổ kỹ thuật QA?","options":{"A":"Trước Testing, sau Formal Verification","B":"Giữa Testing/Dynamic Analysis và Formal Verification","C":"Sau Formal Verification","D":"Không liên quan tới phổ kỹ thuật nào"},"correct":"B","explanation":""},{"num":4,"question":"Model-based Verification khác Code-based Verification ở điểm nào?","options":{"A":"Model-based xây mô hình trừu tượng thủ công; Code-based tự động sinh từ mã nguồn","B":"Hai khái niệm hoàn toàn giống nhau","C":"Code- based luôn kém chính xác hơn","D":"Model-based chỉ dùng cho Java"},"correct":"A","explanation":""},{"num":5,"question":"CBMC thuộc loại kiểm chứng nào?","options":{"A":"Model-based, giống NuSMV","B":"Code-based, sinh mô hình tự động từ mã","C":"C. Không liên quan tới model checking","D":"Chỉ dùng cho testing thủ công"},"correct":"B","explanation":""},{"num":6,"question":"Verification Engineer cần làm gì với đặc tả yêu cầu tự nhiên?","options":{"A":"Bỏ qua hoàn toàn","B":"Chuyển thành đặc tả hình thức (formal spec)","C":"Chỉ cần đọc một lần","D":"Không liên quan tới công việc của họ"},"correct":"B","explanation":""},{"num":7,"question":"Counterexample trong quy trình V&V dùng để làm gì?","options":{"A":"Chứng minh thuộc tính luôn đúng","B":"Chỉ ra lý do/đường dẫn cụ thể khi thuộc tính bị vi phạm","C":"Không có tác dụng gì","D":"Chỉ dùng để trang trí báo cáo"},"correct":"B","explanation":""},{"num":8,"question":"”False positive” trong ngữ cảnh V&V nghĩa là gì?","options":{"A":"Cảnh báo lỗi không thực sự tồn tại","B":"Bỏ sót lỗi thật","C":"Chương trình chạy đúng","D":"Không có ý nghĩa cụ thể"},"correct":"A","explanation":""},{"num":9,"question":"Yếu tố nào KHÔNG cần cân nhắc khi Verification Engineer chọn công cụ?","options":{"A":"Mức độ tới hạn module","B":"Chi phí thời gian/tính toán","C":"Màu sắc giao diện IDE","D":"Kỹ năng đội ngũ"},"correct":"C","explanation":""},{"num":10,"question":"Quy trình V&V điển hình bắt đầu từ đâu?","options":{"A":"Đặc tả thuộc tính và mã nguồn","B":"Chỉ từ mã nguồn, không cần đặc tả","C":"Chỉ từ đặc tả, không cần mã nguồn","D":"Từ báo cáo lỗi của khách hàng"},"correct":"A","explanation":""},{"num":11,"question":"NuSMV/SPIN đòi hỏi điều gì mà CBMC không đòi hỏi?","options":{"A":"Không đòi hỏi gì khác biệt","B":"Xây dựng mô hình Kripke THỦ CÔNG","C":"Cần license thương mại","D":"Chỉ chạy trên Windows"},"correct":"B","explanation":""},{"num":12,"question":"”Sound trong giới hạn bound” là đặc điểm của công cụ nào?","options":{"A":"NuSMV","B":"CBMC","C":"Cppcheck","D":"Compiler warnings"},"correct":"B","explanation":""},{"num":13,"question":"Diễn giải kết quả CBMC ”VERIFICATION SUCCESSFUL” nghĩa là gì?","options":{"A":"Chương trình hoàn toàn không có lỗi trong MỌI trường hợp","B":"Không tìm thấy lỗi TRONG PHẠM VI đã unwind/kiểm tra","C":"Chương trình chạy nhanh","D":"Không có ý nghĩa gì"},"correct":"B","explanation":""},{"num":14,"question":"Common Criteria EAL cao yêu cầu kỹ thuật nào?","options":{"A":"Chỉ cần unit test","B":"Formal Verification","C":"Không cần kiểm chứng gì thêm","D":"Chỉ cần code review"},"correct":"B","explanation":""},{"num":15,"question":"DO-178C Level A áp dụng cho ngành nào?","options":{"A":"Ngân hàng","B":"Hàng không","C":"Game","D":"Mạng xã hội"},"correct":"B","explanation":""}],"ly_thuyet":[{"num":1,"question":"Ôn lại và trình bày định nghĩa Verification và Validation, chỉ ra Chương\n\n```\ntập trung vào phần nào.\n```","answer":""},{"num":2,"question":"Giải thích vị trí của phân tích tĩnh trong phổ kỹ thuật QA (Testing → Static → Formal Verification).","answer":""},{"num":3,"question":"Phân biệt Model-based Verification và Code-based Verification, cho ví dụ công cụ mỗi loại.","answer":""},{"num":4,"question":"Trình bày lý do CBMC được coi là ”cầu nối” giữa lý thuyết Model Checking (Ch.1.5) và thực hành trên mã C.","answer":""},{"num":5,"question":"Mô tả quy trình V&V điển hình: từ đặc tả thuộc tính, mã nguồn, tới kết quả (sound/counterexample).","answer":""},{"num":6,"question":"Giải thích vai trò của Verification Engineer trong việc chuyển đặc tả tự nhiên thành đặc tả hình thức.","answer":""},{"num":7,"question":"Trình bày khái niệm Counterexample và giá trị thực tiễn của nó khi công cụ phát hiện vi phạm.","answer":""},{"num":8,"question":"Bàn luận: những yếu tố nào Verification Engineer cần cân nhắc khi chọn công cụ phù hợp?","answer":""},{"num":9,"question":"Giải thích ý nghĩa ”sound trong giới hạn bound” của CBMC và tại sao đây không phải ”sound tuyệt đối”.","answer":""},{"num":10,"question":"Trình bày mối liên hệ giữa Common Criteria EAL cao, DO-178C Level A với yêu cầu formal verification.","answer":""},{"num":11,"question":"Mô tả cách diễn giải kết quả ”VERIFICATION SUCCESSFUL” của CBMC một cách chính xác, tránh hiểu lầm.","answer":""},{"num":12,"question":"Giải thích tại sao module xử lý input mạng thường được ưu tiên Verification cao hơn (liên hệ Risk Ch.2.1).","answer":""},{"num":13,"question":"Bàn luận về đánh đổi giữa độ chính xác (Model Checking chặt chẽ) và chi phí thời gian khi chọn công cụ V&V.","answer":""},{"num":14,"question":"Trình bày ví dụ cụ thể một tổ chức lựa chọn kỹ thuật V&V dựa trên mức độ tới hạn của module.","answer":""},{"num":15,"question":"Giải thích tại sao Model-based Verification (NuSMV) cần công sức xây mô hình tay trong khi Code-based (CBMC) thì không.","answer":""}],"thuc_hanh":[{"num":1,"question":"Viết đặc tả hình thức bằng ngôn ngữ tự nhiên có cấu trúc cho thuộc tính ”không bao giờ dereference NULL” cho hàm fixed_null_deref.","answer":""},{"num":2,"question":"Cho hàm fixed_null_deref (Ch.2), chạy CBMC và ghi lại kết quả VERIFICATION SUCCESSFUL/FAILED.","answer":""},{"num":3,"question":"Với bug_null_deref (Ch.2), chạy CBMC và diễn giải counterexample tìm được.","answer":""},{"num":4,"question":"Viết bảng phân loại 5 module giả định theo mức độ ưu tiên Verification (Cao/TB/Thấp).","answer":""},{"num":5,"question":"Thiết kế checklist (5 mục) đánh giá xem một module có cần CBMC hay chỉ cần Cppcheck.","answer":""},{"num":6,"question":"Viết đặc tả hình thức cho thuộc tính ”index luôn nằm trong biên mảng” cho một hàm truy cập mảng cụ thể.","answer":""},{"num":7,"question":"Cho 2 kết quả: Cppcheck báo ”possible null pointer” và CBMC báo ”VERIFICATION SUCCESSFUL” cho cùng hàm, giải thích không mâu thuẫn.","answer":""},{"num":8,"question":"Viết quy trình (flowchart) Verification Engineer xử lý khi nhận module mới: từ đặc tả tới kết luận.","answer":""},{"num":9,"question":"Thiết kế Risk Register kết hợp mức độ Verification cần thiết cho 4 module (parser, logger, crypto, UI).","answer":""},{"num":10,"question":"Chạy CBMC với các mức --unwind khác nhau (2, 6, 12) trên cùng một hàm có vòng lặp, so sánh kết quả.","answer":""},{"num":11,"question":"Viết một bảng so sánh Model-based (NuSMV) và Code-based (CBMC) áp dụng cho MỘT ví dụ cụ thể (hệ thống đèn giao thông).","answer":""},{"num":12,"question":"Cho một module xử lý input mạng, viết Risk Assessment (Ch.2.1) rồi đề xuất mức Verification tương ứng.","answer":""},{"num":13,"question":"Viết báo cáo ngắn (100 từ) giải thích cho quản lý dự án lý do cần đầu tư CBMC cho module thanh toán.","answer":""},{"num":14,"question":"Thiết kế bảng ánh xạ Common Criteria EAL level → công cụ Verification tương ứng cần dùng.","answer":""},{"num":15,"question":"Viết đặc tả hình thức cho thuộc tính ”không có 2 giao dịch cùng rút một số dư” (double-spending prevention).","answer":""}],"thuc_te":[{"num":1,"question":"Một công ty tài chính phải quyết định có đầu tư CBMC cho module giao dịch hay không. Phân tích chi phí-lợi ích và đưa ra khuyến nghị.","answer":""},{"num":2,"question":"Một dự án hàng không yêu cầu DO-178C Level A nhưng đội ngũ chưa từng dùng formal verification. Đề xuất lộ trình đào tạo và triển khai.","answer":""},{"num":3,"question":"Một tổ chức phát hiện một lỗi nghiêm trọng mà CBMC đã báo FAILURE từ lâu nhưng bị bỏ qua. Phân tích nguyên nhân quy trình và đề xuất khắc phục.","answer":""},{"num":4,"question":"Một công ty khởi nghiệp hỏi có cần CBMC ngay từ đầu hay có thể trì hoãn tới khi sản phẩm trưởng thành hơn. Tư vấn dựa trên giai đoạn phát triển.","answer":""},{"num":5,"question":"Một dự án ngân hàng phát hiện Cppcheck và CBMC cho kết quả MÂU THUẪN trên cùng một hàm. Phân tích và giải thích cho khách hàng.","answer":""},{"num":6,"question":"Một tổ chức tài chính lớn yêu cầu CHỨNG MINH mọi module core đã qua formal verification trước audit. Đề xuất quy trình thu thập bằng chứng.","answer":""},{"num":7,"question":"Một dự án ô tô tự lái cần verification cho module điều khiển phanh khẩn cấp. Phân tích mức độ ưu tiên và công cụ phù hợp.","answer":""},{"num":8,"question":"Một công ty phát hiện chi phí CBMC vượt ngân sách dự kiến do thời gian chạy quá lâu trên module lớn. Đề xuất giải pháp tối ưu.","answer":""},{"num":9,"question":"Một dự án chính phủ yêu cầu Common Criteria EAL6 cho hệ thống bỏ phiếu điện tử. Phân tích ý nghĩa và độ khó đạt được mức này.","answer":""},{"num":10,"question":"Một tổ chức y tế phát hiện thiết bị cấy ghép chưa từng qua formal verification. Phân tích mức độ khẩn cấp và đề xuất hành động.","answer":""},{"num":11,"question":"Một công ty bảo hiểm phải chọn giữa thuê chuyên gia CBMC bên ngoài hoặc đào tạo nội bộ. Phân tích ưu nhược điểm mỗi lựa chọn.","answer":""},{"num":12,"question":"Một dự án blockchain phát hiện lỗi smart contract SAU KHI deploy dù đã ”test kỹ”. Phân tích liệu formal verification có ngăn chặn được không.","answer":""},{"num":13,"question":"Một tổ chức phát hiện một Verification Engineer diễn giải SAI một counterexample, dẫn tới bỏ sót lỗi thật. Phân tích rủi ro và đề xuất quy trình review chéo.","answer":""},{"num":14,"question":"Một công ty startup AI dùng C++ cho inference engine, cân nhắc CBMC cho phần lõi. Phân tích tính khả thi với codebase lớn có nhiều thư viện phụ thuộc.","answer":""},{"num":15,"question":"Một dự án vệ tinh yêu cầu MỌI dòng code qua formal verification trước phóng. Phân tích tính thực tế và đề xuất ưu tiên.","answer":""}]}},{"id":"3.2","title":"Tính đúng đắn và đầy đủ (Soundness & Completeness)","knowledge_summary":"Soundness: một phân tích là sound nếu khi nó báo “thuộc tính φ ĐÚNG” (an toàn) thì φ chắc chắn đúng trên chương trình thực – KHÔNG có False Negative. Completeness: một phân tích là complete nếu mọi cảnh báo phát ra đều là lỗi thật – KHÔNG có False Positive (lưu ý: định nghĩa này khác với nghĩa “tìm được mọi lỗi” dùng ở một số tài liệu khác). Bảng chân trị 4 tình huống (TP/FP/TN/FN) là công cụ phân tích hiệu quả của một kỹ thuật QA. Over-approximation (xét tất cả hành vi thật + có thể thêm hành vi giả) → liên hệ Sound (không bỏ sót lỗi nhưng có thể sinh false positive). Under-approximation (chỉ xét một phần hành vi, VD: path đã test) → liên hệ Complete nhưng KHÔNG sound (mọi cảnh báo đều thật nhưng có thể bỏ sót lỗi). Theo hệ quả Định lý Rice: không công cụ thực tế nào vừa sound, vừa complete, vừa luôn dừng (terminate) trên MỌI chương trình – buộc phải đánh đổi ít nhất một trong ba. Cppcheck: không sound, không complete (heuristic). CBMC: sound VÀ complete trong giới hạn bound k đã unwind. Valgrind (dynamic): không sound (chỉ path đã chạy) nhưng complete trên path đó. Bốn trục phân loại static analysis: Sound/Heuristic, Sensitive/Insensitive (field, flow, path), Over/Under-approximation, Explicit/Symbolic.","categories":{"trac_nghiem":[{"num":1,"question":"Một phân tích Sound có đặc điểm gì?","options":{"A":"Không có false negative khi kết luận an toàn","B":"Không có false positive","C":"Luôn tìm ra mọi lỗi","D":"Luôn chạy nhanh"},"correct":"A","explanation":""},{"num":2,"question":"Một phân tích Complete có đặc điểm gì?","options":{"A":"Không có false negative","B":"Không có false positive","C":"Luôn sound","D":"Luôn chậm"},"correct":"B","explanation":""},{"num":3,"question":"True Positive nghĩa là gì?","options":{"A":"Công cụ báo có lỗi, và lỗi thực sự tồn tại","B":"Công cụ báo có lỗi, nhưng không có lỗi","C":"Công cụ báo an toàn, nhưng có lỗi","D":"Công cụ báo an toàn, và thực sự an toàn"},"correct":"A","explanation":""},{"num":4,"question":"False Negative nghĩa là gì?","options":{"A":"Công cụ báo có lỗi nhưng không có lỗi thật","B":"Công cụ báo AN TOÀN nhưng THỰC RA có lỗi","C":"Công cụ báo đúng hoàn toàn","D":"Không có ý nghĩa cụ thể"},"correct":"B","explanation":""},{"num":5,"question":"Over-approximation liên hệ chặt chẽ với tính chất nào?","options":{"A":"Complete","B":"Sound","C":"Nhanh","D":"Không liên quan gì"},"correct":"B","explanation":""},{"num":6,"question":"Under-approximation liên hệ chặt chẽ với tính chất nào?","options":{"A":"Sound","B":"Complete (nhưng không sound)","C":"Luôn cả hai","D":"Không có tính chất nào"},"correct":"B","explanation":""},{"num":7,"question":"Định lý Rice liên quan tới điều gì?","options":{"A":"Chứng minh MỌI thuộc tính chương trình đều decidable","B":"Hầu hết thuộc tính ngữ nghĩa không tầm thường là undecidable","C":"Không liên quan gì tới static analysis","D":"Chỉ áp dụng cho ngôn ngữ functional"},"correct":"B","explanation":""},{"num":8,"question":"Hệ quả của Định lý Rice đối với công cụ QA là gì?","options":{"A":"Không công cụ nào có thể vừa sound, vừa complete, vừa luôn dừng cho mọi chương trình","B":"Mọi công cụ đều hoàn hảo","C":"Không có hệ quả thực tế nào","D":"Chỉ áp dụng cho lý thuyết, không ảnh hưởng thực hành"},"correct":"A","explanation":""},{"num":9,"question":"Cppcheck có tính chất Sound/Complete như thế nào?","options":{"A":"Sound và Complete","B":"Không sound, không complete (heuristic)","C":"Chỉ sound","D":"Chỉ complete"},"correct":"B","explanation":""},{"num":10,"question":"CBMC có tính chất gì (trong giới hạn bound)?","options":{"A":"Sound và Complete trong bound đã chọn","B":"Không sound, không complete","C":"Chỉ complete","D":"Không liên quan gì tới sound/complete"},"correct":"A","explanation":""},{"num":11,"question":"Valgrind (dynamic) có tính chất gì?","options":{"A":"Sound trên toàn bộ chương trình","B":"Không sound (chỉ path đã chạy), nhưng complete trên path đã chạy","C":"Hoàn toàn sound và complete","D":"Không có tính chất xác định"},"correct":"B","explanation":""},{"num":12,"question":"Một công cụ ”luôn báo an toàn” (không phân tích gì) có sound không?","options":{"A":"Có, vì không bao giờ báo sai","B":"Không, vì bỏ sót MỌI lỗi thật (toàn bộ false negative)","C":"Có và cũng complete","D":"Không xác định được"},"correct":"B","explanation":""},{"num":13,"question":"Tại sao ”false positive” gây hại cho sự CHẤP NHẬN công cụ trong thực tế?","options":{"A":"Không gây hại gì","B":"Gây ”alert fatigue” khiến dev bỏ qua cảnh báo","C":"False positive luôn tốt hơn false negative","D":"Chỉ ảnh hưởng tốc độ"},"correct":"B","explanation":""},{"num":14,"question":"Trade-off giữa Precision và Scalability thể hiện như thế nào?","options":{"A":"Công cụ chính xác cao (CBMC) thường scale kém hơn công cụ heuristic (Cppcheck)","B":"Không có trade-off nào","C":"Precision luôn tỷ lệ thuận với Scalability","D":"Chỉ áp dụng cho ngôn ngữ Python"},"correct":"A","explanation":""},{"num":15,"question":"Diễn giải kết quả CBMC ”SUCCESSFUL” đúng đắn là gì?","options":{"A":"Không có lỗi trong TOÀN BỘ chương trình mọi trường hợp","B":"Không có lỗi TRONG PHẠM VI đã unwind","C":"Chương trình chạy nhanh","D":"Không có ý nghĩa"},"correct":"B","explanation":""}],"ly_thuyet":[{"num":1,"question":"Trình bày định nghĩa chính xác của Soundness và Completeness trong phân tích tĩnh.","answer":""},{"num":2,"question":"Giải thích bảng chân trị 4 tình huống (TP, FP, TN, FN) và liên hệ với Sound/Complete.","answer":""},{"num":3,"question":"Mô tả Over-approximation và Under-approximation, chỉ ra tính chất nào (sound/complete) mỗi loại thường đi kèm.","answer":""},{"num":4,"question":"Trình bày Định lý Rice và hệ quả của nó đối với việc thiết kế công cụ phân tích tĩnh thực tế.","answer":""},{"num":5,"question":"Giải thích tại sao KHÔNG có công cụ nào vừa sound, vừa complete, vừa luôn dừng cho MỌI chương trình.","answer":""},{"num":6,"question":"Áp dụng khung Sound/Complete để phân tích Cppcheck, Clang SA, CBMC, Valgrind (đã học Ch.2.5).","answer":""},{"num":7,"question":"Giải thích ý nghĩa ”CBMC sound TRONG GIỚI HẠN BOUND” và tại sao đây khác với ”sound tuyệt đối”.","answer":""},{"num":8,"question":"Bàn luận: tại sao ”false positive” gây hại nhiều hơn về mặt THỰC TIỄN dù về lý thuyết ”an toàn hơn” false negative?","answer":""},{"num":9,"question":"Trình bày ví dụ minh họa công cụ ”luôn báo an toàn không phân tích gì” – phân tích tính sound/complete/hữu dụng.","answer":""},{"num":10,"question":"Giải thích Field-sensitive và Field-insensitive Analysis, cho ví dụ minh họa khác biệt độ chính xác.","answer":""},{"num":11,"question":"Mô tả Flow-sensitive và Flow-insensitive Analysis, liên hệ với khả năng CBMC phân biệt ”trước/sau free”.","answer":""},{"num":12,"question":"Trình bày khái niệm Path-sensitive Analysis và phân biệt với Flow- sensitive.","answer":""},{"num":13,"question":"Giải thích 4 trục phân loại của Static Analysis: Sound/Heuristic, Sensitive/Insensitive, Over/Under-approx, Explicit/Symbolic.","answer":""},{"num":14,"question":"Bàn luận về Unsat Core trong SMT solving – giá trị thực tiễn khi debug đặc tả phức tạp.","answer":""},{"num":15,"question":"Trình bày ví dụ cụ thể minh họa Over-approximation dẫn tới False Positive trong Alias Analysis.","answer":""}],"thuc_hanh":[{"num":1,"question":"Viết một bảng phân tích Sound/Complete cho Cppcheck, Clang SA, CBMC, Valgrind (4 công cụ đã học Ch.2.5).","answer":""},{"num":2,"question":"Cho một công cụ giả định X luôn trả về ”OK”, viết đoạn code Python minh họa và phân tích Sound/Complete.","answer":""},{"num":3,"question":"Với hàm fixed_null_deref, chạy Cppcheck VÀ CBMC, so sánh 2 kết quả và giải thích không mâu thuẫn (dựa Sound/Complete).","answer":""},{"num":4,"question":"Viết bảng chân trị TP/FP/TN/FN cho một tình huống cụ thể: công cụ báo 8 lỗi, 5 lỗi thật, chương trình có 6 lỗi thực tế.","answer":""},{"num":5,"question":"Tính Precision và Recall cho ví dụ ở câu 4 (Precision=TP/(TP+FP), Recall=TP/(TP+FN)).","answer":""},{"num":6,"question":"Viết một đoạn Python mô phỏng Over-approximation: tập ”có thể” luôn là superset của tập ”thực tế”.","answer":""},{"num":7,"question":"Cho 2 phiên bản phân tích alias (chính xác và over-approximate), viết ví dụ code minh họa khác biệt kết quả.","answer":""},{"num":8,"question":"Chạy CBMC với --unwind 3 và --unwind 10 trên cùng hàm có vòng lặp 8 lần, giải thích khác biệt kết quả.","answer":""},{"num":9,"question":"Viết một unsat core example bằng Z3 (3 điều kiện, chỉ ra 2 điều kiện gây mâu thuẫn thực sự).","answer":""},{"num":10,"question":"Thiết kế bảng minh họa Field-sensitive vs Field-insensitive cho một struct 3 field.","answer":""},{"num":11,"question":"Viết đoạn code minh họa Flow-sensitive: một biến an toàn TRƯỚC một điểm code, KHÔNG an toàn SAU điểm đó.","answer":""},{"num":12,"question":"Cho danh sách 10 cảnh báo từ Cppcheck, phân loại thủ công thành TP/FP dựa trên code thực tế.","answer":""},{"num":13,"question":"Viết một script tính tỷ lệ False Positive của một công cụ dựa trên danh sách finding đã gắn nhãn.","answer":""},{"num":14,"question":"Thiết kế bảng ”4 trục phân loại” và xếp Cppcheck, Clang SA, CBMC, Valgrind vào từng vị trí trên 4 trục.","answer":""},{"num":15,"question":"Viết đoạn code Python minh họa ”công cụ complete nhưng không sound” (dùng testing giới hạn tập input).","answer":""}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện công cụ static analysis mới mua báo QUÁ NHIỀU false positive, dev bắt đầu bỏ qua. Phân tích và đề xuất giải pháp dựa trên khái niệm Alert Fatigue.","answer":""},{"num":2,"question":"Một tổ chức tài chính yêu cầu ”chứng minh 100% không có lỗi bảo mật”. Phản biện yêu cầu này dựa trên Định lý Rice.","answer":""},{"num":3,"question":"Một dự án phát hiện CBMC báo ”SUCCESSFUL” nhưng sau đó vẫn có lỗi trong production do vòng lặp KHÔNG unwind đủ. Phân tích nguyên nhân và bài học.","answer":""},{"num":4,"question":"Một công ty bảo hiểm dùng 2 công cụ khác nhau cho cùng module, nhận 2 kết quả KHÁC NHAU. Phân tích cách giải thích hợp lý cho quản lý không chuyên kỹ thuật.","answer":""},{"num":5,"question":"Một tổ chức phát hiện một auditor bên ngoài yêu cầu ”công cụ phải sound VÀ complete”. Giải thích tại sao yêu cầu này không thực tế và đề xuất tiêu chí thay thế.","answer":""},{"num":6,"question":"Một dự án hàng không phát hiện lỗi mà MỌI công cụ static analysis đã dùng đều bỏ sót (false negative). Phân tích giới hạn công cụ và đề xuất bổ sung Theorem Proving.","answer":""},{"num":7,"question":"Một công ty startup chọn dùng CHỈ heuristic tool (không sound) để tiết kiệm chi phí. Phân tích rủi ro của quyết định này cho sản phẩm tới hạn cao.","answer":""},{"num":8,"question":"Một tổ chức phát hiện tỷ lệ false positive của Cppcheck tăng đột biến sau khi update phiên bản mới. Đề xuất quy trình đánh giá lại.","answer":""},{"num":9,"question":"Một dự án ngân hàng yêu cầu MỌI cảnh báo (kể cả false positive nghi ngờ) phải được review thủ công. Phân tích chi phí thời gian và đề xuất tối ưu quy trình.","answer":""},{"num":10,"question":"Một công ty phát hiện field-insensitive analysis (Cppcheck) bỏ sót lỗi cụ thể trên MỘT field của struct lớn. Đề xuất bổ sung công cụ field-sensitive.","answer":""},{"num":11,"question":"Một tổ chức tài chính yêu cầu bằng chứng ”flow-sensitive analysis đã được áp dụng” cho audit. Đề xuất cách chứng minh và tài liệu hóa.","answer":""},{"num":12,"question":"Một dự án phát hiện alias analysis quá thận trọng (over-approximate) khiến MỌI con trỏ bị coi là ”có thể alias”, gây hàng nghìn false positive. Đề xuất tinh chỉnh.","answer":""},{"num":13,"question":"Một công ty phần mềm y tế phải giải thích cho FDA về khái niệm ”sound trong giới hạn bound” của CBMC. Viết đoạn giải thích phù hợp.","answer":""},{"num":14,"question":"Một tổ chức phát hiện 2 kỹ sư verification tranh cãi về việc một cảnh báo là TP hay FP. Đề xuất quy trình phân xử khách quan.","answer":""},{"num":15,"question":"Một dự án quốc phòng yêu cầu MỌI unsat result từ Z3 phải kèm unsat core để audit. Phân tích lý do yêu cầu này hợp lý.","answer":""}]}},{"id":"3.3","title":"Phân tích tĩnh vs. mô phỏng kiểm thử vs. gỡ lỗi","knowledge_summary":"Ba kỹ thuật QA được so sánh có hệ thống: Static Analysis (không chạy chương trình, input là mã nguồn, chứng minh thuộc tính trên MỌI input), Testing (chạy chương trình, input là test case cụ thể, kiểm tra hành vi trên input đã chọn), Debugging (chạy 1 lần với lỗi cụ thể đã xảy ra, tìm NGUYÊN NHÂN của 1 sự cố). Debugging là reactive (sau khi lỗi xảy ra); Static Analysis là proactive (trước khi chạy). Abstract Interpretation: thực thi chương trình trên miền trừu tượng (Sign Domain, Interval Domain, Points-to Domain, Null Domain) thay vì giá trị cụ thể, để suy luận về TẬP trạng thái. Đây là nền tảng lý thuyết của Clang Static Analyzer (Ch.2.5). Symbolic Execution: thực thi với input là ký hiệu tượng trưng (symbol); mỗi nhánh sinh ra một path condition – công thức logic mô tả điều kiện đi theo đường đó. Nếu path condition UNSAT → đường đó infeasible, loại bỏ khỏi phân tích. Đây chính là cầu nối trực tiếp tới SAT/SMT solving (Mục 3.4). Path Explosion (tương tự State Explosion Ch.1.5): số path tăng theo cấp số nhân 2n với n điều kiện if độc lập – giải quyết bằng giới hạn độ sâu (tương tự BMC 3.5), path merging, heuristic search. Concolic Testing (CONCrete+symbOLIC): kết hợp giá trị cụ thể và biểu diễn tượng trưng song song – nền tảng của White-box Fuzzing (Ch.4.6). Công cụ thực tế: KLEE (LLVM bitcode), angr (Python, phân tích binary), cả hai đều dùng Z3 làm SMT backend. gdb (breakpoint, backtrace, core dump) kết hợp Valgrind là quy trình debug lỗi bộ nhớ kinh điển.","categories":{"trac_nghiem":[{"num":1,"question":"Static Analysis khác Testing ở điểm cốt lõi nào?","options":{"A":"Static Analysis không thực thi chương trình","B":"Static Analysis luôn nhanh hơn","C":"Không có khác biệt","D":"Testing luôn chính xác hơn"},"correct":"A","explanation":""},{"num":2,"question":"Debugging khác Static Analysis và Testing ở điểm nào?","options":{"A":"Debugging bắt đầu từ MỘT lỗi cụ thể đã xảy ra để tìm nguyên nhân","B":"Debugging luôn nhanh hơn","C":"Không có khác biệt","D":"Debugging không cần công cụ gì"},"correct":"A","explanation":""},{"num":3,"question":"Abstract Interpretation là gì?","options":{"A":"Thực thi chương trình trên miền trừu tượng để suy luận về tập trạng thái","B":"Chỉ đọc comment trong code","C":"Không liên quan tới static analysis","D":"Chỉ áp dụng cho testing"},"correct":"A","explanation":""},{"num":4,"question":"Trong Sign Domain (ví dụ Abstract Interpretation), giá trị được biểu diễn bằng:","options":{"A":"Giá trị cụ thể chính xác","B":"Ký hiệu trừu tượng như {+, -, 0}","C":"Chuỗi ký tự","D":"Không biểu diễn gì"},"correct":"B","explanation":""},{"num":5,"question":"Interval Domain trong Abstract Interpretation dùng để phát hiện lỗi nào?","options":{"A":"SQL Injection","B":"Out-of-bounds access, integer overflow","C":"Race condition","D":"Không phát hiện lỗi nào"},"correct":"B","explanation":""},{"num":6,"question":"Points-to Domain trong Abstract Interpretation dùng để phát hiện lỗi nào?","options":{"A":"Dangling pointer, UAF","B":"SQL Injection","C":"Format string","D":"Race condition"},"correct":"A","explanation":""},{"num":7,"question":"Symbolic Execution thực thi chương trình với input như thế nào?","options":{"A":"Giá trị cụ thể","B":"Ký hiệu tượng trưng (symbol) thay vì giá trị cụ thể","C":"Không có input","D":"Chỉ input số nguyên"},"correct":"A","explanation":""},{"num":8,"question":"”Path condition” trong Symbolic Execution là gì?","options":{"A":"Điều kiện logic mô tả yêu cầu để đi theo MỘT đường thi hành cụ thể","B":"Tên biến trong code","C":"Không có ý nghĩa gì","D":"Chỉ áp dụng cho vòng lặp"},"correct":"B","explanation":""},{"num":9,"question":"Nếu path condition là UNSAT, điều đó có nghĩa gì?","options":{"A":"Đường đó CÓ THỂ xảy ra trong thực tế","B":"Đường đó KHÔNG BAO GIỜ xảy ra (infeasible path)","C":"Chương trình có lỗi","D":"Không có ý nghĩa gì"},"correct":"A","explanation":""},{"num":10,"question":"Symbolic Execution kết nối trực tiếp với kỹ thuật nào sẽ học ở Mục 3.4?","options":{"A":"SAT/SMT solving","B":"Alignment","C":"Coverage","D":"Fuzzing"},"correct":"B","explanation":""},{"num":11,"question":"gdb dùng để làm gì?","options":{"A":"Biên dịch chương trình","B":"Debug: xem breakpoint, stack trace, giá trị biến lúc crash","C":"Chạy static analysis","D":"Đo hiệu năng"},"correct":"B","explanation":""},{"num":12,"question":"gdb ./program core; (gdb) bt dùng để làm gì?","options":{"A":"Biên dịch lại chương trình","B":"Xem backtrace (stack trace) tại thời điểm crash","C":"Xóa core dump","D":"Không có tác dụng gì"},"correct":"B","explanation":""},{"num":13,"question":"Kết hợp Valgrind và gdb có lợi ích gì?","options":{"A":"Valgrind chỉ ra VỊ TRÍ lỗi, gdb giúp hiểu NGUYÊN NHÂN sâu hơn","B":"Không có lợi ích gì khi kết hợp","C":"Hai công cụ xung đột nhau","D":"Chỉ dùng được một trong hai"},"correct":"A","explanation":""},{"num":14,"question":"Path Explosion trong Symbolic Execution tương tự vấn đề nào đã học ở Ch.1.5?","options":{"A":"State Explosion","B":"Buffer Overflow","C":"Memory Leak","D":"Race Condition"},"correct":"A","explanation":""},{"num":15,"question":"KLEE là công cụ gì? A. Compiler C. B. Symbolic execution engine cho LLVM bitcode. C. Static analyzer đơn giản. D. Trình soạn thảo văn bản.","options":{},"correct":"B","explanation":""}],"ly_thuyet":[{"num":1,"question":"So sánh Static Analysis, Testing/Simulation, và Debugging theo: có chạy chương trình không, input, mục tiêu.","answer":""},{"num":2,"question":"Trình bày ý tưởng cốt lõi của Abstract Interpretation, cho ví dụ Sign Domain.","answer":""},{"num":3,"question":"Giải thích Interval Domain và Points-to Domain, liên hệ với lỗi bộ nhớ đã học ở Chương 2.","answer":""},{"num":4,"question":"Mô tả Symbolic Execution và khái niệm ”path condition”.","a ""},{"num":6,"question":"Viết đoạn code minh họa Abstract Interpretation với Sign Domain cho phép toán x=5;y=-3;z=x+y;.","answer":""},{"num":7,"question":"Cho biến với Interval Domain [0, 10] và [5, 20], tính Interval của phép cộng 2 biến.","answer":""},{"num":8,"question":"Viết một chương trình C nhỏ, biên dịch, chạy dưới gdb, đặt breakpoint và in giá trị biến.","answer":""},{"num":9,"question":"Cố ý tạo một core dump (chương trình crash), dùng gdb program core và chạy bt xem stack trace.","answer":""},{"num":10,"question":"Kết hợp Valgrind + gdb: chạy Valgrind tìm UAF, sau đó dùng gdb xem chi tiết trạng thái tại dòng lỗi.","answer":""},{"num":11,"question":"Viết một hàm Python mô phỏng Points-to Analysis đơn giản: trả về tập a,b cho con trỏ p có thể trỏ tới a hoặc b.","answer":""},{"num":12,"question":"Cho một hàm với vòng lặp 5 lần, tính số lượng path có thể nếu mỗi lần lặp có 1 điều kiện rẽ nhánh (path explosion).","answer":""},{"num":13,"question":"Viết đoạn code minh họa Path Merging: 2 path hội tụ về cùng 1 điểm, gộp lại thành 1 trạng thái biểu diễn.","answer":""},{"num":14,"question":"Cài đặt (hoặc mô tả bằng pseudocode) một symbolic executor đơn giản cho hàm 1 biến, 2 nhánh if.","answer":""},{"num":15,"question":"Viết test case Concolic: chạy với giá trị cụ thể x=5, đồng thời track biểu thức symbolic tương ứng.","answer":""}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện lỗi CHỈ xảy ra trên server production, KHÔNG tái tạo được ở môi trường dev. Đề xuất quy trình debug dùng core dump.","answer":""},{"num":2,"question":"Một dự án game phát hiện Symbolic Execution mất QUÁ NHIỀU thời gian trên game logic phức tạp (path explosion). Đề xuất giải pháp thực tế.","answer":""},{"num":3,"question":"Một tổ chức tài chính dùng KLEE để sinh test case tự động cho module tính lãi suất. Phân tích lợi ích so với viết test case thủ công.","answer":""},{"num":4,"question":"Một công ty phát hiện Abstract Interpretation báo QUÁ NHIỀU false positive trên module xử lý con trỏ phức tạp. Đề xuất tinh chỉnh độ chính xác alias analysis.","answer":""},{"num":5,"question":"Một đội DevOps nhận báo cáo crash production nhưng KHÔNG có core dump (đã bị xóa). Đề xuất chính sách lưu trữ core dump cho tương lai.","answer":""},{"num":6,"question":"Một dự án ô tô dùng Symbolic Execution để tìm input hiếm gây lỗi trong module xử lý cảm biến. Phân tích giá trị so với testing ngẫu nhiên.","answer":""},{"num":7,"question":"Một công ty bảo mật phân tích malware bằng angr (symbolic execution trên binary). Mô tả quy trình và giá trị của phương pháp này.","answer":""},{"num":8,"question":"Một tổ chức phát hiện lỗi RACE CONDITION chỉ xuất hiện dưới tải cao, không static analysis nào phát hiện được. Đề xuất kỹ thuật bổ sung (concolic/dynamic).","answer":""},{"num":9,"question":"Một dự án fintech cần chứng minh KHÔNG CÓ path nào dẫn tới ”âm số dư”. Đề xuất dùng symbolic execution + Z3 để kiểm tra toàn diện.","answer":""},{"num":10,"question":"Một công ty phát hiện Debugging mất RẤT NHIỀU thời gian vì thiếu log chi tiết. Đề xuất cải thiện logging strategy để debug nhanh hơn tương lai.","answer":""},{"num":11,"question":"Một dự án nghiên cứu dùng Concolic Testing để đạt coverage cao hơn fuzzing thuần túy. Phân tích trade-off giữa 2 phương pháp.","answer":""},{"num":12,"question":"Một tổ chức phát hiện một lỗi bảo mật CHỈ kích hoạt qua MỘT path cụ thể hiếm khi được test. Phân tích cách Symbolic Execution có thể đã tìm ra path này.","answer":""},{"num":13,"question":"Một công ty game engine gặp Path Explosion khi cố Symbolic Execution toàn bộ game loop. Đề xuất giới hạn phạm vi phân tích (chỉ module cụ thể).","answer":""},{"num":14,"question":"Một dự án blockchain dùng KLEE để tìm lỗi trong smart contract compiler. Phân tích tại sao đây là ứng dụng phù hợp của symbolic execution.","answer":""},{"num":15,"question":"Một tổ chức phát hiện gdb không đủ để debug lỗi trong môi trường PRODUCTION (không thể attach debugger). Đề xuất công cụ/kỹ thuật thay thế.","answer":""}]}},{"id":"3.4","title":"SAT and SMT solving","knowledge_summary":"SAT: xác định có tồn tại phép gán biến boolean làm công thức mệnh đề φ đúng hay không – là bài toán NP-Complete đầu tiên được chứng minh (Cook–Levin, 1971). CNF (Conjunctive Normal Form): hội (AND) của các mệnh đề tuyển (OR) – “ngôn ngữ máy” của SAT solver. Thuật toán DPLL: unit propagation (gán bắt buộc khi mệnh đề chỉ còn 1 literal), pure literal elimination, branching + backtracking. CDCL (Conflict-Driven Clause Learning) mở rộng DPLL bằng cách học từ xung đột để cắt tỉa không gian tìm kiếm – lý do SAT solver hiện đại giải được hàng triệu biến dù bài toán là NP-hard về lý thuyết. SMT (Satisfiability Modulo Theories) mở rộng SAT: literal có thể là công thức trong lý thuyết nền cụ thể – Linear Arithmetic (bounds check), Bitvector (mô hình chính xác int/unsigned kích thước cố định, kể cả overflow wrap-around), Array (đọc/ghi vùng nhớ tại chỉ số qua Select/Store), Uninterpreted Functions (trừu tượng hóa hàm). Z3 (Microsoft Research) là SMT solver dùng xuyên suốt học phần: s.check() trả về sat/unsat/unknown; unsat là bằng chứng TOÁN HỌC không tồn tại phản ví dụ; s.model() trả về phép gán cụ thể khi sat. Ví dụ buffer overflow: Or(index<0, index>=SIZE) sat (không an toàn) khi chưa kiểm tra biên, unsat (an toàn) khi đã thêm giả thiết kiểm tra biên trước. Unsat core: xác định tập điều kiện TỐI THIỂU gây mâu thuẫn, dùng assert_and_track để gắn nhãn ràng buộc. CBMC (Mục 3.5) quy bounded model checking về công thức SAT/SMT rồi giao cho Z3/MiniSat giải.","categories":{"trac_nghiem":[{"num":1,"question":"Bài toán SAT là gì?","options":{"A":"Xác định có tồn tại phép gán làm công thức mệnh đề đúng hay không","B":"Sắp xếp một mảng số","C":"Tìm đường đi ngắn nhất","D":"Không liên quan tới logic"},"correct":"A","explanation":""},{"num":2,"question":"SAT là bài toán thuộc lớp độ phức tạp nào?","options":{"A":"P","B":"NP-Complete","C":"Decidable trong O(n)","D":"Không thể tính được"},"correct":"B","explanation":""},{"num":3,"question":"Ai chứng minh SAT là NP-Complete đầu tiên?","options":{"A":"Alan Turing","B":"Cook và Levin (1971)","C":"Donald Knuth","D":"John von Neumann"},"correct":"B","explanation":""},{"num":4,"question":"CNF là viết tắt của:","options":{"A":"Conjunctive Normal Form","B":"Common Notation Format","C":"Complex Number Field","D":"Certified Normal Function"},"correct":"A","explanation":""},{"num":5,"question":"CNF có cấu trúc như thế nào?","options":{"A":"Hội (AND) của các mệnh đề tuyển (OR)","B":"Tuyển của các mệnh đề hội","C":"Chỉ dùng phép NOT","D":"Không có cấu trúc cụ thể"},"correct":"A","explanation":""},{"num":6,"question":"DPLL là thuật toán dùng để làm gì?","options":{"A":"Sắp xếp dữ liệu","B":"Giải bài toán SAT","C":"Mã hóa dữ liệu","D":"Nén file"},"correct":"B","explanation":""},{"num":7,"question":"”Unit propagation” trong DPLL là gì?","options":{"A":"Gán giá trị bắt buộc khi mệnh đề chỉ còn 1 literal chưa gán","B":"Xóa toàn bộ biến","C":"Không có ý nghĩa gì","D":"Chỉ áp dụng cho SMT"},"correct":"A","explanation":""},{"num":8,"question":"CDCL là viết tắt của:","options":{"A":"Conflict-Driven Clause Learning","B":"Complete Data Clause Logic","C":"Certified Decision Control Logic","D":"Không có ý nghĩa cụ thể"},"correct":"A","explanation":""},{"num":9,"question":"SMT là viết tắt của:","options":{"A":"Satisfiability Modulo Theories","B":"Static Memory Test","C":"System Model Tracker","D":"Software Module Testing"},"correct":"A","explanation":""},{"num":10,"question":"SMT mở rộng SAT bằng cách nào?","options":{"A":"Cho phép literal là công thức trong một lý thuyết nền cụ thể","B":"Loại bỏ hoàn toàn logic mệnh đề","C":"Chỉ dùng cho số thực","D":"Không mở rộng gì"},"correct":"A","explanation":""},{"num":11,"question":"Lý thuyết Bitvector trong SMT dùng để mô hình hóa gì?","options":{"A":"Số thực","B":"Kiểu int/unsigned có kích thước cố định, bao gồm cả overflow","C":"Chuỗi ký tự","D":"Không mô hình hóa gì cụ thể"},"correct":"B","explanation":""},{"num":12,"question":"Lý thuyết Array trong SMT dùng để mô hình hóa gì?","options":{"A":"Số nguyên đơn giản","B":"Mảng/vùng nhớ (đọc/ghi tại chỉ số)","C":"Chuỗi văn bản","D":"Không liên quan tới bộ nhớ"},"correct":"B","explanation":""},{"num":13,"question":"Z3 là công cụ được phát triển bởi:","options":{"A":"Google","B":"Microsoft Research","C":"Facebook","D":"Apple"},"correct":"B","explanation":""},{"num":14,"question":"from z3 import *; s = Solver() dùng để làm gì?","options":{"A":"Import thư viện vẽ đồ thị","B":"Import Z3 và tạo một solver instance","C":"Kết nối database","D":"Không có tác dụng gì"},"correct":"B","explanation":""},{"num":15,"question":"s.check() trả về giá trị nào trong 3 giá trị có thể?","options":{"A":"sat, unsat, unknown","B":"true, false","C":"0, 1, 2","D":"yes, no"},"correct":"A","explanation":""}],"ly_thuyet":[{"num":1,"question":"Trình bày định nghĩa bài toán SAT và giải thích ý nghĩa NP-Complete của nó.","answer":""},{"num":2,"question":"Giải thích CNF (Conjunctive Normal Form) và tại sao hầu hết SAT solver nhận input dạng này.","answer":""},{"num":3,"question":"Trình bày thuật toán DPLL: unit propagation, pure literal elimination, branching.","answer":""},{"num":4,"question":"Giải thích CDCL và cách nó cải tiến DPLL bằng ”học từ xung đột”.","answer":""},{"num":5,"question":"Trình bày lý do cần mở rộng SAT thành SMT, cho ví dụ hạn chế của SAT thuần túy.","answer":""},{"num":6,"question":"Mô tả các lý thuyết SMT phổ biến: Linear Arithmetic, Bitvector, Array, Uninterpreted Functions.","answer":""},{"num":7,"question":"Giải thích tại sao Bitvector Theory quan trọng để mô hình hóa CHÍNH XÁC kiểu dữ liệu C (bao gồm integer overflow).","answer":""},{"num":8,"question":"Trình bày cách dùng Z3 (Python API) để kiểm tra thuộc tính an toàn buffer bounds, với ví dụ cụ thể.","answer":""},{"num":9,"question":"Giải thích kết quả sat và unsat trong Z3, ý nghĩa của mỗi kết quả đối với việc chứng minh thuộc tính.","answer":""},{"num":10,"question":"Mô tả cách mã hóa Integer Overflow bằng Bitvector trong Z3 (liên hệ Ch.2.3).","answer":""},{"num":11,"question":"Trình bày Array Theory trong SMT và cách nó mô hình hóa bộ nhớ (Store/Select).","answer":""},{"num":12,"question":"Giải thích Unsat Core và giá trị thực tiễn khi debug đặc tả phức tạp có nhiều ràng buộc.","answer":""},{"num":13,"question":"Bàn luận: tại sao unsat là kết quả ”MẠNH” hơn nhiều so với việc chạy testing không tìm thấy lỗi?","answer":""},{"num":14,"question":"Trình bày ví dụ cụ thể Z3 giải bài toán phi tuyến (nonlinear arithmetic) như x2 + y 2 = 25.","answer":""},{"num":15,"question":"Giải thích tại sao SAT solver hiện đại giải được instance triệu biến dù bài toán về lý thuyết là NP-hard.","answer":""}],"thuc_hanh":[{"num":1,"question":"Viết công thức CNF cho: ”ít nhất 2 trong 3 biến p,q,r là True”.","answer":""},{"num":2,"question":"Dùng Z3 kiểm tra công thức CNF ở câu 1, tìm một model thỏa mãn.","answer":""},{"num":3,"question":"Thực hiện DPLL thủ công (bằng tay) cho công thức (p ∨ q) ∧ (¬p ∨ r) ∧ (¬q ∨ ¬r).","answer":""},{"num":4,"question":"Viết code Z3 kiểm tra buffer overflow cho mảng kích thước 128 (thay vì 64 như slide), với index BitVec 32-bit.","answer":""},{"num":5,"question":"Với bài toán ở câu 4, thêm giả thiết ”đã kiểm tra biên” và xác nhận kết quả chuyển từ sat sang unsat.","answer":""},{"num":6,"question":"Viết code Z3 kiểm tra integer overflow cho phép nhân với elem_size=8 (thay vì 4 như slide).","answer":""},{"num":7,"question":"Viết công thức Z3 kiểm tra ”tồn tại x sao cho x/y gây chia cho 0” (y=0).","answer":""},{"num":8,"question":"Thêm giả thiết y != 0 vào bài toán câu 7, xác nhận kết quả unsat.","answer":""},{"num":9,"question":"Viết code Z3 dùng Array Theory: ghi giá trị 0x42 tại địa chỉ 200, đọc lại xác nhận đúng giá trị.","answer":""},{"num":10,"question":"Dùng Z3 tìm 2 số nguyên x, y sao cho x · y = 24 và x + y = 10.","answer":""},{"num":11,"question":"Viết ví dụ assert_and_track với 4 ràng buộc, tìm unsat core (2 ràng buộc gây mâu thuẫn thực sự).","answer":""},{"num":12,"question":"Viết công thức Z3 kiểm tra thuộc tính ”index luôn nhỏ hơn length của mảng” cho một hàm truy cập mảng động.","answer":""},{"num":13,"question":"Dùng BitVec 16-bit (thay vì 32-bit), lặp lại bài toán integer overflow và so sánh kết quả.","answer":""},{"num":14,"question":"Viết code Z3 kiểm tra ”không tồn tại 2 số nguyên dương a,b sao cho a-b âm nếu a>b” (sanity check).","answer":""},{"num":15,"question":"Với ví dụ 2 số nguyên tổng bình phương bằng 25 (slide), tìm THÊM một cặp nghiệm khác ngoài (-3,4)/(3,4).","answer":""}],"thuc_te":[{"num":1,"question":"Một ngân hàng cần chứng minh module tính lãi suất KHÔNG BAO GIỜ cho kết quả âm. Đề xuất cách mã hóa bằng Z3 và quy trình xác nhận.","answer":""},{"num":2,"question":"Một công ty bảo mật phát hiện SMT solver mất QUÁ NHIỀU thời gian (giờ) trên một bài toán phức tạp. Đề xuất cách đơn giản hóa bài toán.","answer":""},{"num":3,"question":"Một dự án ô tô tự lái cần chứng minh ”xe không bao giờ tăng tốc khi phanh được nhấn”. Đề xuất mã hóa bằng SMT.","answer":""},{"num":4,"question":"Một tổ chức tài chính phát hiện Z3 báo unknown (không phải sat/unsat) cho một bài toán quan trọng. Phân tích nguyên nhân và đề xuất xử lý.","answer":""},{"num":5,"question":"Một công ty game dùng Z3 để kiểm tra game logic (không thể ”chết vô hạn”). Phân tích lợi ích so với test thủ công.","answer":""},{"num":6,"question":"Một dự án hàng không yêu cầu MỌI phép tính số học trong module điều khiển phải chứng minh không overflow. Đề xuất quy trình dùng Z3 hệ thống.","answer":""},{"num":7,"question":"Một tổ chức phát hiện một lỗi tương tự CVE (integer overflow) mà lẽ ra Z3 có thể đã ngăn chặn nếu áp dụng SỚM HƠN. Phân tích bài học.","answer":""},{"num":8,"question":"Một công ty blockchain dùng Z3 để verify smart contract TRƯỚC khi deploy (vì không thể sửa sau). Phân tích tầm quan trọng của bước này.","answer":""},{"num":9,"question":"Một dự án y tế cần chứng minh thuật toán tính liều lượng thuốc KHÔNG BAO GIỜ vượt ngưỡng an toàn. Đề xuất mã hóa bằng SMT và ý nghĩa unsat.","answer":""},{"num":10,"question":"Một tổ chức phát hiện 2 kỹ sư mã hóa CÙNG một thuộc tính bằng Z3 nhưng cho kết quả KHÁC NHAU. Phân tích khả năng lỗi trong encoding.","answer":""},{"num":11,"question":"Một công ty startup fintech mới học Z3, viết công thức SAI dẫn tới kết luận ”an toàn” trong khi thực tế có lỗi. Phân tích rủi ro của ”false sense of security” từ encoding sai.","answer":""},{"num":12,"question":"Một dự án quốc phòng yêu cầu MỌI công thức Z3 phải được review bởi 2 kỹ sư độc lập trước khi tin tưởng kết quả. Phân tích lý do yêu cầu này.","answer":""},{"num":13,"question":"Một tổ chức nghiên cứu dùng Z3 để tìm phản ví dụ cho một định lý toán học được đề xuất. Mô tả quy trình và giá trị học thuật.","answer":""},{"num":14,"question":"Một công ty phát hiện Z3 tìm ra lỗi CHỈ xảy ra với giá trị BIÊN cực đoan (INT_MAX, INT_MIN) mà testing thông thường bỏ sót. Phân tích giá trị của SMT so với testing.","answer":""},{"num":15,"question":"Một dự án IoT với vi xử lý yếu không thể chạy Z3 trực tiếp trên thiết bị. Đề xuất chạy verification OFFLINE trên máy phát triển trước khi build.","answer":""}]}},{"id":"3.5","title":"Kiểm chứng mô hình có giới hạn (Bounded Model Checking)","knowledge_summary":"Bounded Model Checking (BMC): giới hạn số lần unroll vòng lặp thành một hằng số k, quy toàn bộ bài toán kiểm chứng về công thức SAT/SMT. CBMC là công cụ BMC cho C/C++: cờ --unwind k giới hạn unroll tối đa k lần (quy tắc kinh nghiệm: k = số lần lặp tối đa + 1); --unwinding-assertions kiểm tra bound đã ĐỦ hay chưa (nếu thiếu, CBMC có thể báo SUCCESSFUL sai lầm dù chưa xét đủ vòng lặp). Các cờ kiểm tra thuộc tính: --bounds-check (truy cập ngoài biên mảng/con trỏ), --pointer-check (NULL deref, dangling), --div-by-zero-check, --signed-overflow-check. nondet_int() biểu diễn giá trị bất kỳ; __CPROVER_assume(cond) thêm giả thiết giới hạn không gian tìm kiếm. CBMC sound TRONG GIỚI HẠN bound đã unwind: kết quả “VERIFICATION SUCCESSFUL” (hay “0 of N failed”) nghĩa là KHÔNG có lỗi TRONG PHẠM VI đã kiểm tra, KHÔNG phải tuyệt đối trên mọi trường hợp. CBMC khác NuSMV/SPIN (Ch.1.5): nhận trực tiếp mã C, KHÔNG cần xây mô hình Kripke thủ công. Giới hạn chính: không mở rộng tốt cho hệ thống LỚN (state explosion tương tự Ch.1.5) – nên áp dụng CI/CD cho module lõi, tới hạn (parser, crypto) thay vì toàn bộ codebase. Nhờ symbolic execution tuần tự chính xác, CBMC vừa field-sensitive vừa flow-sensitive (Ch.3.2). cbmc --arch x86_64 chỉ định kiến trúc đích để mô hình hóa alignment/kích thước đúng.","categories":{"trac_nghiem":[{"num":1,"question":"Bounded Model Checking (BMC) là gì?","options":{"A":"Giới hạn số lần unroll vòng lặp, quy về SAT/SMT","B":"Kiểm tra không giới hạn số vòng lặp","C":"Không liên quan tới SAT/SMT","D":"Chỉ áp dụng cho Java"},"correct":"A","explanation":""},{"num":2,"question":"CBMC là công cụ dùng cho ngôn ngữ nào?","options":{"A":"Java","B":"C (và C++ ở mức độ nhất định)","C":"Python","D":"JavaScript"},"correct":"B","explanation":""},{"num":3,"question":"Cờ --unwind k trong CBMC dùng để làm gì?","options":{"A":"Giới hạn số lần unroll vòng lặp tối đa là k","B":"Tăng tốc độ biên dịch","C":"Không có tác dụng gì","D":"Chỉ dùng cho đệ quy"},"correct":"A","explanation":""},{"num":4,"question":"Nếu vòng lặp chạy tối đa 5 lần, cần --unwind bao nhiêu để đủ?","options":{"A":"5","B":"Ít nhất 6","C":"1","D":"Không cần unwind"},"correct":"B","explanation":""},{"num":5,"question":"--unwinding-assertions dùng để làm gì?","options":{"A":"Kiểm tra xem bound đã unwind có ĐỦ hay chưa","B":"Tắt toàn bộ kiểm tra","C":"Chỉ áp dụng cho biến số nguyên","D":"Không có tác dụng gì"},"correct":"A","explanation":""},{"num":6,"question":"Nếu KHÔNG dùng --unwinding-assertions, CBMC có thể báo gì SAI LẦM?","options":{"A":"”VERIFICATION SUCCESSFUL” dù chưa xét đủ số vòng lặp","B":"Luôn báo FAILURE","C":"Luôn crash","D":"Không có rủi ro gì"},"correct":"A","explanation":""},{"num":7,"question":"--bounds-check trong CBMC kiểm tra gì?","options":{"A":"Truy cập mảng/con trỏ ngoài biên object","B":"Kiểm tra cú pháp","C":"Kiểm tra tốc độ","D":"Không liên quan tới bộ nhớ"},"correct":"A","explanation":""},{"num":8,"question":"--pointer-check trong CBMC kiểm tra gì?","options":{"A":"Các vấn đề liên quan con trỏ (NULL deref, dangling...)","B":"Chỉ kiểm tra kiểu dữ liệu","C":"Không liên quan tới con trỏ","D":"Chỉ dùng cho mảng"},"correct":"A","explanation":""},{"num":9,"question":"--div-by-zero-check trong CBMC dùng để làm gì?","options":{"A":"Kiểm tra phép chia cho 0","B":"Kiểm tra tốc độ","C":"Không có tác dụng gì","D":"Chỉ dùng cho số thực"},"correct":"A","explanation":""},{"num":10,"question":"Trong ví dụ off-by-one write_n, CBMC báo lỗi tại đâu?","options":{"A":"Dòng gán buffer[i]=i khi i vượt biên","B":"Dòng khai báo buffer","C":"Không báo lỗi gì","D":"Chỉ báo lỗi ở hàm main"},"correct":"A","explanation":""},{"num":11,"question":"--malloc-may-fail --malloc-fail-null dùng để làm gì?","options":{"A":"Yêu cầu CBMC xét cả trường hợp malloc thất bại (trả NULL)","B":"Tắt malloc hoàn toàn","C":"Không có tác dụng gì","D":"Chỉ áp dụng cho calloc"},"correct":"A","explanation":""},{"num":12,"question":"CBMC dùng nondet_int() để làm gì?","options":{"A":"Biểu diễn giá trị ”bất kỳ” (không xác định) cho biến int","B":"Sinh số ngẫu nhiên có seed cố định","C":"Không có ý nghĩa gì","D":"Chỉ dùng cho debug"},"correct":"A","explanation":""},{"num":13,"question":"__CPROVER_assume(cond) dùng để làm gì?","options":{"A":"Thêm giả thiết (assumption) giới hạn không gian tìm kiếm","B":"Xóa toàn bộ điều kiện","C":"Không có tác dụng gì","D":"Chỉ dùng cho vòng lặp"},"correct":"A","explanation":""},{"num":14,"question":"CBMC là sound trong điều kiện nào?","options":{"A":"Sound tuyệt đối trong mọi trường hợp","B":"Sound TRONG GIỚI HẠN bound đã unwind","C":"Không bao giờ sound","D":"Chỉ sound với số thực"},"correct":"B","explanation":""},{"num":15,"question":"Nếu CBMC báo ”unwinding assertion FAILURE”, điều đó có nghĩa gì?","options":{"A":"Bound hiện tại CHƯA ĐỦ, cần tăng –unwind","B":"Chương trình chắc chắn có lỗi bảo mật","C":"Không có ý nghĩa gì","D":"Cần giảm –unwind"},"correct":"A","explanation":""}],"ly_thuyet":[{"num":1,"question":"Trình bày ý tưởng cốt lõi của Bounded Model Checking: unroll vòng lặp, quy về SAT/SMT.","answer":""},{"num":2,"question":"Giải thích tại sao BMC chỉ ”sound có điều kiện” (trong bound k đã chọn).","answer":""},{"num":3,"question":"Trình bày cờ --unwind, --unwinding-assertions của CBMC và tại sao PHẢI dùng cả hai cùng nhau.","answer":""},{"num":4,"question":"Giải thích rủi ro khi CBMC báo ”VERIFICATION SUCCESSFUL” nhưng KHÔNG dùng --unwinding-assertions.","answer":""},{"num":5,"question":"Mô tả các cờ --bounds-check, --pointer-check, --div-by-zero-check và loại lỗi mỗi cờ phát hiện.","answer":""},{"num":6,"question":"Trình bày ví dụ off-by-one (write_n) và giải thích cách CBMC định vị chính xác dòng lỗi.","answer":""},{"num":7,"question":"Giải thích nondet_int() và __CPROVER_assume(), cho ví dụ minh họa kiểm tra chia cho 0.","answer":""},{"num":8,"question":"Bàn luận: tại sao CBMC được coi là bước tiến từ NuSMV/SPIN (Ch.1.5) tới kiểm chứng mã nguồn thực tế?","answer":""},{"num":9,"question":"Trình bày quy tắc kinh nghiệm chọn --unwind k phù hợp cho một vòng lặp cụ thể.","answer":""},{"num":10,"question":"Giải thích giới hạn của CBMC: khi nào KHÔNG có ”unwind k đủ tuyệt đối” (input không giới hạn).","answer":""},{"num":11,"question":"Mô tả cách --malloc-may-fail --malloc-fail-null giúp CBMC mô hình hóa ĐÚNG ngữ nghĩa C thực tế.","answer":""},{"num":12,"question":"Trình bày cách tích hợp CBMC vào CI/CD, chỉ áp dụng cho module LÕI thay vì toàn bộ codebase.","answer":""},{"num":13,"question":"Giải thích tại sao CBMC thường CHẬM hơn Cppcheck, liên hệ trade- off Precision/Scalability (Ch.3.2).","answer":""},{"num":14,"question":"Bàn luận: CBMC field-sensitive/flow-sensitive như thế nào nhờ symbolic execution tuần tự?","answer":""},{"num":15,"question":"Trình bày cbmc --arch và tầm quan trọng của việc chỉ định đúng kiến trúc đích (liên hệ Alignment Ch.2.4).","answer":""}],"thuc_hanh":[{"num":1,"question":"Chạy cbmc --unwind 6 --function check_sum bmc_demo.c và ghi lại kết quả.","answer":""},{"num":2,"question":"Chạy lại câu 1 với --unwind 2 --unwinding-assertions, giải thích khác biệt kết quả.","answer":""},{"num":3,"question":"Chạy cbmc --bounds-check --pointer-check --unwind 12 --function check_overflow bmc_demo.c, ghi lại FAILURE tìm được.","answer":""},{"num":4,"question":"Sửa lỗi off-by-one trong write_n, chạy lại CBMC xác nhận VERIFICATION SUCCESSFUL.","answer":""},{"num":5,"question":"Chạy cbmc --div-by-zero-check --function check_divide bmc_demo.c (chưa guard), ghi lại FAILURE.","answer":""},{"num":6,"question":"Chạy cbmc --div-by-zero-check --function check_divide_guarded bmc_demo.c (đã guard), xác nhận SUCCESSFUL.","answer":""},{"num":7,"question":"Chạy cbmc --bounds-check --pointer-check --malloc-may-fail --malloc-fail-null --function check_heap bmc_demo.c.","answer":""},{"num":8,"question":"Dùng Python wrapper run_cbmc() (project) để chạy CBMC trên check_sum, in ra kết quả verification_successful.","answer":""},{"num":9,"question":"Viết test pytest xác nhận run_cbmc trả về True cho check_overflow_fixed.","answer":""},{"num":10,"question":"Viết test pytest xác nhận run_cbmc trả về False với failed_properties chứa ”pointer_dereference” cho check_overflow.","answer":""},{"num":11,"question":"Cho một hàm C mới với vòng lặp chạy đúng 8 lần, chọn --unwind phù hợp và xác nhận bằng --unwinding-assertions.","answer":""},{"num":12,"question":"Viết hàm C có lỗi UAF, chạy CBMC với --pointer-check để phát hiện.","answer":""},{"num":13,"question":"Sửa lỗi UAF ở câu 12, chạy lại xác nhận VERIFICATION SUCCESSFUL.","answer":""},{"num":14,"question":"Viết Makefile với target verify chạy CBMC với cờ đầy đủ trên một hàm chỉ định qua biến FUNC.","answer":""},{"num":15,"question":"Chạy CBMC với --arch x86_64 và không chỉ định arch, so sánh kết quả cho một struct có alignment nhạy cảm.","answer":""}],"thuc_te":[{"num":1,"question":"Một ngân hàng phát hiện module tính lãi suất có vòng lặp phụ thuộc số ngày (tối đa 366). Đề xuất --unwind phù hợp và giải thích lựa chọn.","answer":""},{"num":2,"question":"Một công ty phát hiện CBMC báo ”SUCCESSFUL” nhưng KHÔNG dùng --unwinding-assertions, sau đó lỗi vẫn xảy ra production. Phân tích nguyên nhân và bài học.","answer":""},{"num":3,"question":"Một dự án hàng không cần verify module xử lý dữ liệu cảm biến với input KHÔNG GIỚI HẠN về mặt lý thuyết. Đề xuất chiến lược bound thực tế hợp lý.","answer":""},{"num":4,"question":"Một tổ chức phát hiện chạy CBMC trên MODULE LỚN (10000 dòng) mất hơn 24 giờ không xong. Đề xuất chia nhỏ phạm vi kiểm chứng.","answer":""},{"num":5,"question":"Một công ty bảo mật phát hiện một lỗi UAF mà CBMC với --pointer-check đã lẽ ra phát hiện được nếu được chạy sớm hơn. Phân tích quy trình QA thiếu sót.","answer":""},{"num":6,"question":"Một dự án ô tô yêu cầu CBMC verify module phanh khẩn cấp với TẤT CẢ cờ kiểm tra bật. Đề xuất quy trình CI tích hợp đầy đủ.","answer":""},{"num":7,"question":"Một tổ chức tài chính phát hiện 2 kỹ sư chọn --unwind KHÁC NHAU cho CÙNG một hàm, dẫn tới kết luận khác nhau. Đề xuất chuẩn hóa quy tắc chọn unwind.","answer":""},{"num":8,"question":"Một công ty IoT dùng CBMC OFFLINE (không tích hợp CI) do thiết bị tài nguyên hạn chế không thể chạy trực tiếp. Phân tích quy trình verify trước khi flash firmware.","answer":""},{"num":9,"question":"Một dự án blockchain dùng CBMC để verify smart contract compiler (viết bằng C++) TRƯỚC khi release. Phân tích tầm quan trọng của bước không thể bỏ qua này.","answer":""},{"num":10,"question":"Một tổ chức y tế cần verify thuật toán tính liều lượng thuốc bằng CBMC. Đề xuất các cờ (--bounds-check, --div-by-zero-check) cần bật và lý do.","answer":""},{"num":11,"question":"Một công ty phát hiện CBMC KHÔNG THỂ verify một hàm gọi thư viện ngoài không có source code. Đề xuất giải pháp (stub function, hoặc chuyển sang testing).","answer":""},{"num":12,"question":"Một dự án quốc phòng yêu cầu MỌI kết quả CBMC phải kèm bằng chứng --unwinding-assertions PASS. Phân tích lý do yêu cầu nghiêm ngặt này.","answer":""},{"num":13,"question":"Một tổ chức phát hiện việc tăng --unwind từ 10 lên 50 làm lộ ra lỗi MỚI trước đó bị bỏ sót. Phân tích ý nghĩa và đề xuất quy trình tăng dần bound có hệ thống.","answer":""},{"num":14,"question":"Một công ty game engine cân nhắc dùng CBMC cho physics engine (nhiều vòng lặp phức tạp). Phân tích tính khả thi và giới hạn state explosion.","answer":""},{"num":15,"question":"Một dự án hàng không vũ trụ dùng CBMC verify MỌI function trong module điều khiển TRƯỚC KHI phóng. Phân tích lý do đây là cơ hội DUY NHẤT để phát hiện lỗi.","answer":""}]}},{"id":"3.6","title":"Mô hình bộ nhớ (Memory Model)","knowledge_summary":"Memory Model trừu tượng cần thiết vì bộ nhớ vật lý thực tế quá chi tiết cho SMT solving. CBMC mô hình hóa mỗi vùng cấp phát (biến local, malloc, mảng toàn cục) như một object riêng biệt (ID, kích thước, trạng thái); con trỏ được biểu diễn bằng cặp (object_id, offset) – ứng với Array Theory (Mục 3.4): object tương ứng mảng, offset tương ứng chỉ số, Select(object, offset) = đọc, Store(object, offset, value) = ghi. Points-to Analysis: xác định tập object mà một con trỏ CÓ THỂ trỏ tới – ứng dụng phát hiện dangling pointer, Use-After-Free (Ch.2.2). Alias Analysis: xác định hai biểu thức con trỏ có thể trỏ CÙNG vùng nhớ hay không; May-alias (CÓ THỂ trỏ cùng chỗ) khác Must-alias (CHẮC CHẮN trỏ cùng chỗ). Alias analysis quá thận trọng (over-approximate) → tăng false positive. Field-sensitive (CBMC): theo dõi RIÊNG từng field của struct, cần biết chính xác offsetof (Ch.2.4) để phát hiện đúng lỗi trên field cụ thể – khác Field-insensitive (Cppcheck heuristic đơn giản) coi cả struct là một object. Flow-sensitive: biết chính xác trạng thái TẠI TỪNG ĐIỂM trong chương trình – giúp CBMC phân biệt “trước free” và “sau free”. Alignment/Padding và Bitfields (Ch.2.4) gây khó khăn cho Memory Model hình thức vì layout phụ thuộc compiler/kiến trúc. Union type punning: cùng một vùng nhớ được diễn giải theo nhiều kiểu dữ liệu khác nhau. Mục 3.6 là nền tảng hội tụ toàn bộ Chương 3: SAT/SMT (3.4) biểu diễn bộ nhớ qua Array Theory, CBMC (3.5) áp dụng mô hình này thực tế, và kết nối sang Chương 4 (hiểu cấu trúc bộ nhớ giúp thiết kế fuzzing harness hiệu quả).","categories":{"trac_nghiem":[{"num":1,"question":"Vì sao cần một Memory Model trừu tượng cho công cụ phân tích tĩnh?","options":{"A":"Bộ nhớ vật lý thực tế quá chi tiết, cần trừu tượng hóa cho SMT solving","B":"Không cần thiết, có thể dùng địa chỉ vật lý trực tiếp","C":"Chỉ để tăng tốc độ biên dịch","D":"Không liên quan tới SMT"},"correct":"A","explanation":""},{"num":2,"question":"CBMC mô hình hóa mỗi vùng nhớ cấp phát như thế nào?","options":{"A":"Một object riêng biệt có ID, kích thước, trạng thái","B":"Không phân biệt các vùng nhớ","C":"Chỉ dùng địa chỉ số nguyên đơn giản","D":"Không mô hình hóa gì"},"correct":"A","explanation":""},{"num":3,"question":"Con trỏ trong mô hình CBMC được biểu diễn bằng:","options":{"A":"Chỉ một số nguyên duy nhất","B":"Cặp (object_id, offset)","C":"Chuỗi ký tự","D":"Không biểu diễn được"},"correct":"B","explanation":""},{"num":4,"question":"Points-to Analysis xác định điều gì?","options":{"A":"Tập hợp object mà một con trỏ CÓ THỂ trỏ tới","B":"Giá trị chính xác của con trỏ","C":"Kích thước của con trỏ","D":"Không liên quan tới con trỏ"},"correct":"A","explanation":""},{"num":5,"question":"Alias Analysis xác định điều gì?","options":{"A":"Hai biểu thức con trỏ có thể trỏ CÙNG vùng nhớ hay không","B":"Tốc độ truy cập bộ nhớ","C":"Kích thước bộ nhớ khả dụng","D":"Không liên quan tới con trỏ"},"correct":"A","explanation":""},{"num":6,"question":"Alias Analysis ”quá thận trọng” (over-approximate nhiều) gây ra hậu quả gì?","options":{"A":"Tăng false positive do nghĩ 2 con trỏ alias nhau dù thực tế không","B":"Không có hậu quả gì","C":"Luôn giảm false positive","D":"Tăng tốc độ phân tích"},"correct":"A","explanation":""},{"num":7,"question":"CBMC dùng lý thuyết SMT nào để mô hình hóa bộ nhớ?","options":{"A":"Array Theory (Ch.3.4)","B":"Chỉ dùng số nguyên đơn giản","C":"Không dùng lý thuyết SMT nào","D":"Chỉ dùng Boolean logic"},"correct":"A","explanation":""},{"num":8,"question":"Select(object, offset) trong mô hình bộ nhớ tương ứng thao tác nào?","options":{"A":"Đọc giá trị tại offset của object","B":"Ghi giá trị","C":"Xóa object","D":"Không có ý nghĩa gì"},"correct":"A","explanation":""},{"num":9,"question":"Store(object, offset, value) tương ứng thao tác nào?","options":{"A":"Đọc giá trị","B":"Ghi giá trị vào offset của object","C":"Xóa toàn bộ object","D":"Không có ý nghĩa gì"},"correct":"B","explanation":""},{"num":10,"question":"Field-sensitive Analysis theo dõi điều gì khác Field-insensitive?","options":{"A":"Theo dõi RIÊNG từng field của struct thay vì coi cả struct là 1 object","B":"Không có khác biệt","C":"Field-insensitive luôn chính xác hơn","D":"Chỉ áp dụng cho union"},"correct":"A","explanation":""},{"num":11,"question":"CBMC có field-sensitive không?","options":{"A":"Không bao giờ","B":"Có, nhờ mô hình hóa offset chính xác từng field","C":"Chỉ với mảng, không với struct","D":"Chỉ với con trỏ NULL"},"correct":"B","explanation":""},{"num":12,"question":"Flow-sensitive Analysis có đặc điểm gì?","options":{"A":"Không quan tâm thứ tự câu lệnh","B":"Biết CHÍNH XÁC trạng thái tại từng điểm cụ thể trong chương trình","C":"Chỉ áp dụng cho vòng lặp","D":"Luôn kém chính xác hơn flow-insensitive"},"correct":"B","explanation":""},{"num":13,"question":"CBMC phân biệt được ”trước free” và ”sau free” nhờ tính chất nào?","options":{"A":"Flow-sensitive","B":"Field-insensitive","C":"Không phân biệt được","D":"Chỉ dựa vào tên biến"},"correct":"A","explanation":""},{"num":14,"question":"Alignment/Padding (Ch.2.4) liên hệ thế nào với Memory Model của CBMC?","options":{"A":"CBMC cần mô hình hóa CHÍNH XÁC offset để phát hiện đúng lỗi trên struct","B":"Không liên quan gì","C":"Chỉ ảnh hưởng tốc độ biên dịch","D":"Chỉ áp dụng cho Python"},"correct":"A","explanation":""},{"num":15,"question":"cbmc --arch ảnh hưởng thế nào tới Memory Model?","options":{"A":"Không ảnh hưởng gì","B":"Xác định alignment/kích thước kiểu dữ liệu đúng theo kiến trúc đích","C":"Chỉ ảnh hưởng tên hàm","D":"Chỉ dùng cho ARM"},"correct":"B","explanation":""}],"ly_thuyet":[{"num":1,"question":"Trình bày lý do cần một Memory Model TRỪU TƯỢNG thay vì dùng địa chỉ bộ nhớ vật lý trực tiếp trong công cụ phân tích tĩnh.","answer":""},{"num":2,"question":"Giải thích cách CBMC mô hình hóa mỗi vùng nhớ cấp phát như một ”object” riêng biệt (ID, kích thước, trạng thái).","answer":""},{"num":3,"question":"Mô tả cách con trỏ được biểu diễn trong CBMC qua cặp (object_id, offset).","answer":""},{"num":4,"question":"Trình bày Points-to Analysis: định nghĩa, cách hoạt động, và ứng dụng phát hiện UAF/dangling pointer.","answer":""},{"num":5,"question":"Giải thích Alias Analysis và phân biệt May-alias với Must-alias.","answer":""},{"num":6,"question":"Bàn luận: tại sao Alias Analysis ”quá thận trọng” (over-approximate) là nguyên nhân phổ biến gây false positive.","answer":""},{"num":7,"question":"Trình bày cách CBMC dùng Array Theory (Ch.3.4) để mô hình hóa bộ nhớ qua Store/Select.","answer":""},{"num":8,"question":"Giải thích Field-sensitive Analysis và so sánh với Field-insensitive, cho ví dụ minh họa struct cụ thể.","answer":""},{"num":9,"question":"Mô tả Flow-sensitive Analysis và giải thích cách nó giúp CBMC phân biệt ”trước free” và ”sau free”.","answer":""},{"num":10,"question":"Trình bày mối liên hệ giữa Alignment/Padding (Ch.2.4) và độ chính xác của Memory Model trong CBMC.","answer":""},{"num":11,"question":"Giải thích tác dụng của cbmc --arch trong việc đảm bảo Memory Model đúng theo kiến trúc đích.","answer":""},{"num":12,"question":"Bàn luận về khó khăn của Bitfields (Ch.2.4) đối với việc xây dựng Memory Model hình thức portable.","answer":""},{"num":13,"question":"Mô tả Union Type Punning và cách nó thách thức Memory Model (một vùng nhớ, nhiều cách diễn giải).","answer":""},{"num":14,"question":"Giải thích tại sao độ chính xác Memory Model ảnh hưởng TRỰC TIẾP tới cả độ chính xác VÀ tốc độ của toàn bộ công cụ phân tích.","answer":""},{"num":15,"question":"Trình bày cách offsetof (Ch.2.4) được CBMC sử dụng để mô hình hóa CHÍNH XÁC vị trí field trong struct.","answer":""}],"thuc_hanh":[{"num":1,"question":"Viết công thức Z3 dùng Array Theory biểu diễn một object bộ nhớ 32-bit address space, 8-bit value.","answer":""},{"num":2,"question":"Với struct {char flag; int value;}, viết ra offsetof từng field và giải thích CBMC dùng thông tin này thế nào.","answer":""},{"num":3,"question":"Viết đoạn code C với 2 con trỏ p,q có thể MAY-alias (tùy điều kiện runtime), minh họa bằng if/else.","answer":""},{"num":4,"question":"Cho code câu 3, dùng Z3 kiểm tra xem p,q CÓ THỂ trỏ cùng địa chỉ trong TRƯỜNG HỢP CỤ THỂ nào.","answer":""},{"num":5,"question":"Chạy CBMC trên hàm dùng union type punning, quan sát cách CBMC xử lý việc đọc lại dữ liệu qua kiểu khác.","answer":""},{"num":6,"question":"Viết đoạn code C minh họa Points-to: con trỏ p trỏ tới biến a hoặc b tùy điều kiện, liệt kê Points-to(p).","answer":""},{"num":7,"question":"Chạy cbmc --arch x86_64 và cbmc --arch arm64 (nếu khả dụng) trên MỘT struct có bitfields, so sánh kết quả.","answer":""},{"num":8,"question":"Viết hàm C có lỗi off-by-one TRÊN MỘT FIELD CỤ THỂ của struct (không phải biến đơn), chạy CBMC field-sensitive xác nhận phát hiện đúng field.","answer":""},{"num":9,"question":"Cho một hàm free() một con trỏ rồi dùng lại (UAF), chạy CBMC với --pointer-check, xác nhận nó phân biệt trước/sau free (flow-sensitive).","answer":""},{"num":10,"question":"Viết công thức Z3 Array Theory mô hình hóa memcpy: ghi N byte từ nguồn sang đích.","answer":""},{"num":11
