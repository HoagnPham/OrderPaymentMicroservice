<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập An toàn phần mềm (Rút gọn) · CSE703093</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg: #10131a;
    --bg-alt: #0b0d12;
    --panel: #191d28;
    --panel-2: #1f2432;
    --border: rgba(232,236,245,0.09);
    --border-strong: rgba(232,236,245,0.16);
    --text: #e7e9f2;
    --text-dim: #9aa0b4;
    --text-faint: #656b80;
    --gold: #e8a33d;
    --gold-dim: #a97a34;
    --green: #3ecf8e;
    --red: #f0555b;
    --blue: #5eb7f0;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --radius: 3px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(94,183,240,0.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    line-height:1.5;
  }

  /* Scanline texture overlay, subtle */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    opacity:0.5;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  ::selection{background:rgba(232,163,61,0.3);}

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 80px;
    position:relative;
    z-index:1;
  }

  /* ---------- Header ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding-bottom:20px;
    margin-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
  }
  .brand-mark{
    width:34px;height:34px;
    border:1.5px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:13px; font-weight:700;
    color:var(--gold);
    flex-shrink:0;
    position:relative;
  }
  .brand-mark::after{
    content:"";
    position:absolute; inset:-5px;
    border:1px solid rgba(232,163,61,0.25);
    border-radius:50%;
  }
  .brand-text .t1{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--text-faint);
  }
  .brand-text .t2{
    font-weight:600; font-size:15.5px; color:var(--text);
    letter-spacing:0.01em;
  }
  .course-tag{
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    border:1px solid var(--border-strong); padding:5px 10px; border-radius:var(--radius);
    white-space:nowrap;
  }

  /* ---------- Breadcrumb ---------- */
  .crumbs{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-family:var(--mono); font-size:12px; color:var(--text-dim);
    margin-bottom:22px;
  }
  .crumbs .seg{cursor:pointer; padding:2px 4px;}
  .crumbs .seg:hover{color:var(--gold);}
  .crumbs .seg.current{color:var(--text); cursor:default;}
  .crumbs .sep{color:var(--text-faint);}

  /* ---------- Section title block ---------- */
  .page-head{margin-bottom:22px;}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow .line{flex:1; height:1px; background:linear-gradient(90deg, rgba(232,163,61,0.35), transparent);}
  h1.page-title{
    font-size:24px; margin:0 0 6px; font-weight:600; letter-spacing:-0.01em;
  }
  .page-sub{color:var(--text-dim); font-size:14px; max-width:640px;}

  /* ---------- Chapter grid (home) ---------- */
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  @media(max-width:640px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    cursor:pointer;
    transition:border-color .15s, transform .15s, background .15s;
    position:relative;
    overflow:hidden;
  }
  .card:hover{border-color:var(--border-strong); background:var(--panel-2); transform:translateY(-1px);}
  .card .idx{
    font-family:var(--mono); font-size:11px; color:var(--gold-dim);
    letter-spacing:0.08em;
  }
  .card h3{margin:6px 0 6px; font-size:16.5px; font-weight:600;}
  .card .meta{
    font-family:var(--mono); font-size:11.5px; color:var(--text-faint);
    display:flex; gap:14px; margin-top:10px;
  }
  .card .meta span{display:flex; align-items:center; gap:5px;}
  .card .bar{
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:rgba(232,163,61,0.35);
  }

  /* list row (sections, categories) */
  .row-list{display:flex; flex-direction:column; gap:10px;}
  .row{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .row:hover{border-color:var(--border-strong); background:var(--panel-2);}
  .row-left{display:flex; align-items:center; gap:13px; min-width:0;}
  .row-id{
    font-family:var(--mono); font-size:11.5px; color:var(--gold);
    border:1px solid rgba(232,163,61,0.3); border-radius:var(--radius);
    padding:3px 7px; flex-shrink:0;
  }
  .row-title{font-size:14.5px; font-weight:500; min-width:0;}
  .row-right{
    font-family:var(--mono); font-size:11.5px; color:var(--text-faint);
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .chev{color:var(--text-faint); font-size:14px;}

  /* category tiles inside section view */
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:560px){.cat-grid{grid-template-columns:1fr;}}
  .cat-tile{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .cat-tile:hover{border-color:var(--border-strong); background:var(--panel-2);}
  .cat-tile.disabled{opacity:0.35; cursor:not-allowed;}
  .cat-tile.disabled:hover{border-color:var(--border); background:var(--panel);}
  .cat-top{display:flex; align-items:center; justify-content:space-between;}
  .cat-icon{
    font-family:var(--mono); font-size:11px; padding:3px 7px; border-radius:var(--radius);
    border:1px solid; letter-spacing:0.04em;
  }
  .cat-icon.tn{color:var(--blue); border-color:rgba(94,183,240,0.35);}
  .cat-icon.lt{color:var(--gold); border-color:rgba(232,163,61,0.35);}
  .cat-icon.th{color:var(--green); border-color:rgba(62,207,142,0.35);}
  .cat-icon.tt{color:#c48bf0; border-color:rgba(196,139,240,0.35);}
  .cat-count{font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}
  .cat-name{font-size:15px; font-weight:600; margin-top:10px;}
  .cat-desc{font-size:12.5px; color:var(--text-dim); margin-top:3px;}

  .summary-link{
    margin-top:16px; display:inline-flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:12px; color:var(--text-dim);
    border:1px dashed var(--border-strong); padding:9px 13px; border-radius:var(--radius);
    cursor:pointer;
  }
  .summary-link:hover{color:var(--gold); border-color:var(--gold-dim);}

  /* ---------- Practice header / progress ---------- */
  .practice-bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .prog-wrap{flex:1; min-width:160px;}
  .prog-label{
    font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:6px;
    display:flex; justify-content:space-between;
  }
  .prog-track{height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden;}
  .prog-fill{height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); transition:width .25s;}
  .score-pill{
    font-family:var(--mono); font-size:12px; display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:7px 12px; white-space:nowrap;
  }
  .score-pill .ok{color:var(--green);}
  .score-pill .bad{color:var(--red);}
  .exit-btn{
    font-family:var(--mono); font-size:11.5px; color:var(--text-faint);
    border:1px solid var(--border-strong); padding:7px 11px; border-radius:var(--radius);
    cursor:pointer; background:none;
  }
  .exit-btn:hover{color:var(--text); border-color:var(--text-dim);}

  /* ---------- Question card ---------- */
  .qcard{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:26px 26px 22px;
  }
  @media(max-width:600px){.qcard{padding:20px 16px 18px;}}
  .qid{
    font-family:var(--mono); font-size:11px; color:var(--gold-dim);
    letter-spacing:0.06em; margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .qid .dot{width:4px;height:4px;border-radius:50%;background:var(--gold-dim);}
  .qtext{font-size:16.5px; line-height:1.6; font-weight:500; margin-bottom:20px;}
  .qtext p{margin:0 0 12px;}
  .qtext p:last-child{margin-bottom:0;}
  .qtext pre{
    background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; overflow-x:auto; font-family:var(--mono); font-size:13px; color:#c9d6e8;
    margin:10px 0;
  }

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:12px;
    border:1px solid var(--border-strong); border-radius:var(--radius);
    padding:12px 14px; cursor:pointer; text-align:left;
    background:var(--bg-alt); color:var(--text); font-size:14.5px; line-height:1.5;
    transition:border-color .12s, background .12s;
    font-family:var(--sans);
  }
  .opt:hover:not(.locked){border-color:var(--gold-dim); background:rgba(232,163,61,0.06);}
  .opt .lab{
    font-family:var(--mono); font-size:12px; color:var(--text-faint); flex-shrink:0;
    width:20px; height:20px; border:1px solid var(--border-strong); border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .opt.locked{cursor:default;}
  .opt.correct{border-color:var(--green); background:rgba(62,207,142,0.08);}
  .opt.correct .lab{border-color:var(--green); color:var(--green);}
  .opt.wrong{border-color:var(--red); background:rgba(240,85,91,0.08);}
  .opt.wrong .lab{border-color:var(--red); color:var(--red);}
  .opt.dim{opacity:0.5;}

  .verdict{
    margin-top:16px; padding:13px 15px; border-radius:var(--radius);
    font-size:13.5px; display:none; align-items:flex-start; gap:10px;
  }
  .verdict.show{display:flex;}
  .verdict.ok{background:rgba(62,207,142,0.09); border:1px solid rgba(62,207,142,0.3);}
  .verdict.bad{background:rgba(240,85,91,0.09); border:1px solid rgba(240,85,91,0.3);}
  .verdict .vtag{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.06em;
    padding:2px 7px; border-radius:2px; flex-shrink:0; margin-top:1px;
  }
  .verdict.ok .vtag{background:var(--green); color:#0a1a12;}
  .verdict.bad .vtag{background:var(--red); color:#2a0a0b;}
  .verdict .vtext{color:var(--text-dim); line-height:1.55;}
  .verdict .vtext b{color:var(--text); font-weight:600;}

  /* essay-type answer flow */
  .self-answer{
    width:100%; min-height:74px; resize:vertical;
    background:var(--bg-alt); border:1px solid var(--border-strong); border-radius:var(--radius);
    color:var(--text); font-family:var(--sans); font-size:14px; padding:12px 14px;
    margin-bottom:14px; line-height:1.5;
  }
  .self-answer::placeholder{color:var(--text-faint);}
  .self-answer:focus{outline:none; border-color:var(--gold-dim);}

  .reveal-box{
    display:none; margin-top:6px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg-alt); padding:16px; margin-bottom:16px;
  }
  .reveal-box.show{display:block;}
  .reveal-label{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:8px;
  }
  .reveal-label.model{color:var(--blue);}
  .reveal-label.summary{color:var(--gold);}
  .reveal-text{font-size:14px; color:var(--text-dim); line-height:1.6;}
  .reveal-text p{margin:0 0 10px;}
  .reveal-text p:last-child{margin-bottom:0;}
  .reveal-note{
    font-size:12px; color:var(--text-faint); margin-top:10px; font-style:italic;
  }

  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
  .btn{
    font-family:var(--mono); font-size:13px; padding:10px 16px; border-radius:var(--radius);
    border:1px solid var(--border-strong); background:var(--bg-alt); color:var(--text);
    cursor:pointer; transition:border-color .12s, background .12s;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{
    background:var(--gold); border-color:var(--gold); color:#241804; font-weight:600;
  }
  .btn.primary:hover{background:#f0af52;}
  .btn.ghost-ok{color:var(--green); border-color:rgba(62,207,142,0.4);}
  .btn.ghost-ok:hover{background:rgba(62,207,142,0.08);}
  .btn.ghost-bad{color:var(--red); border-color:rgba(240,85,91,0.4);}
  .btn.ghost-bad:hover{background:rgba(240,85,91,0.08);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn.selected-ok{background:rgba(62,207,142,0.15); border-color:var(--green); color:var(--green);}
  .btn.selected-bad{background:rgba(240,85,91,0.15); border-color:var(--red); color:var(--red);}

  .nav-row{display:flex; justify-content:flex-end; margin-top:20px;}

  /* ---------- results screen ---------- */
  .result-wrap{text-align:center; padding:40px 20px;}
  .result-score{
    font-family:var(--mono); font-size:52px; font-weight:700; color:var(--gold);
    margin-bottom:6px;
  }
  .result-label{color:var(--text-dim); font-size:14px; margin-bottom:28px;}
  .result-bars{display:flex; flex-direction:column; gap:10px; max-width:360px; margin:0 auto 30px;}
  .rbar-row{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px;}
  .rbar-track{flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
  .rbar-fill{height:100%; background:var(--green);}
  .rbar-fill.bad{background:var(--red);}

  /* ---------- knowledge summary view ---------- */
  .summary-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 24px; font-size:14.5px; color:var(--text-dim); line-height:1.7;
  }
  .summary-card p{margin:0 0 13px;}
  .summary-card p:last-child{margin:0;}

  footer.app-footer{
    text-align:center; margin-top:50px; font-family:var(--mono); font-size:11px; color:var(--text-faint);
  }

  .hidden{display:none !important;}

  @media(max-width:600px){
    h1.page-title{font-size:20px;}
    .qtext{font-size:15.5px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script id="data-script">
const QUIZ_DATA = [{"title":"Chương 1: Giới thiệu về An toàn phần mềm","sections":[{"id":"1.1","title":"Các khái niệm về an toàn phần mềm","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"An toàn phần mềm (software security) được định nghĩa là khả năng của phần mềm:","options":{"A":"Chạy nhanh trong mọi điều kiện phần cứng","B":"Tiếp tục hoạt động đúng đắn và chống chịu được tấn công có chủ đích","C":"Không bao giờ có lỗi lập trình","D":"Tương thích với mọi hệ điều hành"},"correct":"B","explanation":"Security là khả năng chống chịu tấn công chủ đích, không phải chạy nhanh hay không có lỗi."},{"num":2,"question":"Sự khác biệt cốt lõi giữa Reliability và Security là gì?","options":{"A":"Reliability chỉ áp dụng cho phần cứng","B":"Security đối phó với đối thủ chủ động, Reliability đối phó với lỗi ngẫu nhiên","C":"Không có sự khác biệt, hai khái niệm đồng nhất","D":"Security chỉ liên quan tới mã hóa dữ liệu"},"correct":"B","explanation":"Security đối phó đối thủ chủ động; Reliability đối phó lỗi ngẫu nhiên."},{"num":3,"question":"Đâu là ví dụ về hệ thống vừa cần Safety vừa cần Security?","options":{"A":"Máy tính cá nhân dùng để soạn thảo văn bản","B":"Ô tô tự lái","C":"Máy in văn phòng","D":"Đồng hồ báo thức"},"correct":"B","explanation":"Ô tô tự lái cần Safety (không gây hại vật lý) và Security (chống hack)."},{"num":4,"question":"Thuộc tính nào trong CIA Triad bị vi phạm khi kẻ tấn công đọc trộm dữ liệu nhạy cảm?","options":{"A":"Confidentiality","B":"Integrity","C":"Availability","D":"Authentication"},"correct":"A","explanation":"Đọc trộm dữ liệu vi phạm Confidentiality."},{"num":5,"question":"Một cuộc tấn công DDoS chủ yếu vi phạm thuộc tính nào?","options":{"A":"Confidentiality","B":"Integrity","C":"Availability","D":"Non-repudiation"},"correct":"C","explanation":"DDoS làm hệ thống không khả dụng, vi phạm Availability."},{"num":6,"question":"SQL Injection sửa đổi dữ liệu trái phép trong CSDL vi phạm thuộc tính nào?","options":{"A":"Confidentiality","B":"Integrity","C":"Availability","D":"Authorization"},"correct":"B","explanation":"Sửa dữ liệu trái phép vi phạm Integrity."},{"num":7,"question":"Non-repudiation có nghĩa là gì?","options":{"A":"Không thể chối bỏ hành động đã thực hiện","B":"Không thể truy cập hệ thống","C":"Không thể mã hóa dữ liệu","D":"Không thể sao lưu dữ liệu"},"correct":"A","explanation":"Non-repudiation = không thể chối bỏ hành động."},{"num":8,"question":"Accountability trong an toàn thông tin nhấn mạnh điều gì?","options":{"A":"Khả năng truy vết trách nhiệm của hành động","B":"Tốc độ xử lý giao dịch","C":"Khả năng mở rộng của hệ thống","D":"Chi phí vận hành hệ thống"},"correct":"A","explanation":"Accountability = khả năng truy vết trách nhiệm."}],"ly_thuyet":[{"num":1,"question":"Trình bày định nghĩa của an toàn phần mềm (software security) và chỉ ra điểm khác biệt với độ tin cậy (reliability).","answer":"An toàn phần mềm là khả năng phần mềm tiếp tục hoạt động đúng khi bị tấn công chủ đích, khác Reliability (chỉ đối phó lỗi ngẫu nhiên) vì phải tính đến đối thủ thông minh, thích nghi."},{"num":2,"question":"Mô tả bộ ba CIA (Confidentiality, Integrity, Availability) và cho ví dụ vi phạm mỗi thuộc tính.","answer":"CIA: Confidentiality (chỉ người được phép mới đọc được), Integrity (dữ liệu không bị sửa trái phép), Availability (hệ thống sẵn sàng phục vụ). VD vi phạm: rò rỉ dữ liệu (C), SQL injection sửa DB (I), DDoS (A)."},{"num":3,"question":"Giải thích mối quan hệ giữa Threat, Vulnerability và Risk. Vẽ sơ đồ minh họa nếu cần.","answer":"Threat là tác nhân có khả năng gây hại; Vulnerability là điểm yếu bị khai thác; Risk = hàm số của Likelihood (threat khai thác được vuln) và Impact."},{"num":4,"question":"Bàn luận: tại sao ”Risk = Likelihood × Impact” chỉ là công thức định tính, không phải công thức toán học chính xác?","answer":"Công thức chỉ định tính vì Likelihood và Impact không đo lường được chính xác bằng số học chặt chẽ – thường dựa trên đánh giá chuyên gia, thang định tính (thấp/trung bình/cao)."},{"num":5,"question":"Phân biệt Security và Safety. Cho ví dụ một hệ thống cần cả hai và giải thích vì sao.","answer":"Safety: không gây hại cho người/môi trường dù có lỗi ngẫu nhiên. Security: chống chịu tấn công chủ đích. VD: ô tô tự lái cần cả hai vì lỗi phần mềm có thể gây tai nạn (safety) và có thể bị hack để gây tai nạn cố ý (security)."},{"num":6,"question":"Giải thích khái niệm Attack Surface và Attack Vector, chỉ ra mối quan hệ giữa chúng.","answer":"Attack Surface là tổng mọi điểm tương tác có thể; Attack Vector là con đường/kỹ thuật cụ thể khai thác MỘT điểm trên attack surface đó."},{"num":7,"question":"Mô tả nguyên lý Least Privilege và giải thích tại sao nó giảm thiểu thiệt hại khi hệ thống bị xâm nhập.","answer":"Least Privilege: mỗi thực thể chỉ có quyền tối thiểu cần thiết, giúp giới hạn phạm vi thiệt hại nếu một thành phần bị xâm nhập (không lan rộng ra toàn hệ thống)."},{"num":8,"question":"Trình bày khái niệm Defense in Depth. Tại sao không nên chỉ dựa vào một lớp bảo vệ duy nhất?","answer":"Defense in Depth dùng nhiều lớp bảo vệ độc lập (mạng, OS, ứng dụng, dữ liệu) vì không lớp nào là tuyệt đối – nếu một lớp bị vượt qua, lớp khác vẫn có thể chặn."},{"num":9,"question":"Giải thích nguyên lý Kerckhoffs và ý nghĩa của nó đối với thiết kế hệ thống mật mã hiện đại.","answer":"Kerckhoffs: hệ mật mã phải an toàn dù lộ toàn bộ thiết kế, trừ khóa bí mật – ý nghĩa: không nên dựa vào việc giấu thuật toán để đảm bảo an toàn."},{"num":10,"question":"Bàn luận về sự khác biệt giữa Security by Design và Security by Obscurity. Có nên kết hợp cả hai không?","answer":"Security by Design dựa trên kiến trúc/kiểm chứng chặt chẽ, chịu được khi công khai; Security by Obscurity dựa giấu chi tiết, sụp đổ khi lộ. Có thể kết hợp Obscurity như lớp BỔ SUNG, không phải lớp DUY NHẤT."},{"num":11,"question":"Trình bày định nghĩa CVE, CWE, CVSS và giải thích mối quan hệ giữa ba khái niệm này.","answer":"CVE định danh MỘT lỗ hổng cụ thể; CWE phân loại LOẠI điểm yếu; CVSS cho điểm số mức độ nghiêm trọng của một CVE cụ thể."},{"num":12,"question":"Giải thích tại sao một CWE (loại lỗi) có thể sinh ra nhiều CVE (lỗ hổng cụ thể) trong các phần mềm khác nhau.","answer":"Vì CWE là một MẪU lỗi tổng quát (VD buffer overflow), mẫu này có thể xuất hiện độc lập trong nhiều phần mềm khác nhau, mỗi lần xuất hiện với ngữ cảnh riêng được cấp một CVE riêng."},{"num":13,"question":"Mô tả khái niệm Trust Boundary và giải thích vì sao mọi input đi qua ranh giới này cần được kiểm tra.","answer":"Trust Boundary là nơi mức tin cậy dữ liệu thay đổi (VD: từ Internet vào server nội bộ); cần kiểm tra vì dữ liệu từ vùng kém tin cậy có thể chứa nội dung độc hại."},{"num":14,"question":"Bàn luận: ”Ẩn URL quản trị” có phải là biện pháp an toàn đáng tin cậy không? Giải thích bằng khái niệm đã học.","answer":"Không đáng tin cậy – đây là Security by Obscurity, kẻ tấn công chỉ cần quét/dò URL là phát hiện; cần cơ chế xác thực/phân quyền thực sự."},{"num":15,"question":"Giải thích khái niệm Fail-Safe Default và cho ví dụ code minh họa lỗi ”fail-open”.","answer":"Fail-Safe Default: khi lỗi, mặc định từ chối truy cập. VD lỗi: except: return True (fail-open); sửa: except: return False (fail-closed/fail-safe)."}],"thuc_hanh":[{"num":1,"question":"Viết một đoạn Python mô tả một class RiskAssessment với thuộc tính likelihood và impact (thang 1–3), có phương thức compute_risk() trả về tích hai giá trị.","answer":"class RiskAssessment: def __init__(self, likelihood, impact): self.likelihood=likelihood self.impact=impact def compute_risk(self): return self.likelihood * self.impact"},{"num":2,"question":"Cho đoạn code:\n\n```\ndef check_permission (user):\ntry:\nreturn db. get_role (user) == \"admin \"\nexcept Exception :\nreturn True\n```\n\nSửa lại đoạn code trên để áp dụng nguyên lý Fail-Safe Default.","answer":"Sửa except Exception: return True thành except Exception: return False – mặc định từ chối khi có lỗi."},{"num":3,"question":"Viết một bảng (dùng Markdown hoặc LaTeX) liệt kê ít nhất 4 attack surface của một ứng dụng web đăng nhập bằng email/mật khẩu.","answer":"Bảng gồm: (1) Form đăng nhập, (2) API endpoint, (3) Cookie/session token, (4) Header HTTP – mỗi dòng là 1 attack surface. 4"},{"num":4,"question":"Cho một API ”đổi email” của người dùng, vẽ Data Flow Diagram đơn giản gồm: người dùng, API, database, và đánh dấu trust boundary.","answer":"DFD: [Người dùng] –HTTP–> [API] –SQL–> [Database]; trust boundary 1 giữa người dùng-API, trust boundary 2 giữa API-database."},{"num":5,"question":"Tính điểm risk định tính (thang 1–3 cho likelihood và impact) cho tình huống: ”lỗi buffer overflow trong công cụ CLI chỉ chạy bởi root, không nhận input mạng”.","answer":"Likelihood=1 (thấp, cần quyền local), Impact=3 (cao, RCE) → Risk = 3 (trung bình theo thang 1-9)."},{"num":6,"question":"Viết một đoạn code Python minh họa vi phạm Least Privilege (một service chạy với quyền admin không cần thiết) và bản đã sửa.","answer":"VD vi phạm: service log chạy với quyền root để ghi file; sửa: tạo user riêng chỉ có quyền ghi vào thư mục log cụ thể."},{"num":7,"question":"Tra cứu (giả lập, không cần internet) và trình bày cấu trúc của một mã CVE giả định, gồm: năm, số thứ tự, mô tả ngắn, CWE liên quan.","answer":"CVE-20XX-NNNNN: năm phát hành, số thứ tự duy nhất trong năm, mô tả ngắn (VD: buffer overflow trong module X), CWE-120 liên quan."},{"num":8,"question":"Với hệ thống ”Cambridge IT 9626 Hub” (nhắc trong project), liệt kê 3 trust boundary có thể tồn tại trong kiến trúc MVC. 5","answer":"Trust boundary: (1) Client browser – Controller, (2) Controller – Model/Database, (3) AiController – external AI API."},{"num":9,"question":"Viết một hàm Python is_fail_safe(func) kiểm tra (bằng cách gọi thử với input lỗi) xem một hàm có tuân thủ fail-safe default hay không.","answer":"Hàm gọi func với input cố ý gây lỗi (None, giá trị âm...), kiểm tra kết quả trả về có phải giá trị ”an toàn” (False/deny) hay không."},{"num":10,"question":"Cho một hệ thống chấm điểm CVSS đơn giản (chỉ dùng AV, AC, PR với trọng số cho trước), viết công thức tính điểm tổng hợp.","answer":"Điểm = w1 × AV + w2 × AC + w3 × P R với wi là trọng số định trước cho từng mức giá trị của mỗi thành phần."},{"num":11,"question":"Vẽ sơ đồ Defense in Depth cho một ứng dụng di động (mobile app) kết nối tới backend API.","answer":"Sơ đồ: Lớp Network (firewall) → Lớp OS (patch) → Lớp App (input validation) → Lớp Data (mã hóa) bao quanh app mobile-backend."},{"num":12,"question":"Viết đoạn mã C minh họa một hàm không kiểm tra kết quả malloc (vi phạm fail-safe) và bản đã sửa.","answer":"int *p = malloc(sizeof(int)); *p = 5; (không kiểm tra NULL); sửa: thêm if (p == NULL) return -1; trước khi dùng."},{"num":13,"question":"Với ví dụ đăng nhập trong atpm.ch1_concepts.kripke, chỉ ra Attack Surface tương ứng với mô hình đó.","answer":"Attack Surface: input tại các hàm add_transition, tham số unsafe_label trong check_invariant (nếu lấy từ input người dùng)."},{"num":14,"question":"Viết một checklist (5 mục) để đánh giá xem một thiết kế hệ thống có tuân thủ Security by Design hay không.","answer":"Checklist: (1) Kiến trúc có kiểm chứng hình thức? (2) Input validation ở mọi trust boundary? (3) Least Privilege áp dụng? (4) Có threat model? (5) Có defense in depth?"},{"num":15,"question":"Cho 3 tình huống lỗi bảo mật, xếp hạng risk (thấp/trung bình/cao) và giải thích ngắn gọn lý do.","answer":"VD: (1) XSS trên form công khai = trung bình, (2) RCE qua API không xác thực = cao, (3) thông tin lộ trong log nội bộ = thấp."}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện lỗ hổng CVE mới trong thư viện họ đang dùng, nhưng bản vá làm chậm hệ thống 20%. Bàn luận cách ra quyết định (áp dụng khái niệm Risk).","answer":"Cân nhắc Risk (nếu lỗ hổng dễ khai thác + impact cao thì ưu tiên vá dù giảm hiệu năng); có thể áp dụng mitigation tạm trong lúc tối ưu bản vá."},{"num":2,"question":"Một startup thương mại điện tử nhỏ hỏi bạn nên ưu tiên đầu tư vào Confidentiality, Integrity hay Availability trước. Tư vấn dựa trên loại hình kinh doanh.","answer":"Ưu tiên theo mô hình kinh doanh: thương mại điện tử ưu tiên Integrity (giá/đơn hàng đúng) và Availability (luôn bán được); dữ liệu thanh toán ưu tiên Confidentiality."},{"num":3,"question":"Một nhân viên IT ẩn URL trang quản trị thay vì triển khai xác thực – sếp cho rằng ”vậy là đủ an toàn”. Phản biện quan điểm này.","answer":"Phản biện: đây chỉ là Security by Obscurity, không phải giải pháp thực sự – kẻ tấn công có công cụ dò URL (dirb, gobuster) dễ dàng tìm ra; cần xác thực/phân quyền thật."},{"num":4,"question":"Một hệ thống y tế cần cả Safety và Security. Đề xuất 3 biện pháp cụ thể đáp ứng đồng thời cả hai.","answer":"Đề xuất: (1) hệ thống dự phòng (redundancy) cho Safety, (2) mã hóa kênh điều khiển cho Security, (3) formal verification cho module lái tự động tới hạn."},{"num":5,"question":"Một ứng dụng ngân hàng bị tấn công qua lỗ hổng CWE đã biết từ 2 năm trước nhưng chưa vá. Phân tích nguyên nhân quy trình có thể dẫn tới tình huống này.","answer":"Nguyên nhân: thiếu quy trình patch management, thiếu theo dõi CVE database, có thể thiếu trách nhiệm rõ ràng (ai chịu trách nhiệm vá lỗi)."},{"num":6,"question":"Một tổ chức cấp quyền admin cho TẤT CẢ nhân viên IT ”cho tiện”. Phân tích rủi ro và đề xuất áp dụng Least Privilege.","answer":"Rủi ro: một tài khoản bị xâm nhập = toàn bộ hệ thống bị xâm nhập; đề xuất phân quyền theo vai trò cụ thể (RBAC) thay vì admin chung."},{"num":7,"question":"Với hệ thống ”Cambridge IT 9626 Hub”, đề xuất một threat mà sinh viên (người dùng) có thể gây ra nếu tài khoản bị đánh cắp.","answer":"Threat: tài khoản sinh viên bị đánh cắp có thể dùng để gian lận điểm số, xem đáp án trước hạn, hoặc mạo danh nộp bài hộ người khác."},{"num":8,"question":"Một công ty bảo hiểm cần chứng minh Non-repudiation cho hợp đồng điện tử. Đề xuất giải pháp kỹ thuật.","answer":"Giải pháp: chữ ký số (digital signature) + timestamp server tin cậy (trusted timestamping) cho mỗi hợp đồng ký kết."},{"num":9,"question":"Phân tích một tình huống thực tế (giả định) nơi Defense in Depth đã ngăn chặn một cuộc tấn công dù một lớp bảo vệ đã bị vượt qua.","answer":"VD: kẻ tấn công vượt qua firewall (lớp 1) nhưng bị chặn bởi input validation ở tầng ứng dụng (lớp 2) nhờ Defense in Depth."},{"num":10,"question":"Một CVE mới công bố có điểm CVSS 9.8 (Critical) nhưng ảnh hưởng một tính năng ít dùng. Bàn luận cách ưu tiên vá lỗi.","answer":"Cân nhắc: dù CVSS cao, impact thực tế thấp do ít người dùng tính năng đó – vẫn nên vá nhưng có thể không cần ”khẩn cấp tuyệt đối”, ưu tiên theo exposure thực tế."},{"num":11,"question":"Một hệ thống IoT (thiết bị gia dụng thông minh) không cập nhật firmware được. Phân tích attack surface và đề xuất giảm thiểu risk.","answer":"Attack surface: giao diện web quản lý, giao thức kết nối thiết bị (thường không mã hóa); giảm risk bằng cách cô lập mạng IoT (network segmentation) và giám sát bất thường."},{"num":12,"question":"Một nhân viên cũ vẫn còn quyền truy cập hệ thống 6 tháng sau khi nghỉ việc. Phân tích vi phạm nguyên lý nào và hậu quả tiềm ẩn.","answer":"Vi phạm Least Privilege và thiếu Accountability trong quy trình offboarding; hậu quả: cựu nhân viên có thể truy cập/đánh cắp dữ liệu nhạy cảm."},{"num":13,"question":"Một trường đại học lưu trữ điểm số sinh viên. Xác định thuộc tính CIA nào QUAN TRỌNG NHẤT cần bảo vệ và giải thích.","answer":"Integrity quan trọng nhất (điểm số bị sửa sai ảnh hưởng trực tiếp quyền lợi học tập), dù Confidentiality cũng cần thiết cho quyền riêng tư. 6\n\n```\nMỤC 1.2 – MỘT SỐ VẤN ĐỀ VỀ AN TOÀN PHẦN MỀM\n```"},{"num":14,"question":"Một ứng dụng mạng xã hội bị lộ dữ liệu người dùng do thiếu mã hóa khi lưu trữ. Phân loại CWE liên quan và đề xuất khắc phục.","answer":"CWE-311 (Missing Encryption of Sensitive Data); khắc phục: mã hóa dữ liệu at-rest bằng AES, xem xét format-preserving encryption nếu cần."},{"num":15,"question":"Một tổ chức từ chối công bố lỗ hổng đã fix (không xin CVE) vì sợ ảnh hưởng danh tiếng. Bàn luận về đạo đức và trách nhiệm.","answer":"Bàn luận: minh bạch (công bố CVE) giúp cộng đồng phòng vệ tốt hơn dù ảnh hưởng danh tiếng ngắn hạn; trách nhiệm đạo đức nên ưu tiên an toàn người dùng hơn danh tiếng."}]}},{"id":"1.2","title":"Một số vấn đề về an toàn phần mềm","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Vì sao phần mềm được coi là ”mắt xích yếu nhất” trong bảo mật hệ thống?","options":{"A":"Vì phần mềm luôn chậm hơn phần cứng","B":"Vì độ phức tạp cao, áp lực thời gian, và legacy code","C":"Vì phần mềm không thể mã hóa dữ liệu","D":"Vì phần mềm luôn miễn phí"},"correct":"B","explanation":"Độ phức tạp cao, áp lực thời gian, legacy code."},{"num":2,"question":"Nguyên lý ”shift-left” trong an toàn phần mềm có nghĩa là gì?","options":{"A":"Dịch chuyển việc phát hiện lỗi sang giai đoạn SỚM hơn trong SDLC","B":"Chuyển đội ngũ phát triển sang múi giờ khác","C":"Ưu tiên tính năng mới hơn bảo mật","D":"Dịch chuyển trách nhiệm bảo mật cho khách hàng"},"correct":"A","explanation":"Shift-left: phát hiện lỗi sớm hơn trong SDLC."},{"num":3,"question":"Theo biểu đồ chi phí sửa lỗi, giai đoạn nào có chi phí sửa lỗi CAO NHẤT?","options":{"A":"Giai đoạn yêu cầu","B":"Giai đoạn thiết kế","C":"Giai đoạn mã hóa","D":"Giai đoạn vận hành (sau khi phát hành)"},"correct":"D","explanation":"Giai đoạn vận hành có chi phí sửa lỗi cao nhất."},{"num":4,"question":"CWE-120 tương ứng với loại lỗi nào?","options":{"A":"SQL Injection","B":"Buffer Overflow","C":"Use-After-Free","D":"Hard-coded credentials"},"correct":"B","explanation":"CWE-120 = Buffer Overflow."},{"num":5,"question":"CWE-89 tương ứng với loại lỗi nào?","options":{"A":"Buffer Overflow","B":"SQL Injection","C":"Race Condition","D":"Weak cryptography"},"correct":"B","explanation":"CWE-89 = SQL Injection."},{"num":6,"question":"CWE-416 (Use-After-Free) thuộc nhóm lỗi nào?","options":{"A":"Injection","B":"Memory corruption","C":"Cryptographic Issues","D":"Broken Access Control"},"correct":"B","explanation":"CWE-416 thuộc nhóm Memory corruption."},{"num":7,"question":"CWE-362 liên quan tới loại lỗi nào?","options":{"A":"Race Condition (TOCTOU)","B":"SQL Injection","C":"Buffer Overflow","D":"Hard-coded credentials"},"correct":"A","explanation":"CWE-362 = Race Condition (TOCTOU)."},{"num":8,"question":"STRIDE là viết tắt của các loại đe dọa nào?","options":{"A":"Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege","B":"Security, Testing, Risk, Integrity, Development, Evaluation","C":"Static, Trace, Reachability, Input, Debug, Execution","D":"Software, Testing, Review, Inspection, Design, Engineering"},"correct":"A","explanation":"STRIDE: Spoofing, Tampering, Repudiation, Information Disclosure, DoS, Elevation of Privilege."},{"num":9,"question":"Trong STRIDE, ”Tampering” vi phạm thuộc tính nào?","options":{"A":"Confidentiality","B":"Integrity","C":"Availability","D":"Authentication"},"correct":"B","explanation":"Tampering vi phạm Integrity."}],"ly_thuyet":[{"num":1,"question":"Trình bày các nguyên nhân chính khiến phần mềm trở thành ”mắt xích yếu nhất” trong bảo mật hệ thống.","answer":"Nguyên nhân: độ phức tạp tăng cấp số nhân, áp lực time-to-market, legacy code không theo kịp đe dọa mới, chuỗi cung ứng phức tạp, lỗi con người có hệ thống. 8\n\n```\nMỤC 1.2 – MỘT SỐ VẤN ĐỀ VỀ AN TOÀN PHẦN MỀM\n```"},{"num":2,"question":"Giải thích nguyên lý ”shift-left” và mối liên hệ với biểu đồ chi phí sửa lỗi theo giai đoạn SDLC.","answer":"Shift-left nghĩa là phát hiện lỗi CÀNG SỚM CÀNG TỐT trong SDLC; liên hệ biểu đồ chi phí: sửa lỗi ở giai đoạn yêu cầu rẻ hơn rất nhiều so với sau khi phát hành."},{"num":3,"question":"Mô tả ít nhất 4 nhóm lỗ hổng phổ biến (memory corruption, injection, broken access control, crypto issues) kèm ví dụ CWE.","answer":"Memory corruption (CWE-120 buffer overflow), Injection (CWE-89 SQLi), Broken Access Control (CWE-284), Cryptographic Issues (CWE-327 weak crypto)."},{"num":4,"question":"Trình bày mô hình STRIDE và giải thích ý nghĩa của từng chữ cái.","answer":"STRIDE: Spoofing (giả mạo danh tính), Tampering (sửa đổi trái phép), Repudiation (chối bỏ hành động), Information Disclosure (rò rỉ), DoS (từ chối dịch vụ), Elevation of Privilege (leo thang quyền)."},{"num":5,"question":"Giải thích cách áp dụng STRIDE kết hợp với Data Flow Diagram trong threat modeling.","answer":"DFD xác định các thành phần và trust boundary; tại mỗi trust boundary, áp dụng STRIDE để liệt kê đe dọa tương ứng có thể xảy ra khi dữ liệu đi qua ranh giới đó."},{"num":6,"question":"Bàn luận: vì sao SQL Injection vẫn là một trong những lỗ hổng phổ biến nhất dù đã được biết đến hàng chục năm?","answer":"Vì lập trình viên vẫn tiếp tục nối chuỗi SQL trực tiếp do thiếu đào tạo/awareness, và nhiều framework cũ không mặc định dùng parameterized query."},{"num":7,"question":"Trình bày cơ chế gây lỗi của Heartbleed (CVE-2014-0160) và bài học rút ra.","answer":"Heartbleed: thiếu kiểm tra độ dài trong xử lý heartbeat TLS, cho phép đọc vượt biên bộ nhớ tiến trình, rò rỉ khóa riêng/session token; bài học: lỗi kiểm tra độ dài đơn giản có thể gây hậu quả toàn cầu."},{"num":8,"question":"Giải thích khái niệm Supply Chain Security và tại sao nó ngày càng quan trọng trong phát triển phần mềm hiện đại.","answer":"Supply Chain Security quan trọng vì phần mềm hiện đại phụ thuộc hàng trăm thư viện bên thứ ba, một thư viện bị xâm nhập ảnh hưởng MỌI dự án dùng nó."},{"num":9,"question":"Mô tả vai trò của SBOM (Software Bill of Materials) trong quản lý rủi ro chuỗi cung ứng.","answer":"SBOM là danh sách đầy đủ các thành phần/dependency trong phần mềm, giúp nhanh chóng xác định có bị ảnh hưởng bởi một CVE mới hay không."},{"num":10,"question":"Trình bày tổng quan OWASP Top 10 và giải thích vì sao ”Broken Access Control” thường đứng đầu danh sách.","answer":"OWASP Top 10 là 10 lỗ hổng phổ biến nhất cho web app; Broken Access Control đứng đầu vì lỗi phân quyền dễ mắc phải và hậu quả trực tiếp (truy cập trái phép dữ liệu/chức năng)."},{"num":11,"question":"Giải thích Microsoft SDL (Security Development Lifecycle) và cách nó tích hợp bảo mật vào từng giai đoạn phát triển.","answer":"Microsoft SDL tích hợp hoạt động bảo mật (threat modeling, code review, testing) vào TỪNG giai đoạn SDLC thay vì chỉ kiểm tra cuối cùng."},{"num":12,"question":"Bàn luận về case study ”event-stream npm package” – bài học gì rút ra cho quản lý dependency?","answer":"Bài học: cần kiểm tra kỹ dependency (kể cả gián tiếp), dùng lockfile, giám sát thay đổi bất thường trong package đã tin tưởng trước đó."},{"num":13,"question":"Trình bày sự khác biệt giữa CWE Top 25 và OWASP Top 10 về phạm vi áp dụng.","answer":"OWASP Top 10 chỉ áp dụng cho ứng dụng WEB; CWE Top 25 tổng quát hơn, áp dụng cho MỌI loại phần mềm (desktop, embedded, web...)."},{"num":14,"question":"Giải thích tại sao ”áp lực thời gian ra thị trường” thường mâu thuẫn với đầu tư cho an toàn phần mềm.","answer":"Áp lực thời gian khiến đội phát triển bỏ qua bước bảo mật (threat modeling, code review) để kịp deadline, tích lũy nợ kỹ thuật bảo mật (security debt)."},{"num":15,"question":"Mô tả cách vẽ một Data Flow Diagram đơn giản, chỉ ra các thành phần: external entity, process, data store, data flow.","answer":"DFD gồm: external entity (hình chữ nhật, tác nhân ngoài), process (hình tròn, xử lý), data store (hình chữ nhật hở, lưu trữ), data flow (mũi tên, luồng dữ liệu)."}],"thuc_hanh":[{"num":1,"question":"Viết lại đoạn code SQL injection sau bằng parameterized query (Python + sqlite3):\n\n```\nquery = \" SELECT * FROM users WHERE name = '\" + user_input + \"'\"\ncursor . execute (query)\n```","answer":"cursor.execute(\"SELECT * FROM users WHERE name = ?\", (user_input,))."},{"num":2,"question":"Vẽ Data Flow Diagram cho hệ thống đăng nhập của ”Cambridge IT 9626 Hub” và xác định các trust boundary.","answer":"DFD: User –HTTP–> Web App –Query–> Database; boundary tại User-WebApp và WebApp-DB."},{"num":3,"question":"Áp dụng STRIDE cho một API ”đổi mật khẩu” – liệt kê ít nhất 3 đe dọa tương ứng với 3 chữ cái khác nhau.","answer":"S (Spoofing session), T (sửa payload đổi user_id), E (bỏ qua check mật khẩu cũ)."},{"num":4,"question":"Viết một bảng ánh xạ 5 CWE phổ biến với ví dụ CVE tương ứng (có thể dùng thông tin giả định có cấu trúc hợp lệ).","answer":"CWE-120→CVE giả định ”Buffer overflow trong parser X (2023)”; tương tự cho 4 CWE khác."},{"num":5,"question":"Cho một đoạn mã C có lỗi buffer overflow (dùng strcpy), chỉ ra dòng lỗi và viết bản đã sửa dùng snprintf.","answer":"Dòng lỗi: strcpy(buf, input); sửa: snprintf(buf, sizeof(buf), \"%s\", input)."},{"num":6,"question":"Thiết kế một checklist Secure SDLC (5 giai đoạn, mỗi giai đoạn 1 hoạt động bảo mật cụ thể).","answer":"```\ngiai đoạn: Yêu cầu (threat model), Thiết kế (kiến trúc), Coding (secure coding +\n```\n\nSAST), Test (DAST), Vận hành (patch)."},{"num":7,"question":"Viết một đoạn Python mô phỏng kiểm tra ”Security Misconfiguration”: kiểm tra xem một web server có bật debug mode không nên có trong production.","answer":"def check_debug(config): return not config.get(\"DEBUG\", False) kiểm tra debug mode tắt."},{"num":8,"question":"Vẽ DFD cho một hệ thống thanh toán trực tuyến đơn giản (người dùng - web app - payment gateway - database).","answer":"DFD: User → WebApp → Payment Gateway → Database, 3 trust boundary tương ứng. 10\n\n```\nMỤC 1.2 – MỘT SỐ VẤN ĐỀ VỀ AN TOÀN PHẦN MỀM\n```"},{"num":9,"question":"Áp dụng STRIDE đầy đủ (6 loại đe dọa) cho một API ”tải lên file avatar người dùng”.","answer":"STRIDE cho upload avatar: S (giả file của người khác), T (thay nội dung file), I (đọc file người khác), D (upload file khổng lồ gây DoS), E (upload file thực thi giành quyền)."},{"num":10,"question":"Viết một bảng SBOM đơn giản (giả định) cho một dự án Python nhỏ, liệt kê 5 dependency và version. 11\n\n```\nMỤC 1.2 – MỘT SỐ VẤN ĐỀ VỀ AN TOÀN PHẦN MỀM\n```","answer":"SBOM: {”requests”: ”2.28.0”, ”flask”: ”2.2.0”, ”numpy”: ”1.23.0”, ”pillow”: ”9.2.0”, ”sqlalchemy”: ”1.4.0”}."},{"num":11,"question":"Cho một danh sách 5 lỗ hổng với CVSS score, sắp xếp theo độ ưu tiên vá lỗi và giải thích.","answer":"Ưu tiên theo CVSS giảm dần, đồng thời cân nhắc exposure thực tế (internet-facing trước, internal sau)."},{"num":12,"question":"Viết một script Python đơn giản quét một thư mục dự án và liệt kê các file có chứa chuỗi ”password =” trực tiếp trong mã nguồn (hard-coded credentials).","answer":"import os; for f in files: if \"password =\" in open(f).read(): print(f)."},{"num":13,"question":"Thiết kế một biểu mẫu (form) threat model đơn giản (STRIDE + DFD) áp dụng cho tính năng ”quên mật khẩu”.","answer":"Form: mục tiêu (STRIDE cho reset password), phạm vi (API + email flow), constraint (không có source code bên email provider)."},{"num":14,"question":"Viết đoạn mã minh họa một Race Condition (TOCTOU) đơn giản trong Python (kiểm tra file tồn tại rồi mở file).","answer":"if os.path.exists(f): ...(gian delay)...; open(f) – file có thể bị thay đổi giữa check và open."},{"num":15,"question":"Cho đoạn mã sử dụng eval() với input người dùng trong Python, chỉ ra rủi ro và viết bản thay thế an toàn.","answer":"Rủi ro eval(user_input): RCE tùy ý; thay bằng ast.literal_eval() nếu chỉ cần parse literal."}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện website của họ bị SQL Injection sau 3 năm vận hành không phát hiện. Phân tích nguyên nhân quy trình và đề xuất cải thiện.","answer":"Thiếu quy trình security testing định kỳ/SAST trong CI; đề xuất tích hợp Cppcheck/SonarQube vào pipeline."},{"num":2,"question":"Một dự án phần mềm outsource không có bước threat modeling. Đề xuất cách tích hợp STRIDE vào quy trình hiện tại của họ.","answer":"Đề xuất workshop STRIDE 1 buổi/sprint, yêu cầu vẽ DFD tối thiểu cho mọi API mới trước khi code."},{"num":3,"question":"Một tổ chức dùng lại thư viện mã nguồn mở đã ngừng bảo trì (unmaintained) từ 5 năm trước. Phân tích rủi ro Supply Chain và đề xuất giải pháp.","answer":"Rủi ro cao vì không ai vá lỗi/theo dõi CVE cho thư viện đó; đề xuất thay thế bằng thư viện đang bảo trì hoặc tự fork và vá."},{"num":4,"question":"Một startup phát hiện có ”backdoor” (hard-coded credentials) trong code do một cựu nhân viên để lại. Phân tích CWE liên quan và quy trình xử lý.","answer":"CWE-798 (hard-coded credentials); quy trình: thu hồi ngay credential, rà soát toàn bộ commit history, áp dụng secret scanning tool."},{"num":5,"question":"Một hệ thống chính phủ bị tấn công qua lỗ hổng Heartbleed sau 2 năm công bố CVE. Phân tích lý do quy trình patch management có thể đã thất bại.","answer":"Quy trình patch management thất bại: có thể thiếu inventory hệ thống bị ảnh hưởng, thiếu ưu tiên hóa dựa trên CVSS, hoặc thiếu ngân sách/nhân lực vá."},{"num":6,"question":"Một công ty game online bị tố cáo lưu mật khẩu người dùng dạng plaintext. Phân tích vi phạm CWE và đề xuất khắc phục khẩn cấp.","answer":"Vi phạm CWE-256/259 (lưu mật khẩu không mã hóa); khắc phục khẩn: hash bằng bcrypt/Argon2, buộc reset mật khẩu toàn bộ người dùng."},{"num":7,"question":"Một tổ chức tài chính phải tuân thủ PCI-DSS, yêu cầu threat modeling định kỳ. Đề xuất tần suất và phạm vi threat modeling phù hợp.","answer":"Tần suất: threat modeling mỗi khi có tính năng mới quan trọng, và review định kỳ hàng quý toàn bộ hệ thống."},{"num":8,"question":"Một nhóm phát triển ưu tiên ”ra mắt đúng deadline” và bỏ qua bước security review. Phân tích hậu quả tiềm ẩn dựa trên biểu đồ chi phí sửa lỗi.","answer":"Hậu quả: lỗi phát hiện muộn (production) có chi phí gấp hàng chục-trăm lần so với phát hiện ở thiết kế; có thể dẫn tới security incident tốn kém hơn deadline bị trễ."},{"num":9,"question":"Một ứng dụng di động gửi dữ liệu vị trí người dùng không mã hóa qua HTTP. Phân tích CWE và tư vấn khắc phục.","answer":"CWE-319 (Cleartext Transmission); khắc phục: bắt buộc HTTPS/TLS cho mọi kết nối truyền dữ liệu vị trí."},{"num":10,"question":"Một công ty phát hiện chuỗi cung ứng phần mềm của họ bị xâm nhập qua một CI/CD pipeline bị chiếm quyền. Đề xuất biện pháp phòng ngừa (SBOM, ký số).","answer":"Biện pháp: ký số artifact trong CI/CD, giới hạn quyền truy cập pipeline, audit log mọi thay đổi cấu hình CI/CD, dùng SBOM theo dõi dependency."},{"num":11,"question":"Một tổ chức y tế bị tấn công ransomware qua lỗ hổng chưa vá đã biết\n\n```\ntháng. Phân tích lỗi quy trình patch management.\n```","answer":"Lỗi quy trình: thiếu inventory tài sản, thiếu quy trình patch bắt buộc trong SLA, có thể thiếu giám sát cảnh báo CVE tự động."},{"num":12,"question":"Một dự án mã nguồn mở phổ biến (dùng bởi hàng nghìn công ty) phát hiện lỗ hổng nghiêm trọng. Bàn luận trách nhiệm của: (a) maintainer, (b) công ty sử dụng.","answer":"(a) Maintainer: công bố minh bạch, vá nhanh nhất có thể; (b) Công ty: chủ động theo dõi CVE của mọi dependency, không chỉ dựa vào maintainer."},{"num":13,"question":"Một hệ thống trường học lưu trữ hồ sơ học sinh bị truy cập trái phép qua API thiếu access control. Phân tích OWASP category và đề xuất khắc phục.","answer":"OWASP category: Broken Access Control (A01); khắc phục: kiểm tra authorization ở MỌI endpoint, không chỉ ở giao diện."},{"num":14,"question":"Một công ty bảo hiểm phát hiện nhân viên cũ vẫn truy cập được hệ thống nội bộ qua VPN. Phân tích nguyên nhân và STRIDE category liên quan.","answer":"Nguyên nhân: thiếu quy trình offboarding chuẩn; STRIDE category: Elevation of Privilege / Spoofing (truy cập trái phép danh nghĩa cũ)."},{"num":15,"question":"Một ứng dụng thương mại điện tử gặp sự cố Race Condition khi nhiều người dùng cùng mua sản phẩm số lượng có hạn cuối cùng. Phân tích và đề xuất giải pháp.","answer":"Đây là Race Condition (TOCTOU); giải pháp: dùng transaction có khóa (locking) hoặc atomic decrement khi kiểm tra và trừ tồn kho."}]}},{"id":"1.3","title":"Kiểm thử và kiểm chứng phần mềm I","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Theo ISTQB, testing bao gồm những hoạt động nào?","options":{"A":"Chỉ chạy chương trình và quan sát kết quả","B":"Lập kế hoạch, thiết kế test case, thực thi, và cả hoạt động tĩnh như review","C":"Chỉ viết tài liệu đặc tả","D":"Chỉ áp dụng sau khi phần mềm phát hành"},"correct":"B","explanation":"Testing bao gồm cả hoạt động tĩnh như review, không chỉ chạy chương trình."},{"num":2,"question":"Nguyên tắc ”Testing shows presence of defects” có nghĩa là gì?","options":{"A":"Testing chứng minh phần mềm không có lỗi","B":"Testing chỉ cho thấy SỰ HIỆN DIỆN của lỗi, không chứng minh không có lỗi","C":"Testing luôn tìm ra 100% lỗi","D":"Testing không có giá trị thực tiễn"},"correct":"B","explanation":"Testing chỉ cho thấy sự hiện diện của lỗi."},{"num":3,"question":"”Exhaustive testing is impossible” đề cập tới nguyên tắc nào?","options":{"A":"Kiểm thử toàn bộ (mọi input) là bất khả thi","B":"Luôn cần kiểm thử tự động hoàn toàn","C":"Kiểm thử thủ công luôn tốt hơn tự động","D":"Không cần kiểm thử nếu code ngắn"},"correct":"A","explanation":"Kiểm thử toàn bộ là bất khả thi."},{"num":4,"question":"”Defect clustering” (80/20) đề cập tới hiện tượng gì?","options":{"A":"Lỗi phân bố đều trên toàn bộ mã nguồn","B":"Phần lớn lỗi tập trung ở một số phần nhỏ của hệ thống","C":"Lỗi chỉ xảy ra vào cuối dự án","D":"Lỗi luôn liên quan tới giao diện người dùng"},"correct":"B","explanation":"Lỗi thường tập trung ở một số phần nhỏ (80/20)."},{"num":5,"question":"”Pesticide paradox” trong testing muốn nói điều gì?","options":{"A":"Test case cũ dần mất hiệu quả, cần làm mới thường xuyên","B":"Càng test nhiều càng ít lỗi","C":"Không nên test lại cùng một chức năng","D":"Thuốc trừ sâu có thể diệt được mọi loại côn trùng"},"correct":"A","explanation":"Test case cũ mất hiệu quả dần, cần làm mới."},{"num":6,"question":"V-Model trong kiểm thử phần mềm thể hiện điều gì?","options":{"A":"Mối quan hệ giữa các giai đoạn phát triển và các mức kiểm thử tương ứng","B":"Biểu đồ hiệu năng hệ thống","C":"Sơ đồ mạng máy tính","D":"Cấu trúc dữ liệu dạng cây"},"correct":"A","explanation":"V-Model thể hiện quan hệ giữa giai đoạn phát triển và mức kiểm thử."},{"num":7,"question":"Unit Test tương ứng với giai đoạn nào trong V-Model?","options":{"A":"Yêu cầu","B":"Thiết kế kiến trúc","C":"Coding (mã hóa)","D":"Thiết kế chi tiết"},"correct":"C","explanation":"Unit Test tương ứng giai đoạn Coding."},{"num":8,"question":"Security Testing là một nhánh của loại kiểm thử nào?","options":{"A":"Functional Testing","B":"Non-functional Testing","C":"Chỉ là một công cụ riêng biệt không thuộc phân loại nào","D":"Unit Testing"},"correct":"B","explanation":"Security Testing thuộc Non-functional Testing."}],"ly_thuyet":[{"num":1,"question":"Trình bày định nghĩa Testing theo ISTQB và các hoạt động bao gồm trong đó.","answer":"Testing theo ISTQB: tập hợp hoạt động phát hiện lỗi và đánh giá chất lượng, gồm lập kế hoạch, thiết kế, thực thi, VÀ cả hoạt động tĩnh (review) không cần chạy chương trình."},{"num":2,"question":"Liệt kê và giải thích ngắn gọn 7 nguyên tắc kiểm thử theo ISTQB.","answer":"```\nnguyên tắc: (1) Testing cho thấy có lỗi chứ không chứng minh hết lỗi, (2)\n```\n\nexhaustive testing bất khả thi, (3) early testing, (4) defect clustering, (5) pesticide paradox, (6) context dependent, (7) absence-of-errors fallacy."},{"num":3,"question":"Giải thích nguyên tắc ”Testing shows presence of defects, not their absence” bằng ví dụ cụ thể.","answer":"VD: dù chạy 1000 test case pass, chương trình vẫn có thể có lỗi ở test case thứ 1001 chưa thử – testing không chứng minh ”không có lỗi” một cách tuyệt đối."},{"num":4,"question":"Bàn luận: vì sao ”exhaustive testing bất khả thi” là động lực cho các kỹ thuật phân tích tĩnh và formal verification.","answer":"Vì không thể thử mọi input, cần công cụ CHỨNG MINH toán học (static analysis, formal verification) để đảm bảo tính đúng đắn vượt ra ngoài các case đã test."},{"num":5,"question":"Trình bày mô hình V-Model và giải thích mối quan hệ giữa các mức kiểm thử và các giai đoạn phát triển.","answer":"V-Model: Yêu cầu↔Acceptance Test, Thiết kế kiến trúc↔System Test, Thiết kế chi tiết↔Integration Test, Coding↔Unit Test."},{"num":6,"question":"Giải thích sự khác biệt giữa Functional Testing và Non-functional Testing, cho ví dụ minh họa Security Testing.","answer":"Functional kiểm tra ĐÚNG chức năng theo đặc tả; Non-functional kiểm tra thuộc tính chất lượng (hiệu năng, bảo mật); Security Testing là nhánh Non-functional tập trung tìm lỗ hổng."},{"num":7,"question":"Phân biệt Static Testing và Dynamic Testing, chỉ ra ưu/nhược điểm của mỗi loại.","answer":"Static: không chạy chương trình (code review, static analysis) – phát hiện sớm, rẻ; Dynamic: chạy chương trình với input cụ thể – phát hiện hành vi runtime thực tế. 14"},{"num":8,"question":"Trình bày định nghĩa Verification và Validation, giải thích bằng ví dụ cụ thể về chức năng ”xác thực OTP”.","answer":"Verification: ”xây dựng đúng cách” (tuân thủ đặc tả kỹ thuật); Validation: ”xây dựng đúng sản phẩm” (đáp ứng nhu cầu người dùng). VD OTP: Verification kiểm tra code sinh OTP đúng thuật toán đã đặc tả; Validation kiểm tra người dùng có thực sự nhận và dùng được OTP thuận tiện không."},{"num":9,"question":"Mô tả kỹ thuật Equivalence Partitioning và Boundary Value Analysis, cho ví dụ áp dụng cho trường ”tuổi” (0-150).","answer":"Equivalence Partitioning: chia input thành lớp tương đương (VD tuổi: âm/hợp lệ/quá lớn); Boundary Value: test tại biên (0, 150, -1, 151)."},{"num":10,"question":"Giải thích tại sao lớp ”input không hợp lệ” trong Equivalence Partitioning có liên hệ trực tiếp với input validation (CWE-20).","answer":"Lớp ”không hợp lệ” trong Equivalence Partitioning chính là nơi input validation (CWE-20) phải chặn được – thiếu xử lý lớp này là nguồn gốc lỗ hổng."},{"num":11,"question":"Trình bày các loại white-box coverage (statement, branch, path) và giải thích mối quan hệ giữa chúng.","answer":"Statement⊂Branch⊂Path về độ chặt: Statement chỉ cần chạm dòng lệnh; Branch cần cả hai nhánh; Path cần mọi tổ hợp đường đi (thường không khả thi đo đủ)."},{"num":12,"question":"Bàn luận: tại sao Path Coverage đầy đủ thường bất khả thi với chương trình có vòng lặp?","answer":"Vì vòng lặp tạo số lượng path tăng theo cấp số nhân/vô hạn (mỗi lần lặp thêm là một path riêng) – không thể liệt kê hết trong thời gian hữu hạn."},{"num":13,"question":"Mô tả Defect Lifecycle và giải thích ý nghĩa của từng trạng thái (New, Assigned, Fixed, Retest, Closed, Reopened).","answer":"Defect Lifecycle: New (mới phát hiện) → Assigned (giao xử lý) → Fixed (đã sửa) → Retest (kiểm tra lại) → Closed (đóng) hoặc Reopened (mở lại nếu retest fail)."},{"num":14,"question":"Trình bày quy trình kiểm thử cơ bản theo ISTQB (Fundamental Test Process) với 6 giai đoạn.","answer":"Fundamental Test Process: Test Planning → Analysis&Design → Implementation → Execution → Evaluating&Reporting → Test Closure."},{"num":15,"question":"Giải thích khái niệm Decision Table Testing và khi nào nên áp dụng kỹ thuật này.","answer":"Decision Table phù hợp khi có NHIỀU điều kiện kết hợp ảnh hưởng tới kết quả (VD: nhiều rule nghiệp vụ đan xen) – giúp đảm bảo phủ hết tổ hợp logic."}],"thuc_hanh":[{"num":1,"question":"Thiết kế test case theo Boundary Value Analysis cho trường ”điểm số” (thang 0–10).","answer":"Test case: -1 (invalid), 0 (biên hợp lệ), 10 (biên hợp lệ), 11 (invalid)."},{"num":2,"question":"Với hàm sau, viết test case đạt path coverage đầy đủ:\n\n```\nint check_access (int age , int has_permission ) {\nif (age >= 18) {\nif ( has_permission ) return 1;\n}\nreturn 0;\n}\n```","answer":"```\ntest case: (17,0), (18,0), (18,1) – phủ mọi nhánh của 2 điều kiện lồng nhau.\n```"},{"num":3,"question":"Viết 4 test case theo Equivalence Partitioning cho trường ”email” (hợp lệ, thiếu @, thiếu domain, rỗng).","answer":"```\ncase: ”a@b.com” (hợp lệ), ”ab.com” (thiếu @), ”a@” (thiếu domain), ”” (rỗng).\n```"},{"num":4,"question":"Xây dựng Decision Table đầy đủ cho chức năng ”áp dụng giảm giá” với\n\n```\nđiều kiện: là thành viên VIP, đơn hàng trên 500k.\n```","answer":"Decision Table 4 rule: (VIP,>500k)=giảm nhiều nhất; (VIP,≤500k)=giảm vừa; (thường,>500k)= ít; (thường,≤500k)=không giảm."},{"num":5,"question":"Viết một bộ 3 test case đạt Branch Coverage 100% cho hàm classify(x) với if x<0 ... elif x==0 ... else ....","answer":"Test: x = −5 (elif nhánh âm... thực ra if x<0), x = 0, x = 5 (else) – 3 case phủ 3 nhánh."},{"num":6,"question":"Thiết kế một Defect Report mẫu (theo lifecycle) cho lỗi ”nút Submit không phản hồi khi click nhanh liên tiếp”.","answer":"Defect Report: Title, Steps to reproduce (click nhanh 5 lần), Expected (chỉ 1 request), Actual (nhiều request), Severity, trạng thái New."},{"num":7,"question":"Viết test case Verification (kiểm tra đúng đặc tả) và Validation (kiểm tra đúng nhu cầu) khác nhau cho chức năng ”đặt lại mật khẩu”.","answer":"Verification: kiểm tra token reset đúng định dạng/thời hạn theo đặc tả; Validation: khảo sát người dùng có dễ dàng thực hiện reset không."},{"num":8,"question":"Cho một hàm Python tính giai thừa, viết test case bao gồm Boundary Value (0, 1, số âm, số lớn).","answer":"Test case: n = 0 (biên, kết quả 1), n = 1, n = −1 (invalid), n = 20 (số lớn, kiểm tra overflow)."},{"num":9,"question":"Thiết kế 5 test case Security Testing (không phải Functional) cho chức năng đăng nhập. 17","answer":"```\ntest: SQL injection payload, XSS trong username, brute-force nhiều lần sai,\n```\n\nsession fixation, timing attack đo phản hồi."},{"num":10,"question":"Viết một bảng Equivalence Partitioning cho trường ”số điện thoại Việt Nam” (10 số, bắt đầu bằng 0).","answer":"Bảng: ”0123456789”(hợp lệ), ”123456789”(thiếu số đầu, 9 số), ”01234567890”(11 số), ”abc1234567”(chứa chữ)."},{"num":11,"question":"Tính toán số lượng test case tối thiểu cần thiết để đạt Branch Coverage cho một hàm có 3 điều kiện if độc lập.","answer":"Với 3 điều kiện if độc lập: tối thiểu 4 test case (dùng kỹ thuật MC/DC hoặc đơn giản mỗi điều kiện đúng/sai ít nhất 1 lần)."},{"num":12,"question":"Viết Test Plan tóm tắt (mục tiêu, phạm vi, tiêu chí dừng) cho việc kiểm thử một API ”tìm kiếm sản phẩm”.","answer":"Test Plan: Mục tiêu (đảm bảo tìm đúng sản phẩm), Phạm vi (API search only), Tiêu chí dừng (100% test case pass, 0 Critical bug)."},{"num":13,"question":"Cho hàm is_leap_year(year), thiết kế test case bao gồm các trường hợp biên đặc biệt (năm chia hết 100 nhưng không chia hết 400).","answer":"Test: year=1900(chia hết 100 không chia hết 400, không nhuận), year=2000(chia hết 400, nhuận), year=2023(thường), year=2024(chia hết 4)."},{"num":14,"question":"Viết đoạn code Python đơn giản đo Statement Coverage thủ công (đếm dòng đã ”chạm” qua) cho một hàm nhỏ.","answer":"covered = set(); def track(line): covered.add(line) – gọi track() tại mỗi điểm cần đo."},{"num":15,"question":"Thiết kế 3 test case Regression cho một chức năng đã sửa lỗi ”tính tổng giỏ hàng sai khi có mã giảm giá”.","answer":"```\ntest: giỏ hàng với mã giảm giá hợp lệ, mã giảm giá hết hạn, nhiều mã giảm giá\n```\n\ncùng lúc."}],"thuc_te":[{"num":1,"question":"Một công ty phát hành phần mềm với Coverage 95% nhưng vẫn gặp lỗi nghiêm trọng ngay tuần đầu ra mắt. Phân tích nguyên nhân có thể.","answer":"Coverage cao không đảm bảo hết lỗi logic/tích hợp; có thể do thiếu test case cho tình huống thực tế cụ thể (VD: dữ liệu người dùng thật khác dữ liệu test)."},{"num":2,"question":"Một đội QA chỉ test ”happy path” trước deadline gấp. Phân tích rủi ro và đề xuất chiến lược kiểm thử tối thiểu cần có.","answer":"Rủi ro cao (bỏ sót edge case/security); tối thiểu cần: happy path + vài edge case quan trọng + 1 security test cơ bản."},{"num":3,"question":"Một hệ thống ngân hàng yêu cầu Validation nghiêm ngặt hơn Verification. Giải thích lý do và đề xuất quy trình phù hợp.","answer":"Validation cần nghiêm ngặt hơn vì hậu quả sai sót tài chính trực tiếp ảnh hưởng tiền bạc khách hàng, cần xác nhận đúng NHU CẦU không chỉ đúng đặc tả."},{"num":4,"question":"Một dự án outsource giao nộp sản phẩm ”đã test” nhưng khách hàng phát hiện không đáp ứng nhu cầu thực tế. Phân tích đây là thất bại của Verification hay Validation.","answer":"Thất bại của Validation – vì ”đã test” (verification pass theo đặc tả nội bộ) nhưng KHÔNG đáp ứng nhu cầu thực tế khách hàng."},{"num":5,"question":"Một lỗi được đóng (Closed) nhưng xuất hiện lại sau 2 tháng trong bản release mới. Phân tích nguyên nhân liên quan Regression Testing.","answer":"Do thiếu Regression Testing khi thay đổi mã nguồn liên quan, hoặc do fix không đúng root cause ban đầu."},{"num":6,"question":"Một đội phát triển tin rằng ”code của chúng tôi không cần test vì đã rất đơn giản”. Phản biện quan điểm này bằng nguyên tắc ISTQB.","answer":"Phản biện: nguyên tắc ”exhaustive testing impossible” và ”testing shows presence of defects” áp dụng bất kể độ đơn giản – code đơn giản vẫn có thể có edge case bị bỏ sót."},{"num":7,"question":"Một tổ chức áp dụng test case CŨ suốt 3 năm không cập nhật. Phân tích hiện tượng ”Pesticide Paradox” trong tình huống này.","answer":"Đây chính là Pesticide Paradox – test case cũ không còn phát hiện được lỗi mới phát sinh; cần làm mới/bổ sung test case định kỳ."},{"num":8,"question":"Một startup phát hiện 80% lỗi nghiêm trọng đều nằm trong module thanh toán. Đề xuất chiến lược phân bổ nguồn lực QA dựa trên Defect Clustering.","answer":"Chiến lược: tập trung 60-70% nguồn lực QA vào module thanh toán (theo Defect Clustering), phần còn lại phân bổ đều các module khác. 17"},{"num":9,"question":"Một hệ thống y tế yêu cầu chứng minh test coverage đầy đủ cho cơ quan quản lý. Đề xuất loại coverage phù hợp và giới hạn của nó.","answer":"Đề xuất branch/statement coverage kèm giải thích rõ giới hạn (không đảm bảo hết lỗi phụ thuộc giá trị cụ thể, cần bổ sung Security Testing)."},{"num":10,"question":"Một công ty phát hiện lỗi bảo mật nghiêm trọng dù test suite có Branch Coverage 100%. Giải thích vì sao điều này có thể xảy ra.","answer":"Có thể do lỗi phụ thuộc GIÁ TRỊ cụ thể của input (VD: chia cho 0, integer overflow) mà Branch Coverage không đo được – coverage chỉ đo đường đi, không đo giá trị."},{"num":11,"question":"Một sản phẩm bị khách hàng từ chối dù ”tuân thủ đúng 100% đặc tả kỹ thuật”. Phân tích khoảng cách giữa Verification và Validation trong trường hợp này.","answer":"Khoảng cách giữa Verification (đúng đặc tả) và Validation (đúng nhu cầu) – đặc tả có thể đã sai/lỗi thời so với nhu cầu thị trường thực tế."},{"num":12,"question":"Một đội DevOps muốn tự động hóa Regression Testing cho mọi lần deploy. Đề xuất chiến lược chọn test case để tối ưu thời gian CI/CD.","answer":"Chiến lược: ưu tiên test case có LỊCH SỬ phát hiện lỗi cao nhất, test case liên quan trực tiếp thay đổi code, giới hạn thời gian chạy CI bằng cách chọn lọc thông minh (risk-based selection)."},{"num":13,"question":"Một tổ chức phát hiện tester và developer thường xuyên tranh cãi về việc ”đây có phải là lỗi hay không”. Đề xuất quy trình Defect Lifecycle rõ ràng để giảm xung đột.","answer":"Đề xuất: định nghĩa RÕ tiêu chí ”lỗi” (severity/priority matrix) và quy trình escalation khi có bất đồng giữa dev/tester."},{"num":14,"question":"Một hệ thống thương mại điện tử bị lỗi tính sai giá chỉ khi khách hàng nhập số lượng âm. Phân tích thiếu sót trong Boundary Value Analysis.","answer":"Thiếu sót trong Boundary Value Analysis – có thể chỉ test số dương, bỏ sót trường hợp số âm cho ”số lượng”."},{"num":15,"question":"Một công ty game phát hành bản beta test với người dùng thật thay vì chỉ QA nội bộ. Bàn luận ưu/nhược điểm cách tiếp cận này so với testing truyền thống.","answer":"Ưu: phát hiện lỗi thực tế đa dạng từ người dùng thật; Nhược: thiếu kiểm soát, khó tái tạo lỗi, trải nghiệm người dùng có thể bị ảnh hưởng xấu."}]}},{"id":"1.4","title":"Kiểm thử và kiểm chứng phần mềm II","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Formal Verification khác Testing thông thường ở điểm cốt lõi nào?","options":{"A":"Formal Verification chứng minh toán học thay vì chỉ thử một số trường hợp","B":"Formal Verification luôn nhanh hơn Testing","C":"Không có khác biệt thực sự","D":"Formal Verification chỉ áp dụng cho phần cứng"},"correct":"A","explanation":"Formal Verification chứng minh toán học, không chỉ thử một số trường hợp."},{"num":2,"question":"Hai hướng tiếp cận chính của Formal Verification là gì?","options":{"A":"Unit Testing và Integration Testing","B":"Model Checking và Theorem Proving","C":"Black-box và White-box Testing","D":"Static và Dynamic Testing"},"correct":"B","explanation":"Model Checking và Theorem Proving."},{"num":3,"question":"Model Checking hoạt động theo nguyên lý nào?","options":{"A":"Kiểm tra tự động, vét cạn không gian trạng thái","B":"Chỉ thử một input ngẫu nhiên","C":"Yêu cầu con người chứng minh từng bước","D":"Không cần mô hình hệ thống"},"correct":"A","explanation":"Model Checking: kiểm tra tự động, vét cạn không gian trạng thái."},{"num":4,"question":"Theorem Proving có ưu điểm gì so với Model Checking?","options":{"A":"Luôn nhanh hơn","B":"Xử lý được hệ thống vô hạn trạng thái","C":"Không cần chuyên gia","D":"Hoàn toàn tự động không cần con người"},"correct":"B","explanation":"Theorem Proving xử lý được hệ thống vô hạn trạng thái."},{"num":5,"question":"Công cụ nào sau đây là Theorem Prover?","options":{"A":"NuSMV","B":"SPIN","C":"Coq","D":"CBMC"},"correct":"C","explanation":"Coq là Theorem Prover."},{"num":6,"question":"”Sound” trong ngữ cảnh kỹ thuật QA có nghĩa là gì?","options":{"A":"Không báo sai (không bỏ sót lỗi thật)","B":"Tìm được mọi lỗi","C":"Chạy nhanh","D":"Không cần con người can thiệp"},"correct":"A","explanation":"Sound: không báo sai, không bỏ sót lỗi thật."},{"num":7,"question":"”Complete” trong ngữ cảnh kỹ thuật QA có nghĩa là gì?","options":{"A":"Tìm được mọi lỗi tồn tại (không có false positive che khuất)","B":"Không bao giờ sai","C":"Chỉ áp dụng cho phần cứng","D":"Luôn chạy trong thời gian hữu hạn"},"correct":"A","explanation":"Complete: tìm được mọi lỗi tồn tại."},{"num":8,"question":"Trong bảng so sánh kỹ thuật, Model Checking có đặc điểm nào về Sound và Complete?","options":{"A":"Không sound, không complete","B":"Sound và Complete (trong không gian trạng thái hữu hạn)","C":"Chỉ complete, không sound","D":"Chỉ sound, không complete"},"correct":"B","explanation":"Model Checking: Sound và Complete trong không gian hữu hạn."}],"ly_thuyet":[{"num":1,"question":"Trình bày định nghĩa Formal Verification và phân biệt với Testing thông thường.","answer":"Formal Verification dùng phương pháp toán học CHỨNG MINH tính đúng đắn đối với đặc tả hình thức, khác Testing chỉ thử một số trường hợp cụ thể không đầy đủ."},{"num":2,"question":"Mô tả hai hướng tiếp cận chính của Formal Verification: Model Checking và Theorem Proving.","answer":"Model Checking: tự động, vét cạn không gian trạng thái (hữu hạn/rút gọn); Theorem Proving: xây dựng chứng minh toán học, có thể cần tương tác con người."},{"num":3,"question":"Giải thích ý tưởng cốt lõi của Model Checking, liên hệ với Kripke Structure đã học ở Mục 1.5.","answer":"Model Checking hoạt động trên mô hình Kripke Structure K = (S, S0 , R, L), kiểm tra công thức CTL/LTL bằng cách duyệt/phân tích không gian trạng thái để xác nhận đúng hoặc tìm counterexample."},{"num":4,"question":"Trình bày ưu và nhược điểm của Theorem Proving so với Model Checking.","answer":"Ưu Theorem Proving: xử lý hệ vô hạn trạng thái; Nhược: cần chuyên gia, tốn công sức, khó tự động hóa hoàn toàn so với Model Checking."},{"num":5,"question":"Giải thích khái niệm Sound và Complete, cho ví dụ minh họa mỗi khái niệm.","answer":"Sound: không có false negative (khi nói an toàn là chắc chắn đúng). VD: một type checker sound không bao giờ chấp nhận chương trình có lỗi kiểu dữ liệu."},{"num":6,"question":"Bàn luận: tại sao không có kỹ thuật QA nào vừa Sound, vừa Complete, vừa hoàn toàn tự động cho MỌI chương trình?","answer":"Không thể vì theo hệ quả Định lý Rice, hầu hết thuộc tính ngữ nghĩa không tầm thường là undecidable – luôn phải đánh đổi ít nhất một trong ba tính chất."},{"num":7,"question":"Trình bày bảng so sánh Testing, Fuzzing, Static Analysis, Model Checking, Theorem Proving theo các tiêu chí: automation, sound, complete, chi phí.","answer":"Bảng: Testing(cao,không,không,thấp); Fuzzing(cao,không,không,thấp-TB); Static Analysis(TB,thường có,thường không,TB); Model Checking(TB-cao,có,có trong bound,TB- cao); Theorem Proving(thấp,có,có,rất cao)."},{"num":8,"question":"Giải thích Penetration Testing và vai trò của nó trong bức tranh tổng thể Security Testing.","answer":"Penetration Testing mô phỏng tấn công THỰC TẾ trên hệ thống ĐANG CHẠY bởi chuyên gia (ethical hacker), bổ sung cho phân tích tĩnh bằng góc nhìn kẻ tấn công thực sự."},{"num":9,"question":"Mô tả Red Team/Blue Team exercise và giá trị của diễn tập này đối với tổ chức.","answer":"Red Team tấn công, Blue Team phòng thủ trong một kịch bản mô phỏng thực tế – giúp tổ chức đánh giá khả năng phát hiện/ứng phó sự cố thực sự, không chỉ lý thuyết."},{"num":10,"question":"Trình bày Common Criteria (ISO 15408) và ý nghĩa của các mức EAL1– EAL7.","answer":"Common Criteria (ISO 15408): 7 mức EAL1(thấp nhất)-EAL7(cao nhất), mức càng cao yêu cầu bằng chứng đảm bảo an toàn càng nghiêm ngặt, tới EAL6-7 cần formal verification."},{"num":11,"question":"Giải thích tại sao DO-178C (hàng không) Level A yêu cầu formal methods chặt chẽ hơn phần mềm thông thường.","answer":"DO-178C Level A (mức nghiêm trọng cao nhất) áp dụng cho phần mềm mà lỗi có thể gây tai nạn thảm khốc – yêu cầu formal methods để đạt độ tin cậy tối đa."},{"num":12,"question":"Bàn luận về vai trò của ISO/IEC 27001 trong quản lý an toàn thông tin tổ chức.","answer":"ISO/IEC 27001 cung cấp khung quản lý an toàn thông tin toàn diện (chính sách, quy trình, kiểm soát) cho tổ chức, không chỉ kỹ thuật mà cả quản trị."},{"num":13,"question":"Trình bày các yếu tố cần cân nhắc khi lựa chọn kỹ thuật QA phù hợp cho một dự án cụ thể.","answer":"Các yếu tố: mức độ tới hạn module, kích thước codebase, kỹ năng đội ngũ, deadline dự án – không có công thức cố định, cần đánh giá tổng hợp."},{"num":14,"question":"Giải thích tại sao thành phần bảo mật lõi (crypto, authentication) thường được ưu tiên áp dụng Formal Verification.","answer":"Vì lỗi trong thành phần bảo mật lõi (crypto, auth) có tác động LAN RỘNG (ảnh hưởng mọi chức năng phụ thuộc) và khó phát hiện bằng testing thông thường do tính chất toán học phức tạp."},{"num":15,"question":"Mô tả Security Code Review và phân biệt với cả Static Analysis tự động lẫn Penetration Testing.","answer":"Security Code Review: con người rà soát mã nguồn tĩnh; Static Analysis: công cụ tự động; Penetration Testing: tấn công hệ thống chạy thực tế – ba góc nhìn bổ sung nhau. 20\n\n```\nMỤC 1.4 – KIỂM THỬ VÀ KIỂM CHỨNG PHẦN MỀM II\n```"}],"thuc_hanh":[{"num":1,"question":"Viết một bảng so sánh (Markdown) 5 kỹ thuật QA đã học theo 4 tiêu chí: automation, sound, complete, chi phí.","answer":"Bảng: Testing(Auto:cao,Sound:không,Complete:không,Chi phí:thấp); tương tự cho\n\n```\nkỹ thuật còn lại theo lý thuyết đã học.\n```"},{"num":2,"question":"Cho một thư viện mã hóa ngân hàng, đề xuất tổ hợp kỹ thuật QA cụ thể (liệt kê từng kỹ thuật và lý do).","answer":"Đề xuất: Unit test (functional) + Static Analysis Cppcheck (nhanh) + CBMC (module core mã hóa) + Penetration test (trước release). 21\n\n```\nMỤC 1.4 – KIỂM THỬ VÀ KIỂM CHỨNG PHẦN MỀM II\n```"},{"num":3,"question":"Viết một checklist (5 mục) đánh giá xem một module có ”đủ tới hạn” để cần Formal Verification hay không.","answer":"Checklist: (1) Ảnh hưởng tài chính/an toàn tính mạng?, (2) Lỗi khó phát hiện bằng testing?, (3) Yêu cầu compliance?, (4) Chi phí lỗi cao?, (5) Có chuyên gia formal method?"},{"num":4,"question":"Thiết kế một quy trình (flowchart) lựa chọn kỹ thuật QA dựa trên: mức độ tới hạn, deadline, kỹ năng đội ngũ.","answer":"Flowchart: Module mới → [Tới hạn cao?] –Yes–> Formal Verification; –No–> [Deadline gấp?] –Yes–> Testing nhanh; –No–> Static Analysis."},{"num":5,"question":"Với module xử lý input mạng phức tạp, đề xuất thứ tự áp dụng: Testing → Fuzzing → Static Analysis → Formal Verification.","answer":"Thứ tự: Testing cơ bản (baseline) → Fuzzing (tìm crash) → Static Analysis (Cppcheck+CBMC) → Formal Verification (nếu cần chứng minh tuyệt đối)."},{"num":6,"question":"Viết một bảng ánh xạ Common Criteria EAL level → mức độ formal method cần áp dụng.","answer":"Bảng: EAL1-2→Testing cơ bản; EAL3-4→Static Analysis; EAL5-6→Model Checking; EAL7→Theorem Proving đầy đủ."},{"num":7,"question":"Cho một tình huống dự án hàng không (DO-178C Level A), liệt kê các hoạt động QA cụ thể cần thực hiện.","answer":"Hoạt động: formal spec mọi yêu cầu, code review 100%, static analysis bắt buộc, model checking module điều khiển, test coverage 100% MC/DC."},{"num":8,"question":"Thiết kế một bảng phân loại 10 module giả định của một hệ thống theo mức độ tới hạn (Low/Medium/High/Critical).","answer":"Bảng 10 module: Auth(Critical), Logging(Low), Payment(Critical), UI(Low), Search(Medium)... phân loại theo impact."},{"num":9,"question":"Viết kịch bản (scenario) đơn giản cho một buổi diễn tập Red Team/Blue Team trong một tổ chức nhỏ.","answer":"Kịch bản: Red Team cố gắng truy cập hệ thống HR trong 3 ngày; Blue Team giám sát/phản ứng; debrief cuối cùng rút kinh nghiệm."},{"num":10,"question":"Cho một danh sách 5 thành phần hệ thống, đề xuất kỹ thuật QA phù hợp nhất cho từng thành phần kèm lý do.","answer":"VD: Auth module→Model Checking(tới hạn cao); Logging module→Testing thông thường(tới hạn thấp); Payment→Formal Verification+Pentest."},{"num":11,"question":"Viết một đoạn văn (200 từ) so sánh cách tiếp cận ”kiểm thử truyền thống” và ”kiểm chứng hình thức” cho một hàm xử lý thanh toán. 23\n\n```\nMỤC 1.4 – KIỂM THỬ VÀ KIỂM CHỨNG PHẦN MỀM II\n```","answer":"Đoạn văn: kiểm thử truyền thống thử một số trường hợp cụ thể (nhanh, không đảm bảo đầy đủ); kiểm chứng hình thức chứng minh cho MỌI trường hợp có thể trong mô hình (chậm hơn, đảm bảo cao hơn) – với hàm thanh toán, formal verification đáng giá do rủi ro tài chính cao."},{"num":12,"question":"Thiết kế bảng phân bổ ngân sách QA (giả định 100 triệu VNĐ) cho 4 kỹ thuật khác nhau dựa trên mức độ ưu tiên.","answer":"Ngân sách: Testing(20tr), Static Analysis(30tr), Model Checking module core(40tr), Pentest(10tr) = 100tr, ưu tiên theo mức tới hạn."},{"num":13,"question":"Cho một startup fintech mới thành lập, đề xuất lộ trình áp dụng dần các kỹ thuật QA theo thời gian (6 tháng, 1 năm, 2 năm).","answer":"Lộ trình: Tháng 1-6 chỉ Testing; Năm 1 thêm Static Analysis (Cppcheck/SonarQube); Năm 2 thêm Model Checking cho module lõi khi đã ổn định."},{"num":14,"question":"Viết một bảng liệt kê 3 công cụ Model Checking và 3 công cụ Theorem Proving phổ biến, kèm ngôn ngữ/nền tảng hỗ trợ.","answer":"Bảng: NuSMV(symbolic,C-like input), SPIN(Promela,concurrent system); Coq(Gallina,general), Isabelle/HOL(ML-like,mathematics), Lean(dependent types,math+software)."},{"num":15,"question":"Thiết kế một ma trận quyết định (decision matrix) với trọng số cho việc chọn giữa Testing, Static Analysis, Formal Verification.","answer":"Ma trận: tiêu chí(tới hạn,chi phí,thời gian) x trọng số x điểm mỗi kỹ thuật, tổng điểm cao nhất là lựa chọn."}],"thuc_te":[{"num":1,"question":"Một hãng hàng không phát hiện phần mềm điều khiển động cơ chỉ qua Unit Test, chưa qua formal verification. Phân tích rủi ro và đề xuất theo DO-178C. 24\n\n```\nMỤC 1.4 – KIỂM THỬ VÀ KIỂM CHỨNG PHẦN MỀM II\n```","answer":"Rủi ro nghiêm trọng (an toàn tính mạng); DO-178C Level A yêu cầu formal verification bắt buộc, không thể chỉ dựa Unit Test."},{"num":2,"question":"Một ngân hàng quyết định KHÔNG đầu tư Formal Verification cho module core vì ”quá tốn kém”. Phân tích rủi ro dài hạn của quyết định này.","answer":"Rủi ro dài hạn: lỗ hổng logic tinh vi có thể tồn tại nhiều năm không phát hiện, dẫn tới thiệt hại tài chính lớn hơn nhiều chi phí formal verification ban đầu."},{"num":3,"question":"Một công ty đạt chứng chỉ Common Criteria EAL4 nhưng vẫn bị tấn công qua lỗ hổng logic. Phân tích giới hạn của chứng chỉ này.","answer":"Chứng chỉ chỉ đảm bảo mức kiểm chứng NHẤT ĐỊNH tại thời điểm đánh giá, không đảm bảo an toàn TUYỆT ĐỐI, đặc biệt với lỗi logic ngoài phạm vi threat model đã xét."},{"num":4,"question":"Một tổ chức tài chính thuê Red Team bên ngoài, phát hiện lỗ hổng nghiêm trọng chưa từng biết. Bàn luận giá trị của diễn tập Red Team so với chỉ dựa vào audit nội bộ.","answer":"Red Team bên ngoài mang góc nhìn ”kẻ tấn công thực sự” không bị giới hạn bởi giả định nội bộ – audit nội bộ dễ bỏ sót vì ”quen thuộc” với hệ thống."},{"num":5,"question":"Một startup công nghệ y tế cần tuân thủ ISO 27001 để ký hợp đồng với bệnh viện lớn. Đề xuất lộ trình đạt chứng chỉ này.","answer":"Lộ trình: đánh giá gap hiện tại → xây dựng policy/quy trình → triển khai kiểm soát kỹ thuật → audit thử → đăng ký chứng nhận chính thức."},{"num":6,"question":"Một dự án chính phủ yêu cầu Theorem Proving cho module bỏ phiếu điện tử nhưng đội ngũ thiếu chuyên gia. Đề xuất giải pháp (đào tạo, thuê ngoài, hoặc thay đổi kỹ thuật).","answer":"Giải pháp: đào tạo nội bộ 1 người chuyên sâu, hoặc thuê tư vấn ngắn hạn kết hợp, hoặc cân nhắc Model Checking (ít cần chuyên gia hơn Theorem Proving) nếu đủ đáp ứng yêu cầu."},{"num":7,"question":"Một công ty ô tô tự lái phát hiện lỗi logic hiếm gặp chỉ xảy ra trong 1/10 triệu tình huống. Phân tích vì sao Testing thông thường khó phát hiện và đề xuất Model Checking.","answer":"Testing khó phát hiện vì tần suất quá thấp (1/10 triệu); Model Checking vét cạn KHÔNG GIAN TRẠNG THÁI thay vì thử ngẫu nhiên, có khả năng phát hiện các trường hợp hiếm này."},{"num":8,"question":"Một tổ chức bị kiểm toán phát hiện không có bất kỳ Security Code Review nào trong 2 năm. Phân tích rủi ro tích lũy và đề xuất khắc phục.","answer":"Rủi ro tích lũy: lỗ hổng không phát hiện chồng chất theo thời gian; khắc phục: thiết lập lịch Security Code Review định kỳ (VD mỗi quý) bắt buộc."},{"num":9,"question":"Một dự án quốc phòng yêu cầu EAL7 (mức cao nhất). Phân tích chi phí và thời gian ước tính so với dự án thương mại thông thường.","answer":"EAL7 đòi hỏi formal verification cho TOÀN BỘ thiết kế, thời gian có thể gấp 5-10 lần dự án thương mại thông thường (nhiều năm so với vài tháng). 23\n\n```\nMỤC 1.4 – KIỂM THỬ VÀ KIỂM CHỨNG PHẦN MỀM II\n```"},{"num":10,"question":"Một công ty bảo hiểm bị khách hàng khởi kiện do lỗi tính toán sai trong hợp đồng tự động. Đề xuất kỹ thuật QA lẽ ra nên áp dụng để ngăn lỗi này.","answer":"Kỹ thuật lẽ ra nên áp dụng: Model Checking hoặc Theorem Proving cho công thức tính phí (thuộc tính tới hạn tài chính), không chỉ testing thông thường."},{"num":11,"question":"Một tổ chức y tế mua phần mềm từ nhà cung cấp không rõ quy trình QA. Đề xuất các câu hỏi cần đặt ra trước khi ký hợp đồng.","answer":"Câu hỏi: Quy trình QA của nhà cung cấp là gì? Có chứng chỉ ISO 27001/Common Criteria không? Có SBOM không? Có lịch sử CVE và cách xử lý ra sao?"},{"num":12,"question":"Một dự án blockchain phát hiện lỗ hổng smart contract gây thiệt hại hàng triệu đô sau khi triển khai. Phân tích vì sao formal verification ngày càng quan trọng trong lĩnh vực này.","answer":"Ngày càng quan trọng vì smart contract không thể ”vá” sau triển khai (immutable) và xử lý tài sản giá trị lớn – formal verification là cách duy nhất đảm bảo TRƯỚC khi không thể sửa."},{"num":13,"question":"Một công ty phần mềm nha khoa nhỏ hỏi có cần Common Criteria không. Tư vấn dựa trên mức độ rủi ro thực tế của sản phẩm.","answer":"Tư vấn: mức rủi ro thấp (dữ liệu không quá nhạy cảm), có thể không cần Common Criteria chính thức, nhưng nên áp dụng static analysis cơ bản."},{"num":14,"question":"Một tổ chức phát hiện Red Team và Blue Team của họ không bao giờ thực sự ”đối đầu” (đã biết trước kịch bản). Phân tích vấn đề và đề xuất cải thiện tính thực tế.","answer":"Vấn đề: kịch bản biết trước làm mất tính ”thực tế” của diễn tập; cải thiện: Red Team độc lập, Blue Team không biết trước thời điểm/phương thức tấn công."},{"num":15,"question":"Một dự án
