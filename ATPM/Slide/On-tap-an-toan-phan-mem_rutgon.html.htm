 hàng không vũ trụ yêu cầu chứng minh formal cho MỌI dòng code. Bàn luận tính khả thi và đề xuất ưu tiên theo mức độ tới hạn.","answer":"Không khả thi 100%; đề xuất: ưu tiên formal verification cho module điều khiển bay/an toàn tính mạng trực tiếp, dùng testing/static analysis cho phần còn lại."}]}},{"id":"1.5","title":"Cấu trúc Kripke (Kripke Structure)","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Một Kripke Structure được định nghĩa là bộ 4 thành phần nào?","options":{"A":"(S, S0 , R, L)","B":"(V, E, W, D)","C":"(A, B, C, D)","D":"(P, Q, R, S)"},"correct":"A","explanation":"K = (S, S0 , R, L)."},{"num":2,"question":"Trong Kripke Structure, S đại diện cho:","options":{"A":"Tập hữu hạn các trạng thái","B":"Tập trạng thái khởi tạo","C":"Quan hệ chuyển tiếp","D":"Hàm gán nhãn"},"correct":"A","explanation":"S: tập hữu hạn các trạng thái."},{"num":3,"question":"S0 trong Kripke Structure là:","options":{"A":"Tập con của S, đại diện trạng thái khởi tạo","B":"Tập tất cả các cạnh","C":"Hàm gán nhãn","D":"Số lượng trạng thái"},"correct":"A","explanation":"S0 : tập con của S, trạng thái khởi tạo."},{"num":4,"question":"Quan hệ chuyển tiếp R trong Kripke Structure phải thỏa mãn tính chất gì?","options":{"A":"Đối xứng","B":"Total (mọi trạng thái có ít nhất một trạng thái kế tiếp)","C":"Bắc cầu","D":"Phản xạ"},"correct":"B","explanation":"R phải total: mọi trạng thái có ít nhất một trạng thái kế tiếp."},{"num":5,"question":"Nếu một trạng thái không có transition đi ra, ta nên xử lý thế nào để thỏa mãn tính ”total”?","options":{"A":"Xóa trạng thái đó","B":"Thêm self-loop","C":"Bỏ qua yêu cầu total","D":"Không cần xử lý gì"},"correct":"B","explanation":"Thêm self-loop để đảm bảo total."},{"num":6,"question":"Hàm gán nhãn L trong Kripke Structure có kiểu dữ liệu nào?","options":{"A":"L : S → 2AP","B":"L : S → S","C":"L : AP → S","D":"L : R → S"},"correct":"A","explanation":"L : S → 2AP ."},{"num":7,"question":"AP trong định nghĩa Kripke Structure là viết tắt của:","options":{"A":"Atomic Propositions (mệnh đề nguyên tử)","B":"Algorithm Process","C":"Abstract Pointer","D":"Access Permission"},"correct":"A","explanation":"AP = Atomic Propositions."},{"num":8,"question":"Một ”path” trong Kripke Structure là:","options":{"A":"Một dãy hữu hạn các trạng thái","B":"Một dãy vô hạn s0 , s1 , s2 , . . . thỏa quan hệ R","C":"Chỉ một trạng thái duy nhất","D":"Tập hợp tất cả các trạng thái"},"correct":"B","explanation":"Path: dãy vô hạn s0 , s1 , . . . thỏa R."},{"num":9,"question":"”Trace” của một path là:","options":{"A":"Dãy các tập nhãn L(s0 ), L(s1 ), . . . tương ứng","B":"Số lượng trạng thái trong path","C":"Thời gian thực thi","D":"Tên của Kripke Structure"},"correct":"A","explanation":"Trace: dãy nhãn L(s0 ), L(s1 ), . . .."}],"ly_thuyet":[{"num":1,"question":"Trình bày định nghĩa hình thức của Kripke Structure K = (S, S0 , R, L) và giải thích ý nghĩa từng thành phần.","answer":"K = (S, S0 , R, L): S tập trạng thái, S0 ⊆ S trạng thái khởi tạo, R ⊆ S × S quan hệ chuyển tiếp (total), L : S → 2AP hàm gán nhãn."},{"num":2,"question":"Giải thích tại sao quan hệ chuyển tiếp R trong Kripke Structure phải có tính chất ”total”.","answer":"R phải total để đảm bảo MỌI path đều vô hạn (không bị ”kẹt”) – cần thiết cho định nghĩa toán học nhất quán của path trong model checking."},{"num":3,"question":"Mô tả khái niệm path và trace, phân biệt hai khái niệm này.","answer":"Path: dãy vô hạn trạng thái s0 , s1 , . . . theo R; Trace: dãy các NHÃN tương ứng L(s0 ), L(s1 ), . . . – trace là những gì quan sát được từ bên ngoài, path là chuỗi trạng thái nội tại."},{"num":4,"question":"Trình bày công thức CTL AG(ϕ) và EF (ϕ), cho ví dụ minh họa mỗi công thức.","answer":"AG(ϕ): trên MỌI path, ϕ đúng ở MỌI trạng thái (invariant, VD ”không bao giờ unsafe”). EF (ϕ): TỒN TẠI path mà ϕ đúng tại một điểm (reachability, VD ”có thể đạt admin”)."},{"num":5,"question":"Giải thích mối liên hệ giữa hàm check_invariant() trong kripke.py và công thức CTL AG(¬unsaf e).","answer":"check_invariant(unsafe) dùng BFS tìm xem có trạng thái nào mang nhãn unsafe REACHABLE từ S0 hay không – nếu có, AG(¬unsaf e) SAI (counterexample); nếu không, AG(¬unsaf e) ĐÚNG."},{"num":6,"question":"Giải thích mối liên hệ giữa hàm check_reachability() và công thức CTL EF (goal).","answer":"check_reachability(goal) tìm tập TOÀN BỘ trạng thái reachable rồi lọc những trạng thái có nhãn goal – nếu tập khác rỗng, EF (goal) ĐÚNG."},{"num":7,"question":"Mô tả thuật toán BFS được dùng trong check_invariant() để tìm counterexample.","answer":"BFS duyệt theo tầng từ S0 , lưu parent để tái tạo đường đi ngắn nhất tới trạng thái vi phạm khi tìm thấy, làm counterexample dễ hiểu nhất."},{"num":8,"question":"Trình bày vấn đề State Explosion và giải thích tại sao nó là thách thức cốt lõi của Model Checking.","answer":"State Explosion: không gian trạng thái tăng theo HÀM MŨ với số biến độc lập (2n ), khiến việc liệt kê/lưu trữ tường minh trở nên bất khả thi với hệ thống thực tế lớn."},{"num":9,"question":"Giải thích ba hướng giải quyết State Explosion: Bounded Model Checking, Symbolic Model Checking, SAT/SMT solving.","answer":"BMC: giới hạn số bước unroll k để giảm kích thước bài toán; Symbolic MC: biểu diễn TẬP trạng thái bằng BDD thay vì liệt kê từng cái; SAT/SMT: quy bài toán về công thức logic cho solver giải."},{"num":10,"question":"Bàn luận: vì sao Bounded Model Checking chỉ ”sound có điều kiện” (trong giới hạn bound đã chọn)?","answer":"BMC chỉ ”sound trong bound k” vì nếu lỗi thực sự nằm ở bước thứ k + 1 trở đi, BMC sẽ KHÔNG phát hiện được – cần unwinding-assertions để biết bound đã đủ hay chưa (học ở Ch.3.5)."},{"num":11,"question":"Trình bày công cụ Model Checking thực tế: NuSMV, SPIN, CBMC, Z3 – mỗi công cụ phù hợp với loại bài toán nào.","answer":"NuSMV/nuXmv: symbolic MC hệ hữu hạn trạng thái; SPIN: verify hệ concurrent (Promela); CBMC: BMC trực tiếp trên mã C; Z3: SMT solver nền tảng cho nhiều công cụ trên."},{"num":12,"question":"Giải thích tại sao CBMC được coi là bước tiến so với NuSMV/SPIN trong việc kiểm chứng mã nguồn thực tế.","answer":"CBMC không cần xây mô hình trừu tượng THỦ CÔNG – nó TỰ ĐỘNG sinh mô hình từ chính mã nguồn C, giảm sai sót do mô hình hóa tay và phản ánh chính xác hành vi thực tế."},{"num":13,"question":"Mô tả ví dụ mô hình đăng nhập (login) trong bài giảng, chỉ ra lỗ hổng bypass xác thực bằng Kripke Structure.","answer":"Mô hình login: s0(init) → s1(waiting) → s2(auth) → s3(admin_hop_le); đường tắt s1 → s4(admin_bypass) là lỗ hổng – AG(¬unsaf e_no_auth) SAI với counterexample s0 → s1 → s4."},{"num":14,"question":"Trình bày ví dụ đèn giao thông như một Kripke Structure đơn giản, xác định đầy đủ S, S0 , R, L.","answer":"Đèn giao thông: S = {, xanh, vng}, S0 = {}, R = {(, xanh), (xanh, vng), (vng, )}, L() = {stop},..."},{"num":15,"question":"Giải thích sự khác biệt giữa LTL và CTL về sức biểu đạt (expressiveness).","answer":"LTL biểu diễn thuộc tính trên MỘT dãy thi hành tuyến tính; CTL phân nhánh trên CÂY các path có thể – hai loại có sức biểu đạt không so sánh được (mỗi loại biểu diễn được thuộc tính mà loại kia không biểu diễn tự nhiên). 26"}],"thuc_hanh":[{"num":1,"question":"Chạy python3 atpm/ch1_concepts/kripke.py và ghi lại kết quả check_invariant() cho mô hình đăng nhập mẫu.","answer":"Kết quả: holds=False, counterexample = s0 → s1 → s4 (đường bypass xác thực). 27"},{"num":2,"question":"Sửa mô hình build_login_example(): loại bỏ đường tắt s1 → s4, chạy lại và xác nhận AG(¬unsaf e) đúng.","answer":"Sau khi xóa add_transition(\"s1_cho_dang_nhap\", \"s4_admin_bypass\"), chạy lại check_invariant trả về holds=True."},{"num":3,"question":"Mở rộng mô hình đăng nhập: thêm trạng thái s5_khoa_tai_khoan sau 3 lần đăng nhập sai, kiểm tra EF (locked).","answer":"Thêm k.add_state(\"s5_khoa\", labels=[\"locked\"]) và transition từ trạng thái sai 3 lần; check_reachability(\"locked\") trả về True nếu có đường tới s5."},{"num":4,"question":"Xuất mô hình bằng to_dot() và render bằng Graphviz (dot -Tpng model.dot -o model.png).","answer":"Lệnh: model.to_dot() in ra DOT source; sau đó dot -Tpng model.dot -o model.png sinh ảnh trực quan."},{"num":5,"question":"Viết một Kripke Structure mới bằng Python mô hình hóa đèn giao thông có thêm trạng thái ”nhấp nháy khẩn cấp”.","answer":"Kripke: S = {, xanh, vng, nhp_nhy}, thêm transition từ mọi trạng thái tới nhấp_nháy khi có tín hiệu khẩn cấp."},{"num":6,"question":"Viết test pytest xác nhận AG(¬bypass) đúng cho mô hình đã sửa (loại bỏ đường tắt).","answer":"def test_no_bypass(): model = build_login_example_fixed(); result = model.check_invarian assert result[\"holds\"] == True."},{"num":7,"question":"Cài đặt hàm check_eventually(self, goal_label) kiểm tra công thức AF (goal) (khác với EF đã có).","answer":"def check_eventually(self, goal): reachable = self.reachable_from(); return all(goal in self.labels_of(s) for s in leaf nodes) (cần xử lý thêm cho path vô hạn)."},{"num":8,"question":"Viết một Kripke Structure mô hình hóa hệ thống file access control (no_access → read_only → read_write) với 1 lỗ hổng privilege escalation.","answer":"States: no_access→read_only→read_write(hợp lệ), thêm cạnh tắt no_access→read_write(lỗ hổng privilege escalation)."},{"num":9,"question":"Chạy check_reachability(\"admin\") trên mô hình đăng nhập gốc, giải thích witness_states trả về.","answer":"witness_states chứa cả s3_admin_hop_le và s4_admin_bypass – cho thấy ”admin” đạt được qua CẢ đường hợp lệ lẫn đường lỗ hổng."},{"num":10,"question":"Viết hàm Python tính số lượng trạng thái reachable từ S0 bằng cách gọi reachable_from().","answer":"def count_reachable(k): return len(k.reachable_from())."},{"num":11,"question":"Thiết kế một Kripke Structure có ít nhất 2 lỗ hổng bypass khác nhau và viết test phát hiện cả hai bằng check_invariant.","answer":"Model với 2 unsafe labels khác nhau (VD ”bypass_auth” và ”privilege_leak”), gọi check_invariant riêng cho từng label."},{"num":12,"question":"Sửa to_dot() để thêm màu sắc khác nhau cho trạng thái ”unsafe” khi xuất ra Graphviz. 29","answer":"Sửa to_dot(): fillcolor = \"red\" if \"unsafe\" in label else \"white\" thêm vào node attributes."},{"num":13,"question":"Viết một kịch bản Python tạo ngẫu nhiên một Kripke Structure với 10 trạng thái và kiểm tra tính total.","answer":"import random; states = [f\"s{i}\" for i in range(10)]; ... sinh transitions ngẫu nhiên rồi gọi validate_total()."},{"num":14,"question":"Cài đặt hàm count_unsafe_states(self, unsafe_label) đếm số trạng thái có nhãn unsafe trong mô hình.","answer":"def count_unsafe_states(self, label): return sum(1 for s in self.states if label in self.labels_of(s))."},{"num":15,"question":"Với ví dụ file access control, viết test pytest xác nhận AG(¬priv_esc) SAI (có bypass) trước khi sửa.","answer":"result = model.check_invariant(\"priv_esc\"); assert result[\"holds\"] == False – xác nhận lỗ hổng tồn tại trước khi sửa."}],"thuc_te":[{"num":1,"question":"Một hệ thống điều khiển thang máy cần đảm bảo ”không bao giờ cửa mở khi thang đang di chuyển”. Mô hình hóa bằng Kripke Structure và xác định thuộc tính CTL cần kiểm tra. 30","answer":"Mô hình: states=moving,door_open,door_closed; unsafe label khi (moving ∧ door_open) đồng thời; kiểm tra AG(¬(moving ∧ door_open))."},{"num":2,"question":"Một công ty fintech phát hiện lỗi logic trong quy trình xử lý giao dịch qua nhiều trạng thái (pending, processing, completed, failed). Đề xuất cách mô hình hóa bằng Kripke Structure để tìm lỗi.","answer":"Mô hình hóa transaction states (pending,processing,completed,failed) bằng Kripke Structure, kiểm tra AG(¬(completed ∧ failed)) (không đồng thời hai trạng thái cuối mâu thuẫn)."},{"num":3,"question":"Một hệ thống kiểm soát ra vào tòa nhà bằng thẻ từ gặp sự cố cho phép vào dù thẻ đã bị vô hiệu hóa. Mô hình hóa tình huống này và xác định trạng thái ”unsafe”.","answer":"Trạng thái unsafe: ”access_granted ∧ card_disabled”; mô hình hóa transition kiểm tra thẻ, tìm counterexample nếu có đường bỏ qua kiểm tra trạng thái thẻ."},{"num":4,"question":"Một đội phát triển game online cần đảm bảo ”người chơi không bao giờ có điểm âm”. Đề xuất mô hình Kripke và thuộc tính CTL kiểm tra.","answer":"Mô hình: score là biến trong label (VD score_negative); AG(¬score_negative) là thuộc tính cần kiểm tra qua mọi trạng thái game."},{"num":5,"question":"Một hệ thống quản lý kho hàng phát hiện lỗi cho phép xuất kho khi số lượng tồn = 0. Mô hình hóa và xác định counterexample tương ứng.","answer":"Mô hình states kho hàng (in_stock, out_of_stock); unsafe = ”export ∧ out_of_stock”; counterexample chỉ ra transition thiếu kiểm tra tồn kho."},{"num":6,"question":"Một ngân hàng cần kiểm chứng ”tài khoản không bao giờ có số dư âm sau giao dịch”. Đề xuất cách mô hình hóa bằng Kripke Structure.","answer":"Mô hình: balance là một phần label; kiểm tra AG(balance ≥ 0) qua toàn bộ transitions giao dịch (nạp, rút, chuyển khoản)."},{"num":7,"question":"Một hệ thống đèn giao thông thông minh (smart traffic light) cần đảm bảo không bao giờ 2 hướng cùng có đèn xanh. Mô hình hóa và kiểm tra bằng CTL.","answer":"Mô hình 2 hướng đèn (A,B) với AP={A_green, B_green}; kiểm tra AG(¬(A_green ∧ B_green))."},{"num":8,"question":"Một ứng dụng đặt phòng khách sạn phát hiện lỗi cho phép đặt trùng phòng trong cùng khung giờ. Đề xuất mô hình hóa trạng thái phòng và kiểm tra.","answer":"Mô hình trạng thái phòng (available, booked) theo khung giờ; unsafe = 2 booking chồng chéo cùng phòng cùng giờ."},{"num":9,"question":"Một hệ thống quản lý quyền truy cập tài liệu (document access) cần đảm bảo ”người dùng không có quyền không bao giờ đọc được tài liệu mật”. Mô hình hóa bằng Kripke Structure.","answer":"AP gồm quyền của user và trạng thái tài liệu; kiểm tra AG(¬(no_permission ∧ document_read))."},{"num":10,"question":"Một dây chuyền sản xuất tự động cần đảm bảo ”robot không bao giờ hoạt động khi cửa an toàn đang mở”. Đề xuất mô hình và thuộc tính an toàn (safety-critical).","answer":"Safety-critical: AG(¬(robot_active ∧ door_open)) – đây là thuộc tính an toàn TÍNH MẠNG, cần verify nghiêm ngặt (formal, không chỉ testing)."},{"num":11,"question":"Một hệ thống bỏ phiếu điện tử cần chứng minh ”một người chỉ bỏ phiếu được đúng một lần”. Mô hình hóa bằng Kripke Structure và xác định AP cần thiết.","answer":"AP: đã bỏ phiếu (đã_vote); kiểm tra AG(so_lan_vote ≤ 1) cho mỗi cử tri qua toàn bộ transitions hệ thống."},{"num":12,"question":"Một công ty logistics phát hiện lỗi cho phép đơn hàng chuyển trạng thái ”delivered” mà chưa từng ”shipped”. Mô hình hóa và tìm counterexample.","answer":"Mô hình order status; unsafe = ”delivered ∧¬shipped_before”; cần theo dõi THỨ TỰ trạng thái đã qua (có thể cần mở rộng AP lưu lịch sử)."},{"num":13,"question":"Một hệ thống điều khiển lò phản ứng (giả định, mô phỏng) cần đảm bảo ”nhiệt độ không bao giờ vượt ngưỡng khi van làm mát đóng”. Đề xuất mô hình hóa an toàn.","answer":"An toàn tới hạn (safety-critical): AG(¬(nhiet_do_cao ∧ van_dong)) – cần formal verification nghiêm ngặt tương tự ngành hạt nhân thực tế. 29"},{"num":14,"question":"Một ứng dụng chia sẻ file cần đảm bảo ”file đã xóa không bao giờ truy cập lại được” (liên hệ Use-After-Free ở Ch.2). Mô hình hóa bằng Kripke Structure.","answer":"Liên hệ UAF (Ch.2): trạng thái ”deleted” không nên có transition quay lại ”accessible”; AG(deleted ⇒ AG(¬accessible)) (thuộc tính lồng nhau, cần LTL/CTL* mở rộng)."},{"num":15,"question":"Một hệ thống quản lý phiên đăng nhập (session) cần đảm bảo ”phiên hết hạn không bao giờ được dùng lại”. Đề xuất mô hình hóa và kiểm tra.","answer":"AP: session_expired, session_used; kiểm tra AG(¬(session_expired∧session_used))."}]}}],"id":"ch1"},{"title":"Chương 2: Lập trình C an toàn – Quản lý bộ nhớ","sections":[{"id":"2.1","title":"Đánh giá rủi ro (Risk Assessment)","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Vì sao C có rủi ro bộ nhớ cao hơn Python/Java?","options":{"A":"C chậm hơn","B":"Không có garbage collector, không tự động kiểm tra biên mảng","C":"C không hỗ trợ con trỏ","D":"C không thể biên dịch được"},"correct":"B","explanation":"Không GC, không tự động kiểm tra biên mảng."},{"num":2,"question":"Undefined Behavior (UB) trong C nghĩa là gì?","options":{"A":"Compiler được phép làm BẤT KỲ điều gì","B":"Chương trình luôn crash","C":"Compiler báo lỗi ngay lập tức","D":"Không liên quan gì tới an toàn phần mềm"},"correct":"A","explanation":"UB: compiler được phép làm bất kỳ điều gì."},{"num":3,"question":"Theo số liệu thực tế (Microsoft, Google), tỷ lệ lỗ hổng nghiêm trọng trong C/C++ do memory safety khoảng:","options":{"A":"10%","B":"30%","C":"65–70%","D":"100%"},"correct":"C","explanation":"Khoảng 65-70% lỗ hổng nghiêm trọng C/C++ là memory safety."},{"num":4,"question":"Rủi ro của Stack Buffer Overflow từ input mạng thường ở mức nào?","options":{"A":"Thấp","B":"Trung bình","C":"Nghiêm trọng","D":"Không có rủi ro"},"correct":"C","explanation":"Stack overflow từ input mạng: risk nghiêm trọng."},{"num":5,"question":"Attack surface của chương trình C KHÔNG bao gồm:","options":{"A":"argv/argc","B":"Biến môi trường","C":"stdin/mạng","D":"Comment trong mã nguồn"},"correct":"D","explanation":"Comment trong mã nguồn KHÔNG phải attack surface."},{"num":6,"question":"Thứ tự mức độ nghiêm trọng tăng dần của hậu quả lỗi bộ nhớ là:","options":{"A":"RCE → Info leak → Crash","B":"Crash → Info leak → RCE","C":"Info leak → Crash → RCE","D":"Không có thứ tự nhất định"},"correct":"B","explanation":"Crash → Info leak → RCE (tăng dần)."},{"num":7,"question":"Risk của một lỗi bộ nhớ trong thư viện dùng chung so với script chạy một lần:","options":{"A":"Thấp hơn","B":"Cao hơn (ảnh hưởng nhiều nơi sử dụng)","C":"Bằng nhau","D":"Không thể so sánh"},"correct":"B","explanation":"Risk cao hơn vì ảnh hưởng nhiều nơi sử dụng."},{"num":8,"question":"Memory leak (không phải UAF) thường có Impact ở mức nào theo bài giảng?","options":{"A":"Cao (RCE ngay lập tức)","B":"Trung bình (DoS dài hạn)","C":"Không có impact","D":"Luôn nghiêm trọng nhất"},"correct":"B","explanation":"Memory leak: Impact trung bình (DoS dài hạn)."},{"num":9,"question":"Vì sao cần LUÔN kiểm tra giá trị trả về của malloc?","options":{"A":"Để tăng tốc độ chương trình","B":"Vì malloc có thể thất bại và trả về NULL","C":"Vì đó là yêu cầu bắt buộc của trình biên dịch","D":"Không cần thiết trong C hiện đại"},"correct":"B","explanation":"malloc có thể thất bại, trả về NULL."}],"ly_thuyet":[{"num":1,"question":"Trình bày các lý do khiến C có rủi ro bộ nhớ cao hơn các ngôn ngữ có garbage collector.","answer":"C thiếu GC (phải tự malloc/free) và không tự động kiểm tra biên mảng như Python/Java – lỗi index/con trỏ dễ xảy ra và không được ngôn ngữ ngăn chặn."},{"num":2,"question":"Giải thích khái niệm Undefined Behavior trong C và tại sao nó nguy hiểm về mặt bảo mật.","answer":"UB nghĩa là hành vi không được đặc tả, compiler được phép tối ưu hóa với giả định UB không xảy ra – có thể dẫn tới hành vi không dự đoán được, kể cả bị kẻ tấn công lợi dụng."},{"num":3,"question":"Bàn luận về số liệu thực tế cho thấy phần lớn lỗ hổng nghiêm trọng trong C/C++ là lỗi bộ nhớ – điều này có ý nghĩa gì cho việc phân bổ nguồn lực QA?","answer":"Ý nghĩa: nên ưu tiên phần lớn thời gian/công cụ QA cho việc phát hiện lỗi bộ nhớ (Cppcheck, ASan, CBMC) thay vì dàn trải đều cho mọi loại lỗi."},{"num":4,"question":"Trình bày cách áp dụng khung Risk = f(Threat, Vulnerability, Impact) cụ thể cho lỗi bộ nhớ trong C.","answer":"Threat: kẻ tấn công kiểm soát input; Vulnerability: lỗi cụ thể (VD buffer overflow); Impact: mức độ thiệt hại (crash/leak/RCE) – Risk là hàm kết hợp cả ba."},{"num":5,"question":"Giải thích tại sao Stack Buffer Overflow từ input mạng có risk cao hơn nhiều so với lỗi tương tự trong tool CLI nội bộ.","answer":"Vì input mạng có thể bị kẻ tấn công BẤT KỲ ĐÂU kiểm soát tùy ý và tự động hóa quy mô lớn, trong khi tool CLI chỉ chạy bởi người vận hành tin cậy cụ thể."},{"num":6,"question":"Mô tả attack surface điển hình của một chương trình C và liên hệ với khái niệm đã học ở Chương 1.","answer":"Attack surface: mọi điểm nhận input (argv, env, stdin/mạng, file); liên hệ Attack Surface tổng quát đã học Ch.1.1, áp dụng cụ thể cho ngữ cảnh C."},{"num":7,"question":"Trình bày phổ mức độ nghiêm trọng của hậu quả lỗi bộ nhớ: Crash, Info leak, RCE.","answer":"Crash (DoS, ít nghiêm trọng) → Info leak (rò rỉ dữ liệu) → RCE (kiểm soát hoàn toàn, nghiêm trọng nhất)."},{"num":8,"question":"Giải thích vì sao lỗi bộ nhớ trong một thư viện dùng chung có risk cao hơn lỗi tương tự trong ứng dụng độc lập.","answer":"Vì lỗi trong thư viện dùng chung ảnh hưởng MỌI dự án phụ thuộc vào nó, trong khi lỗi ứng dụng độc lập chỉ ảnh hưởng chính ứng dụng đó."},{"num":9,"question":"Bàn luận về case study CVE-2021-3156 (Sudo) – bài học gì rút ra cho việc đánh giá rủi ro phần mềm hệ thống nền tảng?","answer":"Bài học: lỗi đơn giản (thiếu escape ký tự) trong công cụ hệ thống PHỔ BIẾN có thể tồn tại nhiều năm và gây rủi ro cực cao (root escalation) do phạm vi triển khai rộng."},{"num":10,"question":"Trình bày cách xây dựng một Risk Register cho một dự án C cụ thể.","answer":"Risk Register: bảng liệt kê từng module/thành phần với Likelihood, Impact, Risk tổng hợp, và biện pháp giảm thiểu – giúp phân bổ nguồn lực QA hợp lý."},{"num":11,"question":"Giải thích tại sao ”ai kiểm soát input, từ đâu” là câu hỏi cốt lõi khi đánh giá risk của một lỗ hổng.","answer":"Vì risk phụ thuộc vào AI có thể kiểm soát input và TỪ ĐÂU (Internet công khai risk cao hơn nhiều so với chỉ admin nội bộ)."},{"num":12,"question":"Mô tả vì sao C vẫn được lựa chọn rộng rãi cho OS/firmware dù có rủi ro bộ nhớ cao.","answer":"C cho hiệu năng cao và kiểm soát bộ nhớ chi tiết cần thiết cho OS/firmware/embedded – đổi lại chấp nhận rủi ro bộ nhớ cao hơn ngôn ngữ có GC."},{"num":13,"question":"Bàn luận: một lỗi memory leak có nên được coi là ”ít nghiêm trọng” hơn buffer overflow trong mọi trường hợp không?","answer":"Không nên coi thường tuyệt đối – memory leak dài hạn có thể dẫn tới DoS nghiêm trọng (hệ thống hết bộ nhớ, crash toàn bộ) dù không trực tiếp dẫn tới RCE."},{"num":14,"question":"Trình bày ma trận Risk Assessment (Likelihood x Impact) và cách áp dụng cho các loại lỗi bộ nhớ khác nhau.","answer":"Ma trận 3x3 (Likelihood x Impact) với các mức Thấp/TB/Cao, áp dụng: buffer overflow qua mạng (Cao,Cao)=Nghiêm trọng; memory leak nội bộ (Thấp,TB)=Thấp."},{"num":15,"question":"Giải thích tại sao cùng một lỗi kỹ thuật (VD: buffer overflow) có thể có risk RẤT KHÁC NHAU tùy theo threat model.","answer":"VD: buffer overflow trong parser xử lý file người dùng upload có risk RẤT CAO; cùng lỗi kỹ thuật trong tool debug nội bộ chỉ risk thấp."}],"thuc_hanh":[{"num":1,"question":"Viết một hàm Python compute_risk(likelihood, impact) trả về nhãn Risk (Thấp/Trung bình/Nghiêm trọng) dựa trên bảng đã học.","answer":"def compute_risk(l,i): score=l*i; return \"Nghiem trong\" if score>=6 else \"Trung binh\" if score>=3 else \"Thap\"."},{"num":2,"question":"Cho 3 tình huống lỗi bộ nhớ khác nhau, xếp hạng theo Risk Matrix (Likelihood x Impact) và giải thích.","answer":"VD: (Cao,Cao)=Nghiêm trọng RCE qua mạng; (TB,Cao)=Cao lỗi UAF logging; (Thấp,Thấp)=Thấ lỗi UI."},{"num":3,"question":"Viết một Risk Register (bảng) cho 4 module giả định của một ứng dụng C: network parser, config loader, logger, crypto module.","answer":"Bảng: network parser(Nghiêm trọng), config loader(TB), logger(Thấp), crypto(Nghiêm trọng)."},{"num":4,"question":"Cho một hàm C nhận input trực tiếp từ argv, liệt kê attack surface và đánh giá risk sơ bộ.","answer":"Attack surface: argv[1], argv[2]...; risk phụ thuộc: ai chạy chương trình này và với quyền gì."},{"num":5,"question":"Viết đoạn mô tả CVSS vector giả định (AV, AC, PR) cho một lỗi buffer overflow qua API công khai.","answer":"AV:N (qua API mạng), AC:L (dễ khai thác), PR:N (không cần đăng nhập) – điểm CVSS ước tính rất cao (8-10)."},{"num":6,"question":"Thiết kế một checklist (5 mục) đánh giá risk trước khi merge code C mới vào nhánh chính.","answer":"Checklist: (1) Đã chạy Cppcheck? (2) Đã check malloc NULL? (3) Input đã validate? (4) Test case biên đã có? (5) Risk level đã xác định?"},{"num":7,"question":"Cho một chương trình C xử lý file cấu hình cục bộ, đánh giá risk so với chương trình xử lý input mạng tương tự.","answer":"File cấu hình cục bộ: risk thấp hơn (chỉ admin sửa được); input mạng: risk cao hơn (bất kỳ ai cũng gửi được). 4"},{"num":8,"question":"Viết một hàm Python phân loại danh sách lỗ hổng theo mức Risk và sắp xếp giảm dần.","answer":"sorted(vulns, key=lambda v: v.risk_score, reverse=True)."},{"num":9,"question":"Cho tình huống CVE-2021-3156, viết một bảng phân tích Risk (Threat, Vulnerability, Impact) theo khung đã học.","answer":"Threat: kẻ tấn công local có shell access; Vulnerability: heap overflow trong xử lý escape; Impact: leo thang lên root – Risk: Nghiêm trọng dù cần điều kiện local trước."},{"num":10,"question":"Thiết kế 3 câu hỏi cần đặt ra khi đánh giá attack surface của một daemon C mới.","answer":"Câu hỏi: (1) Cổng nào đang mở? (2) Giao thức nào được hỗ trợ? (3) Ai/từ đâu có thể kết nối tới?"},{"num":11,"question":"Viết một đoạn mã C minh họa thiếu kiểm tra malloc, sau đó đánh giá risk của lỗi này. 5","answer":"int *p = malloc(sizeof(int)); *p = 5; – risk: Nghiêm trọng nếu p thường xuyên NULL do hệ thống thiếu RAM."},{"num":12,"question":"Cho một thư viện C được 1000+ dự án phụ thuộc, viết phân tích risk so với thư viện chỉ 1 dự án dùng.","answer":"Thư viện 1000+ dự án: risk RẤT CAO (một lỗi ảnh hưởng toàn bộ hệ sinh thái); thư viện 1 dự án: risk thấp hơn nhiều (phạm vi hẹp)."},{"num":13,"question":"Thiết kế bảng so sánh Risk giữa: (a) UAF trong module core, (b) memory leak trong module logging.","answer":"Bảng: UAF module core(Nghiêm trọng, ảnh hưởng trực tiếp chức năng chính); leak module logging(Trung bình, chỉ gây DoS dài hạn)."},{"num":14,"question":"Viết một đoạn Python đọc danh sách CVE (giả định JSON) và tính điểm risk trung bình theo CVSS.","answer":"avg_risk = sum(cve[\"cvss\"] for cve in cves) / len(cves)."},{"num":15,"question":"Cho một API HTTPS nhận JSON payload, liệt kê toàn bộ attack surface liên quan tới xử lý bộ nhớ C phía backend.","answer":"Attack surface: JSON payload fields, Content-Length header, Content-Type header, nested object depth."}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện thư viện C lõi của họ (dùng bởi 50 sản phẩm) có lỗ hổng UAF. Phân tích risk và đề xuất chiến lược vá lỗi trên diện rộng. 6","answer":"Risk cực cao do ảnh hưởng 50 sản phẩm; chiến lược: vá thư viện lõi TRƯỚC, sau đó rebuild/redeploy TOÀN BỘ 50 sản phẩm theo lịch ưu tiên (internet-facing trước)."},{"num":2,"question":"Một startup IoT dùng C cho firmware thiết bị không thể cập nhật OTA. Phân tích risk dài hạn của quyết định này.","answer":"Risk dài hạn rất cao: lỗ hổng phát hiện sau này KHÔNG THỂ vá được trên thiết bị đã bán – cần thiết kế lại có OTA update ngay từ đầu cho sản phẩm tương lai."},{"num":3,"question":"Một tổ chức phát hiện daemon C xử lý thanh toán (payment) có lỗi buffer overflow tiềm ẩn nhưng chưa xác nhận khai thác được. Đề xuất mức độ ưu tiên xử lý.","answer":"Ưu tiên cao dù chưa xác nhận khai thác được – module thanh toán luôn risk cao, nên audit/vá phòng ngừa ngay cả khi chưa có bằng chứng exploit cụ thể."},{"num":4,"question":"Một công ty game phát hiện lỗi memory leak trong server game online, gây crash sau 48h chạy liên tục. Phân tích risk và đề xuất giải pháp tạm thời.","answer":"Giải pháp tạm: restart định kỳ service (workaround), đồng thời điều tra bằng Valgrind để tìm root cause và vá triệt để."},{"num":5,"question":"Một dự án mã nguồn mở phổ biến (như OpenSSL) phát hiện lỗi tương tự Heartbleed. Phân tích vì sao risk lại cực kỳ cao dù lỗi ”chỉ” là thiếu kiểm tra độ dài.","answer":"Risk cực cao vì: (1) OpenSSL dùng RẤT RỘNG RÃI, (2) lỗi đơn giản (thiếu length check) nhưng hậu quả nghiêm trọng (rò rỉ khóa riêng) – minh chứng ”lỗi nhỏ, impact khổng lồ”."},{"num":6,"question":"Một công ty ô tô phát hiện module điều khiển (viết bằng C) có lỗi bộ nhớ tiềm ẩn nhưng chỉ kích hoạt trong điều kiện cực hiếm. Phân tích risk theo an toàn tính mạng.","answer":"Risk theo an toàn tính mạng luôn ở mức CAO NHẤT dù likelihood thấp (điều kiện hiếm) – ngành ô tô cần formal verification bất kể tần suất xảy ra thực tế."},{"num":7,"question":"Một tổ chức tài chính dùng thư viện C cũ (không còn bảo trì) cho module tính toán lãi suất. Đề xuất đánh giá risk và hướng xử lý.","answer":"Đề xuất: đánh giá risk cao do thư viện không còn ai vá (nếu có lỗ hổng mới sẽ tồn tại vĩnh viễn); nên thay thế bằng thư viện đang bảo trì hoặc audit/fork tự vá."},{"num":8,"question":"Một công ty phát hiện lỗ hổng UAF trong module xử lý log, KHÔNG ảnh hưởng tới dữ liệu khách hàng trực tiếp. Phân tích risk thực tế so với lỗi trong module thanh toán.","answer":"Risk thực tế THẤP HƠN module thanh toán nhiều (dù cùng loại lỗi UAF) vì không trực tiếp ảnh hưởng dữ liệu/tiền của khách hàng – vẫn cần vá nhưng có thể ưu tiên thấp hơn."},{"num":9,"question":"Một hacker mũ trắng báo cáo lỗ hổng buffer overflow trong API công khai của một ngân hàng. Đề xuất quy trình đánh giá risk và phản hồi.","answer":"Quy trình: xác nhận lỗ hổng (không tự khai thác thêm), đánh giá CVSS+impact thực tế, thông báo nội bộ khẩn, phát triển vá, test kỹ, deploy, cảm ơn/thưởng người báo cáo."},{"num":10,"question":"Một tổ chức phát hiện toàn bộ hệ thống dùng chung một phiên bản thư viện C có CVE nghiêm trọng (tương tự Baron Samedit). Đề xuất chiến lược vá lỗi quy mô lớn.","answer":"Chiến lược: kiểm kê TOÀN BỘ hệ thống dùng phiên bản lỗi (inventory), ưu tiên vá hệ thống internet-facing trước, dùng automation để vá hàng loạt, theo dõi tiến độ."},{"num":11,"question":"Một công ty phát triển thiết bị y tế dùng C cho phần mềm điều khiển. Phân tích risk và đề xuất mức độ kiểm chứng cần thiết (liên hệ Ch.1.4).","answer":"Risk cực cao (an toàn tính mạng trực tiếp); đề xuất mức kiểm chứng: Formal Verification bắt buộc (liên hệ Common Criteria/DO-178C tương đương ngành y tế: FDA class III)."},{"num":12,"question":"Một dự án drone giao hàng phát hiện lỗi bộ nhớ trong module xử lý tín hiệu GPS. Phân tích risk khi drone hoạt động trong khu vực đông dân cư.","answer":"Risk cực cao khi hoạt động khu đông dân cư (tăng Impact); đề xuất: formal verification cho module GPS + redundancy (dự phòng) + fail-safe (hạ cánh khẩn cấp khi lỗi)."},{"num":13,"question":"Một công ty phát hiện tool nội bộ (chỉ admin dùng) có lỗi buffer overflow nghiêm trọng về mặt kỹ thuật. Phân tích vì sao risk thực tế có thể thấp hơn CVSS score.","answer":"Risk THỰC TẾ thấp hơn CVSS thuần túy vì: chỉ admin tin cậy chạy tool, không expose ra ngoài – CVSS không tính tới ngữ cảnh triển khai cụ thể."},{"num":14,"question":"Một tổ chức chính phủ phát hiện hệ thống bỏ phiếu điện tử (viết bằng C) có lỗ hổng bộ nhớ. Phân tích risk đặc thù của hệ thống này.","answer":"Risk đặc thù: cần đảm bảo Integrity TUYỆT ĐỐI (không thể sửa phiếu bầu) + Confidentiality (ẩn danh) – lỗi bộ nhớ có thể vi phạm CẢ HAI đồng thời, risk cực cao."},{"num":15,"question":"Một công ty cloud phát hiện hypervisor (viết bằng C/C++) có lỗi UAF cho phép thoát khỏi VM (VM escape). Phân tích risk cực cao của loại lỗi này.","answer":"Risk cực cao (CVSS thường 9.0+) vì VM escape phá vỡ toàn bộ mô hình cô lập (isolation) của cloud, ảnh hưởng MỌI khách hàng dùng chung hypervisor. 6\n\n```\nMỤC 2.2 – CẤU TRÚC DỮ LIỆU ĐỘNG (DYNAMIC DATA\n```\n\nSTRUCTURES) – An toàn phần mềm"}]}},{"id":"2.2","title":"Cấu trúc dữ liệu động (Dynamic Data Structures)","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Stack và Heap khác nhau chủ yếu ở điểm nào?","options":{"A":"Stack cấp phát tự động, Heap cấp phát thủ công","B":"Stack chậm hơn Heap","C":"Heap luôn nhỏ hơn Stack","D":"Không có khác biệt thực sự"},"correct":"A","explanation":"Stack tự động, Heap thủ công."},{"num":2,"question":"Kích thước Stack thường có đặc điểm gì?","options":{"A":"Không giới hạn","B":"Giới hạn (thường vài MB)","C":"Luôn lớn hơn Heap","D":"Bằng đúng kích thước RAM"},"correct":"B","explanation":"Stack giới hạn (vài MB). 7\n\n```\nMỤC 2.2 – CẤU TRÚC DỮ LIỆU ĐỘNG (DYNAMIC DATA\n```\n\nSTRUCTURES) – An toàn phần mềm"},{"num":3,"question":"Lỗi điển hình của Heap là gì?","options":{"A":"Chỉ có stack overflow","B":"UAF, double- free, memory leak","C":"Không có lỗi nào","D":"Chỉ liên quan tới tốc độ"},"correct":"B","explanation":"Heap: UAF, double-free, memory leak."},{"num":4,"question":"Sau khi gọi malloc, điều đầu tiên cần làm là gì?","options":{"A":"Dùng ngay con trỏ trả về","B":"Kiểm tra con trỏ có NULL không","C":"Gọi free() ngay lập tức","D":"In giá trị con trỏ ra màn hình"},"correct":"B","explanation":"Kiểm tra NULL sau malloc."},{"num":5,"question":"realloc(p, new_size) nếu thất bại sẽ:","options":{"A":"Trả về NULL, vùng nhớ CŨ vẫn còn nguyên","B":"Tự động giải phóng vùng nhớ cũ","C":"Luôn thành công","D":"Làm crash chương trình ngay lập tức"},"correct":"A","explanation":"realloc thất bại: trả NULL, vùng cũ còn nguyên."},{"num":6,"question":"Lỗi kinh điển với realloc là gì?","options":{"A":"Gán trực tiếp p = realloc(p, size) làm mất con trỏ cũ nếu thất bại","B":"Không thể dùng realloc trong","C":"C. realloc luôn nhanh hơn malloc","D":"realloc không tồn tại trong chuẩn C"},"correct":"A","explanation":"Gán trực tiếp p=realloc(p,size) mất con trỏ cũ nếu fail."},{"num":7,"question":"Use-After-Free (UAF) xảy ra khi nào?","options":{"A":"Trước khi gọi malloc","B":"Truy cập vùng nhớ SAU KHI đã free","C":"Khi chương trình khởi động","D":"Chỉ xảy ra với biến toàn cục"},"correct":"B","explanation":"UAF: truy cập sau khi free."},{"num":8,"question":"Trong hàm free_list, lỗi UAF điển hình là gì?","options":{"A":"free(current); current = current->next;","B":"next = current->next; free(current); current = next;","C":"Không free node nào cả","D":"Free hai lần liên tiếp cùng node"},"correct":"A","explanation":"free(current); current=current->next; là UAF."},{"num":9,"question":"Memory Leak xảy ra khi nào?","options":{"A":"Khi free() được gọi đúng cách","B":"Khi mất con trỏ tới vùng nhớ đã cấp phát mà chưa free","C":"Khi chương trình chạy quá nhanh","D":"Chỉ xảy ra trên Windows"},"correct":"B","explanation":"Mất con trỏ tới vùng đã cấp phát chưa free."}],"ly_thuyet":[{"num":1,"question":"Trình bày sự khác biệt giữa Stack và Heap về cách cấp phát, giải phóng, và lỗi điển hình.","answer":"Stack: cấp phát/giải phóng tự động theo scope hàm, nhanh, giới hạn kích thước, lỗi: stack overflow; Heap: thủ công malloc/free, linh hoạt, lỗi: UAF/leak/double- free."},{"num":2,"question":"Giải thích vì sao luôn cần kiểm tra kết quả trả về của malloc trước khi sử dụng.","answer":"Vì malloc có thể THẤT BẠI (hết bộ nhớ) và trả về NULL – dùng con trỏ NULL mà không kiểm tra sẽ gây crash (NULL deref)."},{"num":3,"question":"Mô tả cấu trúc Linked List cơ bản trong C và giải thích cách cấp phát/giải phóng đúng cách.","answer":"Node struct gồm data + con trỏ next; cấp phát bằng malloc kiểm tra NULL; giải phóng bằng free_list lưu next TRƯỚC khi free current để tránh UAF. 8\n\n```\nMỤC 2.2 – CẤU TRÚC DỮ LIỆU ĐỘNG (DYNAMIC DATA\n```\n\nSTRUCTURES) – An toàn phần mềm"},{"num":4,"question":"Giải thích lỗi UAF điển hình khi giải phóng Linked List và cách viết đúng free_list.","answer":"Lỗi: free(current); current=current->next; là UAF vì truy cập current->next SAU KHI free; đúng: lưu next = current->next TRƯỚC, rồi free(current), rồi current=next."},{"num":5,"question":"Trình bày định nghĩa Memory Leak và cho ví dụ code minh họa lỗi này.","answer":"Memory Leak: vùng nhớ cấp phát nhưng mất tham chiếu (không thể free được nữa). VD: p=malloc(100); p=malloc(200); mất con trỏ tới vùng 100 đầu."},{"num":6,"question":"Phân biệt Dangling Pointer và Wild Pointer, cho ví dụ mỗi loại.","answer":"Dangling Pointer: con trỏ TỪNG hợp lệ nhưng vùng nhớ đã bị free; Wild Pointer: con trỏ CHƯA TỪNG khởi tạo, trỏ tới địa chỉ ngẫu nhiên."},{"num":7,"question":"Giải thích tại sao gán NULL sau free là thực hành tốt để phòng tránh UAF.","answer":"Vì nếu p vẫn giữ địa chỉ cũ sau free, code sau có thể VÔ TÌNH dùng lại p (UAF); gán NULL khiến mọi truy cập sau đó crash NGAY (dễ debug) thay vì hành vi không xác định."},{"num":8,"question":"Mô tả cơ chế Double Free và hậu quả tiềm ẩn của nó (liên hệ tới khả năng RCE).","answer":"Double Free có thể làm HỎNG cấu trúc quản lý heap nội bộ (metadata) của allocator, kẻ tấn công có thể lợi dụng để kiểm soát bộ nhớ tùy ý, dẫn tới RCE."},{"num":9,"question":"Trình bày ”dòng thời gian” của lỗi UAF: từ malloc, free, tới việc allocator tái sử dụng vùng nhớ.","answer":"Dòng thời gian: malloc(p)→free(p) trả vùng nhớ về allocator→malloc(q) allocator TÁI SỬ DỤNG cùng vùng nhớ cho object khác→dùng lại p (dangling) thực chất đọc/ghi object mới."},{"num":10,"question":"Giải thích khái niệm ”type confusion” và tại sao nó khiến UAF trở thành lớp lỗi đặc biệt nguy hiểm.","answer":"Type confusion: chương trình TƯỞNG đang thao tác object A (qua con trỏ p cũ) nhưng thực chất vùng nhớ đó giờ là object B khác – gây đọc/ghi sai ngữ nghĩa, có thể khai thác."},{"num":11,"question":"Bàn luận: NULL Pointer Dereference có nguy hiểm bằng UAF/Double- free không? Vì sao?","answer":"NULL Pointer Dereference thường CHỈ gây crash (ít nguy hiểm hơn UAF/double- free vốn có thể dẫn RCE); tuy vậy vẫn là CWE-476 phổ biến cần tránh vì DoS vẫn có tác động."},{"num":12,"question":"Trình bày cách cài đặt Dynamic Array (Vector) trong C, tập trung vào việc xử lý realloc an toàn.","answer":"Cài đặt Vector: mảng động với size/capacity; khi đầy, gọi realloc với capacity mới (thường x2), dùng biến TẠM để kiểm tra realloc thành công trước khi cập nhật con trỏ chính."},{"num":13,"question":"Giải thích bẫy kinh điển khi dùng realloc và cách viết code an toàn để tránh bẫy này.","answer":"Bẫy: p=realloc(p,size); nếu thất bại trả NULL, gán trực tiếp làm MẤT con trỏ vùng cũ (leak) và p giờ là NULL (mất toàn bộ dữ liệu); đúng: dùng tmp=realloc(...); if(tmp) p=tmp;"},{"num":14,"question":"So sánh chiến lược tăng trưởng x2 và +N cố định cho Dynamic Array, phân tích độ phức tạp thời gian.","answer":"x2: số lần realloc là O(log n), tổng chi phí copy O(n) amortized; +N cố định: số lần realloc O(n/N ), tổng chi phí copy O(n2 /N ) – chậm hơn nhiều với n lớn."},{"num":15,"question":"Mô tả rủi ro bổ sung khi làm việc với Double-linked List so với Single- linked List.","answer":"Double-linked có CẢ prev và next, mỗi thao tác chèn/xóa cần cập nhật ĐÚNG cả\n\n```\nhướng – tăng gấp đôi khả năng sai sót logic con trỏ so với single-linked chỉ có\n```\n\nnext."}],"thuc_hanh":[{"num":1,"question":"Viết hàm C create_node(int value) cấp phát và khởi tạo một node linked list, có kiểm tra NULL.","answer":"Node* create_node(int v){Node *n=malloc(sizeof(Node)); if(!n)return NULL; n->data=v; n->next=NULL; return n;}"},{"num":2,"question":"Viết hàm free_list(Node *head) giải phóng đúng cách toàn bộ danh sách, tránh UAF.","answer":"void free_list(Node *h){while(h){Node *nx=h->next; free(h); h=nx;}}"},{"num":3,"question":"Cho đoạn code có lỗi free(current); current = current->next;, sửa lại cho đúng.","answer":"Sửa: Node *nx = current->next; free(current); current = nx;"},{"num":4,"question":"Viết hàm C minh họa memory leak (mất con trỏ khi gán lại mà chưa free) và bản đã sửa.","answer":"Leak: p=malloc(100); p=malloc(200); mất con trỏ đầu; sửa: free(p); p=malloc(200); free trước khi gán lại. 10\n\n```\nMỤC 2.2 – CẤU TRÚC DỮ LIỆU ĐỘNG (DYNAMIC DATA\n```\n\nSTRUCTURES) – An toàn phần mềm"},{"num":5,"question":"Viết đoạn code minh họa dangling pointer và cách sửa bằng cách gán NULL sau free.","answer":"int *p=malloc(4); free(p); p=NULL; – sau đó mọi truy cập p sẽ crash rõ ràng thay vì UB."},{"num":6,"question":"Viết đoạn code minh họa double free và giải thích 2 hậu quả có thể xảy ra.","answer":"free(p); free(p); – hậu quả: (1) crash ngay do heap corruption check, (2) hoặc bị khai thác để ghi tùy ý vào heap metadata."},{"num":7,"question":"Cài đặt Vector (dynamic array) trong C với hàm vector_push xử lý realloc an toàn.","answer":"void vector_push(Vector*v,int x){if(v->size==v->cap){...realloc x2...} v->data[v->size++ (đã có sẵn trong slide)."},{"num":8,"question":"Sửa lỗi p = realloc(p, new_size); thành phiên bản an toàn dùng biến tạm.","answer":"int *tmp=realloc(p,ns); if(tmp) p=tmp; else /*giu p cu, xu ly loi*/."},{"num":9,"question":"Viết hàm find_and_remove(Node **head, int value) loại bỏ node an toàn khỏi linked list.","answer":"Node* find_and_remove(Node**h,int v){...} (cài đặt như trong slide 2.2, dùng prev để cập nhật liên kết)."},{"num":10,"question":"Chạy chương trình linked list qua Valgrind (--leak-check=full) và diễn giải output mẫu.","answer":"Output mẫu: ”definitely lost: 40 bytes in 1 blocks” kèm stack trace dòng malloc gây leak."},{"num":11,"question":"Cài đặt Hash Table đơn giản với separate chaining (mảng bucket + linked list).","answer":"Entry *table[SIZE]; void insert(char*k,int v){int idx=hash(k)%SIZE; Entry*e=malloc(...); e->next=table[idx]; table[idx]=e;}"},{"num":12,"question":"Viết hàm giải phóng toàn bộ Hash Table (bao gồm mọi bucket và node bên trong). 11\n\n```\nMỤC 2.2 – CẤU TRÚC DỮ LIỆU ĐỘNG (DYNAMIC DATA\n```\n\nSTRUCTURES) – An toàn phần mềm","answer":"for(i=0;i<SIZE;i++){Entry*e=table[i]; while(e){Entry*nx=e->next; free(e); e=nx;}}"},{"num":13,"question":"Cài đặt Double-linked List với các hàm insert/delete cập nhật ĐÚNG cả prev và next.","answer":"Insert: cập nhật newNode->prev, newNode->next, prevNode->next, nextNode- >prev – đủ 4 liên kết theo đúng thứ tự."},{"num":14,"question":"Viết đoạn code duyệt Circular Linked List với điều kiện dừng ĐÚNG (so sánh với head).","answer":"Node*cur=head; do{process(cur); cur=cur->next;}while(cur!=head);"},{"num":15,"question":"Cho một Circular Linked List với điều kiện dừng SAI, sửa lại và giải thích tại sao lỗi cũ gây lặp vô hạn.","answer":"Lỗi cũ dùng cur!=NULL (không bao giờ NULL trong circular list) – sửa thành cur!=head để dừng đúng sau 1 vòng."}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện server C của họ tăng dần bộ nhớ sử dụng suốt nhiều ngày (memory leak). Đề xuất quy trình chẩn đoán bằng Valgrind.","answer":"Quy trình: chạy Valgrind với --leak-check=full trên workload thực tế trong thời gian dài, phân tích stack trace các leak để xác định module gây leak."},{"num":2,"question":"Một ứng dụng crash ngẫu nhiên sau khi chạy vài giờ, nghi ngờ UAF. Đề xuất quy trình debug từng bước. 12\n\n```\nMỤC 2.2 – CẤU TRÚC DỮ LIỆU ĐỘNG (DYNAMIC DATA\n```\n\nSTRUCTURES) – An toàn phần mềm","answer":"Debug UAF: dùng ASan để bắt lỗi ngay khi xảy ra (thay vì đợi crash ngẫu nhiên), kết hợp core dump + gdb để xem stack trace chi tiết."},{"num":3,"question":"Một hệ thống game server dùng linked list quản lý người chơi online, gặp crash khi người chơi disconnect đột ngột giữa lúc xử lý. Phân tích khả năng UAF.","answer":"Khả năng UAF cao: nếu disconnect xử lý xóa dữ liệu người chơi TRONG KHI một luồng khác vẫn đang truy cập – cần đồng bộ hóa (mutex) hoặc dùng reference counting."},{"num":4,"question":"Một thư viện C phổ biến bị phát hiện double-free trong một trường hợp edge case hiếm. Phân tích mức độ nghiêm trọng và đề xuất vá.","answer":"Nghiêm trọng: edge case hiếm vẫn có thể bị khai thác có chủ đích bởi kẻ tấn công biết cách kích hoạt – cần vá ngay dù tần suất tự nhiên thấp."},{"num":5,"question":"Một công ty phát hiện Hash Table nội bộ của họ chậm dần theo thời gian dùng, nghi ngờ memory leak khi resize. Đề xuất kiểm tra.","answer":"Đề xuất: dùng Valgrind định kỳ + theo dõi memory usage theo thời gian (monitoring) để phát hiện xu hướng tăng bất thường khi resize."},{"num":6,"question":"Một hệ thống nhúng (embedded, RAM giới hạn 64KB) gặp lỗi hết bộ nhớ sau vài giờ chạy. Phân tích khả năng memory leak và đề xuất công cụ phù hợp (Valgrind có khả dụng trên embedded không?).","answer":"Valgrind có overhead RAM lớn, khó dùng trực tiếp trên embedded 64KB; đề xuất: dùng static analysis (Cppcheck) kỹ hơn, hoặc test trên simulator/emulator có nhiều RAM hơn trước khi deploy."},{"num":7,"question":"Một ứng dụng đa luồng (multi-thread) dùng chung một linked list không có khóa (lock), gặp crash ngẫu nhiên. Phân tích nguyên nhân có thể (race condition + UAF).","answer":"Race condition kết hợp UAF: một luồng free node trong khi luồng khác đang đọc – cần mutex/lock bảo vệ truy cập chung, hoặc dùng lock-free data structure chuyên dụng."},{"num":8,"question":"Một dự án mã nguồn mở nhận báo cáo lỗi ”segfault khi xóa item khỏi danh sách”. Đề xuất các bước để tái tạo và debug lỗi.","answer":"Bước debug: (1) thu thập core dump, (2) chạy dưới Valgrind/ASan để tái tạo, (3) dùng gdb xem stack trace, (4) xác định dòng code gây UAF/double-free."},{"num":9,"question":"Một công ty phát hiện dynamic array của họ tốn quá nhiều bộ nhớ do chiến lược tăng trưởng không tối ưu. Đề xuất cải thiện.","answer":"Đề xuất cải thiện: chuyển sang chiến lược x2 thay vì +N cố định, hoặc cache- friendly resize dựa trên pattern sử dụng thực tế."},{"num":10,"question":"Một hệ thống ngân hàng phát hiện double-free trong module xử lý giao dịch dưới tải cao (concurrent). Phân tích mức độ khẩn cấp.","answer":"Mức độ khẩn cấp CAO NHẤT: double-free dưới tải cao trong module giao dịch tài chính có thể bị khai thác để thao túng số dư – cần vá và deploy khẩn cấp."},{"num":11,"question":"Một ứng dụng IoT với circular buffer bị lặp vô hạn trong điều kiện hiếm gặp. Phân tích nguyên nhân và đề xuất sửa.","answer":"Nguyên nhân: buffer wraparound logic sai (không xử lý đúng khi index quay vòng); sửa: kiểm tra kỹ điều kiện modulo/wraparound trong code."},{"num":12,"question":"Một công ty phát hiện memory leak trong code C đã chạy production\n\n```\nnăm không ai phát hiện. Phân tích vì sao lỗi này ”sống sót” lâu như vậy.\n```","answer":"Lý do ”sống sót”: leak nhỏ, không gây crash rõ ràng trong thời gian ngắn, chỉ tích lũy chậm – cần restart định kỳ (workaround) che giấu vấn đề thực sự."},{"num":13,"question":"Một ứng dụng xử lý ảnh dùng cấu trúc dữ liệu động cho pixel data, gặp UAF khi resize ảnh giữa chừng. Phân tích và đề xuất sửa.","answer":"Phân tích: UAF khi resize giữa chừng thường do giữ con trỏ tới buffer CŨ sau khi realloc trả về địa chỉ MỚI; sửa: cập nhật MỌI con trỏ liên quan ngay sau realloc."},{"num":14,"question":"Một dự án blockchain node viết bằng C++ gặp lỗi UAF trong cấu trúc dữ liệu quản lý transaction pool. Phân tích mức độ nghiêm trọng.","answer":"Nghiêm trọng cao: transaction pool là cấu trúc dữ liệu TỚI HẠN của blockchain node, UAF có thể dẫn tới double-spending hoặc DoS toàn mạng."},{"num":15,"question":"Một công ty phát hiện thư viện Hash Table bên thứ ba họ dùng có lỗi memory leak đã biết nhưng chưa vá. Đề xuất giải pháp tạm thời.","answer":"Giải pháp tạm: wrapper/patch riêng để fix leak trong khi chờ thư viện chính thức vá, hoặc chuyển sang thư viện thay thế nếu có. 12\n\n```\nMỤC 2.3 – LẬP TRÌNH C AN TOÀN (SECURE C CODING)\n```"}]}},{"id":"2.3","title":"Lập trình C an toàn (Secure C Coding)","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Hàm nào sau đây đã bị loại khỏi chuẩn C11 vì quá nguy hiểm?","options":{"A":"strcpy","B":"gets","C":"printf","D":"malloc"},"correct":"B","explanation":"gets() bị loại khỏi C11."},{"num":2,"question":"Điểm chung của strcpy, sprintf, strcat là gì? A. Đều tự động kiểm tra kích thước buffer. B. Đều KHÔNG kiểm tra kích thước buffer đích. C. Đều đã bị loại bỏ khỏi C. D. Đều chỉ dùng được với số nguyên.","options":{},"correct":"B","explanation":"Đều không kiểm tra kích thước buffer đích."},{"num":3,"question":"Hàm nào thay thế an toàn cho gets()?","options":{"A":"scanf()","B":"fgets()","C":"strcpy()","D":"sprintf()"},"correct":"B","explanation":"fgets() thay thế an toàn cho gets()."},{"num":4,"question":"Khi dùng strncpy, cần lưu ý điều gì?","options":{"A":"Không cần lưu ý gì đặc biệt","B":"Có thể KHÔNG tự thêm null-terminator nếu input vừa khít buffer","C":"strncpy luôn an toàn tuyệt đối","D":"strncpy nhanh hơn memcpy trong mọi trường hợp"},"correct":"B","explanation":"strncpy có thể không tự thêm null-terminator."},{"num":5,"question":"Trong stack layout, Return Address thường nằm ở đâu so với buffer local?","options":{"A":"Trước buffer (địa chỉ thấp hơn)","B":"Sau buffer, có thể bị ghi đè khi tràn","C":"Không liên quan gì tới buffer","D":"Luôn nằm trong heap"},"correct":"B","explanation":"Return Address nằm sau buffer, có thể bị ghi đè. 13\n\n```\nMỤC 2.3 – LẬP TRÌNH C AN TOÀN (SECURE C CODING)\n```"},{"num":6,"question":"Stack Buffer Overflow nguy hiểm nhất khi nào?","options":{"A":"Khi ghi đè được Return Address để kiểm soát luồng thực thi","B":"Khi chỉ ghi đè biến local khác không quan trọng","C":"Không bao giờ nguy hiểm","D":"Chỉ nguy hiểm trên Windows"},"correct":"A","explanation":"Nguy hiểm nhất khi ghi đè Return Address."},{"num":7,"question":"Integer Overflow trong malloc(count * size) có thể dẫn tới:","options":{"A":"Không có vấn đề gì","B":"Cấp phát buffer NHỎ HƠN dự kiến, gây heap overflow sau đó","C":"Luôn làm chương trình nhanh hơn","D":"Compiler tự động ngăn chặn hoàn toàn"},"correct":"B","explanation":"Integer Overflow gây cấp phát buffer nhỏ hơn dự kiến."},{"num":8,"question":"calloc(count, size) có ưu điểm gì so với malloc(count*size)?","options":{"A":"Không có ưu điểm gì","B":"calloc có kiểm tra overflow nội bộ khi nhân","C":"calloc luôn chậm hơn","D":"calloc không khởi tạo bộ nhớ"},"correct":"B","explanation":"calloc kiểm tra overflow nội bộ."},{"num":9,"question":"Format String Vulnerability xảy ra khi nào?","options":{"A":"Khi dùng printf(\"%s\", input)","B":"Khi dùng printf(input) trực tiếp với input người dùng","C":"Khi không dùng printf","D":"Chỉ xảy ra với scanf"},"correct":"B","explanation":"printf(input) trực tiếp là Format String Vuln."}],"ly_thuyet":[{"num":1,"question":"Liệt kê các hàm C nguy hiểm kinh điển và giải thích điểm chung khiến chúng nguy hiểm.","answer":"Hàm nguy hiểm: gets, strcpy, sprintf, strcat – điểm chung: KHÔNG nhận/kiểm tra kích thước buffer đích, ghi tràn nếu input dài hơn dự kiến."},{"num":2,"question":"Trình bày các hàm thay thế an toàn cho gets, strcpy, sprintf, strcat.","answer":"Thay thế: gets→fgets(buf,size,stdin); strcpy→strncpy hoặc snprintf; sprintf→snprintf; strcat→strncat với kích thước đúng."},{"num":3,"question":"Giải thích cơ chế Stack Buffer Overflow ở mức khái niệm, liên hệ với stack layout (buffer, saved FP, return address).","answer":"Stack layout: buffer local → saved frame pointer → return address; nếu input ghi tràn buffer, dữ liệu tiếp tục ghi đè FP rồi RA, kẻ tấn công có thể kiểm soát địa chỉ nhảy tới khi hàm return."},{"num":4,"question":"Mô tả cách Integer Overflow trong phép nhân cấp phát bộ nhớ dẫn tới Heap Overflow.","answer":"Integer Overflow: count*sizeof(int) có thể ”wrap around” thành số RẤT NHỎ nếu count lớn, malloc cấp phát buffer NHỎ nhưng code sau ghi theo count GỐC (lớn) – gây heap overflow. 14\n\n```\nMỤC 2.3 – LẬP TRÌNH C AN TOÀN (SECURE C CODING)\n```"},{"num":5,"question":"Giải thích tại sao calloc an toàn hơn malloc(count*size) tự viết.","answer":"calloc(count,size) có kiểm tra overflow NỘI BỘ khi nhân hai tham số, trong khi tự viết malloc(count*size) không có bảo vệ này, dễ bị integer overflow."},{"num":6,"question":"Trình bày Format String Vulnerability và giải thích cơ chế nguy hiểm của specifier %n.","answer":"Format String Vuln: printf(user_input) dùng input làm FORMAT thay vì DATA; %n đặc biệt nguy hiểm vì GHI số ký tự đã in vào địa chỉ chỉ định bởi tham số tương ứng trên stack, có thể dẫn tới RCE."},{"num":7,"question":"Mô tả Off-by-one Error và nguyên nhân phổ biến gây ra lỗi này.","answer":"Off-by-one: thường do nhầm <= với <, hoặc quên chỗ cho null-terminator khi tính kích thước buffer chuỗi – gây ghi/đọc vượt biên đúng 1 phần tử."},{"num":8,"question":"Giải thích chi tiết cơ chế hoạt động của Stack Canary, bao gồm vai trò của __stack_chk_fail().","answer":"Stack Canary: compiler chèn giá trị NGẪU NHIÊN trước return address lúc vào hàm, kiểm tra giá trị này KHÔNG ĐỔI trước khi return; nếu đổi (do overflow), gọi __stack_chk_fail() và abort."},{"num":9,"question":"Trình bày giới hạn của Stack Canary – những loại tấn công nào KHÔNG bị canary ngăn chặn.","answer":"Giới hạn Canary: chỉ bảo vệ chống ghi tràn TUẦN TỰ từ buffer lên return address; KHÔNG bảo vệ nếu kẻ tấn công ghi TRỰC TIẾP vào địa chỉ tùy ý qua lỗi con trỏ khác."},{"num":10,"question":"Giải thích ASLR và cách nó kết hợp với DEP/NX để tăng độ khó khai thác.","answer":"ASLR ngẫu nhiên hóa vị trí stack/heap/thư viện mỗi lần chạy, khiến kẻ tấn công không đoán trước địa chỉ; kết hợp DEP/NX (vùng dữ liệu không thực thi được) buộc kẻ tấn công dùng kỹ thuật phức tạp hơn (ROP)."},{"num":11,"question":"Mô tả FORTIFY_SOURCE và cách nó bảo vệ chương trình ở mức compiler.","answer":"FORTIFY_SOURCE: compiler thay thế các hàm nguy hiểm (strcpy, sprintf...) bằng phiên bản kiểm tra kích thước RUNTIME dựa trên thông tin biết được lúc biên dịch (VD sizeof buffer)."},{"num":12,"question":"Trình bày các cờ biên dịch GCC quan trọng cho secure coding (-Wall -Wextra -fstack-protector-strong etc).","answer":"Cờ quan trọng: -Wall -Wextra (cảnh báo tối đa), -fstack-protector-strong (canary), -D_FORTIFY_SOURCE=2 (hàm an toàn), -fsanitize=address,undefined (runtime check khi test)."},{"num":13,"question":"Giải thích AddressSanitizer (ASan) hoạt động như thế nào và khi nào nên/không nên dùng.","answer":"ASan chèn mã kiểm tra MỖI truy cập bộ nhớ lúc runtime để phát hiện overflow/UAF NGAY khi xảy ra; nên dùng khi TEST (overhead 2-3x chấp nhận được), KHÔNG dùng production (ảnh hưởng hiệu năng)."},{"num":14,"question":"Trình bày các quy tắc CERT C: STR31-C, ARR30-C, MEM31-C, EXP34-C, INT30-C.","answer":"CERT C: STR31-C (buffer chuỗi đủ lớn), ARR30-C (không vượt biên mảng), MEM31- C (không dùng lại vùng đã free), EXP34-C (không deref NULL), INT30-C (không tràn số nguyên unsigned ngoài ý muốn)."},{"num":15,"question":"Giải thích sự khác biệt giữa strncpy và strlcpy về đảm bảo null- termination.","answer":"strncpy: KHÔNG tự thêm null-terminator nếu input vừa khít buffer (cần code thủ công đảm bảo); strlcpy: LUÔN null-terminate và trả về độ dài THỰC của nguồn để phát hiện truncation."}],"thuc_hanh":[{"num":1,"question":"Sửa đoạn code dùng gets(buf) thành fgets(buf, sizeof(buf), stdin).","answer":"fgets(buf, sizeof(buf), stdin); thay cho gets(buf);."},{"num":2,"question":"Sửa đoạn code strcpy(dst, src) thành phiên bản dùng snprintf an toàn.","answer":"snprintf(dst, sizeof(dst), \"%s\", src); thay strcpy(dst,src);."},{"num":3,"question":"Viết hàm C nối 2 chuỗi an toàn bằng strncat với kiểm tra kích thước đúng.","answer":"strncat(dst, src, sizeof(dst)-strlen(dst)-1); đảm bảo không tràn."},{"num":4,"question":"Tìm và sửa lỗi trong: int *buf = malloc(count * sizeof(int)); khi count do người dùng nhập.","answer":"Sửa: kiểm tra if(count > SIZE_MAX/sizeof(int)) return NULL; trước malloc."},{"num":5,"question":"Viết hàm safe_alloc_array(count, elem_size) kiểm tra overflow trước khi cấp phát.","answer":"void* safe_alloc_array(size_t c, size_t s){if(s!=0 && c>SIZE_MAX/s)return NULL; return calloc(c,s);}"},{"num":6,"question":"Sửa lỗi printf(user_input) thành printf(\"%s\", user_input) và giải thích rủi ro đã loại bỏ.","answer":"Sửa: printf(\"%s\", user_input); loại bỏ rủi ro user_input được diễn giải làm format string (đặc biệt %n)."},{"num":7,"question":"Tìm lỗi off-by-one trong: for(i=0; i<=10; i++) buf[i]='A'; với buf[10].","answer":"Lỗi ở điều kiện i<=10 với buf[10] (index hợp lệ 0-9); sửa i<10."},{"num":8,"question":"Biên dịch một chương trình C với đầy đủ cờ bảo vệ (-Wall -Wextra -fstack-protector-strong -fsanitize=address,undefined) và ghi lại warning tìm được.","answer":"Warning tìm được thường gồm: unused variable, sign-compare, format mismatch, use-after-free (nếu có -fanalyzer)."},{"num":9,"question":"Viết đoạn code minh họa và kích hoạt Stack Canary (biên dịch với canary, cố ý overflow nhỏ để thấy __stack_chk_fail).","answer":"Minh họa: overflow buffer nhỏ ghi đè canary, chạy chương trình in ra ”*** stack smashing detected ***” và abort. 16\n\n```\nMỤC 2.3 – LẬP TRÌNH C AN TOÀN (SECURE C CODING)\n```"},{"num":10,"question":"Cho struct Person với trường name/age, viết hàm set_name tuân thủ ARR30-C/STR31-C.","answer":"void set_name(Person*p, const char*n){size_t l=strlen(n); if(l>=MAX_NAME)l=MAX_NAME-1; memcpy(p->name,n,l); p->name[l]=0;}"},{"num":11,"question":"Viết đoạn code C minh họa và sửa lỗi CWE-476 (NULL pointer dereference) sau khi free.","answer":"int *p=malloc(4); free(p); p=NULL; if(p)*p=1; – kiểm tra p trước khi dùng, không bao giờ dereference NULL."},{"num":12,"question":"Cho một hàm dùng strncpy không đảm bảo null-termination, sửa lại cho an toàn.","answer":"strncpy(buf,src,n-1); buf[n-1]=0; đảm bảo null-terminate thủ công."},{"num":13,"question":"Viết một macro hoặc hàm wrapper kiểm tra overflow trước khi thực hiện phép nhân hai số size_t.","answer":"int safe_mul(size_t a,size_t b,size_t*r){if(a!=0&&b>SIZE_MAX/a)return -1; *r=a*b; return 0;}"},{"num":14,"question":"Tìm tất cả lỗi bảo mật trong đoạn code sau và sửa: char msg[50]; sprintf(msg,\"Hi \"); strcat(msg,name); printf(msg); 17\n\n```\nMỤC 2.3 – LẬP TRÌNH C AN TOÀN (SECURE C CODING)\n```","answer":"Lỗi: sprintf không check size, strcat không check size, printf(msg) là format string vuln; sửa dùng snprintf+printf(”%s”,msg)."},{"num":15,"question":"Viết Makefile với target check chạy gcc -Wall -Wextra -Wpedantic -fanalyzer trên toàn bộ file .c.","answer":"check: gcc -Wall -Wextra -Wpedantic -fanalyzer -fsyntax-only *.c"}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện code C cũ (10 năm) dùng gets() trong module xử lý input người dùng. Phân tích rủi ro và đề xuất kế hoạch vá.","answer":"Rủi ro nghiêm trọng (gets đã bị loại khỏi C11 vì quá nguy hiểm); kế hoạch: thay ngay bằng fgets, ưu tiên module xử lý input trực tiếp từ người dùng/mạng."},{"num":2,"question":"Một tổ chức phát hiện một API công khai bị exploit qua Format String Vulnerability. Phân tích cách kẻ tấn công có thể đã khai thác và đề xuất vá khẩn cấp.","answer":"Kẻ tấn công có thể dùng %n để ghi tùy ý vào bộ nhớ, dẫn tới RCE; vá khẩn cấp: thay printf(input) bằng printf(”%s”,input) trên TOÀN BỘ codebase."},{"num":3,"question":"Một game server C bị crash hàng loạt do một client gửi input dài bất thường. Phân tích khả năng buffer overflow và đề xuất kiểm tra. 18\n\n```\nMỤC 2.3 – LẬP TRÌNH C AN TOÀN (SECURE C CODING)\n```","answer":"Khả năng cao là buffer overflow do thiếu kiểm tra độ dài input; đề xuất: audit toàn bộ hàm nhận input mạng, thêm giới hạn độ dài + validate trước xử lý."},{"num":4,"question":"Một ngân hàng phát hiện lỗi Integer Overflow trong module tính lãi suất dẫn tới cấp phát sai kích thước. Phân tích mức độ nghiêm trọng.","answer":"Nghiêm trọng cao (tài chính): số tiền tính sai do buffer cấp sai kích thước có thể dẫn tới thất thoát/lỗi giao dịch; cần vá và audit lại toàn bộ phép tính liên quan tới kích thước động."},{"num":5,"question":"Một công ty bảo mật phát hiện binary của đối thủ KHÔNG bật Stack Canary. Phân tích rủi ro và đề xuất họ nên làm gì.","answer":"Rủi ro cao: dễ bị khai thác buffer overflow thành RCE; đề xuất họ nên public disclosure có trách nhiệm hoặc tự khắc phục và benchmark lại."},{"num":6,"question":"Một hệ thống nhúng (embedded) không hỗ trợ ASLR do giới hạn phần cứng. Phân tích rủi ro tăng thêm và đề xuất biện pháp bù đắp.","answer":"Rủi ro tăng đáng kể (thiếu 1 lớp phòng thủ quan trọng); bù đắp: tăng cường code review, static analysis kỹ hơn, cân nhắc thêm software-based ASLR nếu khả thi."},{"num":7,"question":"Một tổ chức phát hiện off-by-one error trong module xử lý log đã tồn tại 3 năm, gây crash ngẫu nhiên hiếm gặp. Phân tích vì sao khó phát hiện bằng testing thông thường.","answer":"Khó phát hiện vì off-by-one chỉ kích hoạt với ĐIỀU KIỆN CỤ THỂ hiếm gặp (input đúng độ dài biên) – testing ngẫu nhiên khó chạm đúng edge case, cần Boundary Value Analysis có chủ đích."},{"num":8,"question":"Một công ty an ninh mạng phân tích một malware khai thác Format String Vulnerability trong phần mềm phổ biến. Mô tả cách STR31-C có thể đã ngăn chặn lỗ hổng này.","answer":"STR31-C yêu cầu buffer đủ lớn CHO KÝ TỰ + NULL TERMINATOR – nếu tuân thủ nghiêm ngặt (dùng snprintf thay vì sprintf không kiểm tra), format string cụ thể này không thể ghi tràn."},{"num":9,"question":"Một dự án hàng không phát hiện code C không tuân thủ CERT C. Phân tích tại sao tiêu chuẩn CERT C đặc biệt quan trọng cho ngành này.","answer":"CERT C cung cấp checklist CỤ THỂ, đã kiểm chứng qua nhiều năm cho ngành an toàn tính mạng cao (hàng không) – giúp chuẩn hóa và audit được thay vì dựa vào kinh nghiệm cá nhân."},{"num":10,"question":"Một công ty phát hiện thư viện mã hóa tự viết bằng C có lỗi buffer overflow trong hàm xử lý key. Phân tích mức độ nghiêm trọng đặc biệt của lỗi này.","answer":"Nghiêm trọng đặc biệt: lỗi bộ nhớ trong module xử lý KEY (khóa mã hóa) có thể dẫn tới rò rỉ khóa qua overflow/side-channel, làm sụp đổ TOÀN BỘ hệ thống bảo mật dựa trên khóa đó."},{"num":11,"question":"Một tổ chức yêu cầu MIGRATE một module C tới hạn sang Rust. Phân tích lợi ích cụ thể liên quan tới các lỗi đã học ở Mục 2.3.","answer":"Lợi ích Rust: loại bỏ UAF/double-free/buffer overflow qua compile-time check (Ownership), không cần thêm sanitizer runtime – giảm hẳn lớp lỗi Mục 2.2-2.3 đã học."},{"num":12,"question":"Một công ty phát hiện DEP/NX bị TẮT trên server production do cấu hình sai. Phân tích rủi ro tăng thêm khi có buffer overflow.","answer":"Rủi ro tăng cao đáng kể: nếu có buffer overflow, không có DEP/NX nghĩa là kẻ tấn công có thể thực thi mã injected trực tiếp trong vùng dữ liệu – cần bật lại NGAY LẬP TỨC."},{"num":13,"question":"Một dự án IoT phát hiện firmware không dùng bất kỳ compiler protection nào (canary, ASLR, DEP). Đề xuất ưu tiên bật protection nào trước.","answer":"Ưu tiên: Stack Canary trước (rẻ, hiệu quả tức thì với stack overflow), sau đó DEP/NX, cuối cùng ASLR nếu phần cứng hỗ trợ."},{"num":14,"question":"Một pentester tìm thấy buffer overflow trong ứng dụng nhưng không khai thác được do ASLR+DEP+Canary đều bật. Phân tích ý nghĩa thực tế của việc ”có lỗi nhưng khó khai thác”.","answer":"Ý nghĩa: các lớp bảo vệ (Canary+ASLR+DEP) LÀM TĂNG ĐỘ KHÓ khai thác đáng kể dù lỗi vẫn tồn tại – đây là giá trị thực tế của Defense in Depth, dù vẫn cần vá lỗi gốc."},{"num":15,"question":"Một công ty phát hiện struct dùng để giao tiếp giữa 2 hệ thống có vấn đề alignment gây lỗi parse dữ liệu. Phân tích và đề xuất dùng #pragma pack.","answer":"Vấn đề alignment giữa 2 hệ thống khác kiến trúc; giải pháp: dùng #pragma pack(1) cho struct giao tiếp để đảm bảo layout nhất quán bất kể platform."}]}},{"id":"2.4","title":"Sắp xếp cấu trúc dữ liệu (Data Structure Alignment)","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Alignment là yêu cầu gì?","options":{"A":"Một giá trị kiểu T phải đặt tại địa chỉ là bội số của alignof(T)","B":"Mọi biến phải có cùng kích thước","C":"Không có yêu cầu gì đặc biệt","D":"Chỉ áp dụng cho số thực"},"correct":"A","explanation":"Giá trị T đặt tại địa chỉ bội số của alignof(T)."},{"num":2,"question":"Vì sao CPU cần truy cập bộ nhớ theo alignment?","options":{"A":"Để tiết kiệm điện","B":"Để đọc/ghi hiệu quả nhất theo các ”word” căn chỉnh","C":"Không có lý do kỹ thuật","D":"Chỉ vì quy ước lập trình"},"correct":"B","explanation":"CPU đọc/ghi hiệu quả nhất theo word căn chỉnh."},{"num":3,"question":"Padding trong struct C là gì?","options":{"A":"Dữ liệu người dùng nhập vào","B":"Byte đệm compiler tự thêm để đảm bảo alignment","C":"Lỗi biên dịch","D":"Chỉ xuất hiện trong Python"},"correct":"B","explanation":"Padding: byte đệm compiler tự thêm."},{"num":4,"question":"Với struct {char a; int b; char c;}, sizeof thường KHÔNG bằng:","options":{"A":"```\n(tổng đơn giản 1+4+1)","B":"12 (có padding)","C":"Cả A và B đều có thể đúng\n```\n\ntùy hệ thống","D":"Không thể xác định"},"correct":"C","explanation":"Cả A và B đúng tùy hệ thống (thường 12 do padding). 19\n\n```\nMỤC 2.4 – SẮP XẾP CẤU TRÚC DỮ LIỆU (DATA STRUCTURE\n```\n\nALIGNMENT) – An toàn phần mềm"},{"num":5,"question":"Cách giảm padding hiệu quả là gì?","options":{"A":"Sắp xếp field theo kích thước GIẢM DẦN","B":"Sắp xếp field theo bảng chữ cái","C":"Không thể giảm padding","D":"Luôn dùng #pragma pack(1) trong mọi trường hợp"},"correct":"A","explanation":"Sắp xếp field theo kích thước giảm dần."},{"num":6,"question":"Padding có thể gây ra lỗi bảo mật nào?","options":{"A":"Buffer overflow","B":"Rò rỉ dữ liệu ”rác” qua CWE-457/CWE-200","C":"SQL Injection","D":"Race condition"},"correct":"B","explanation":"Rò rỉ dữ liệu rác qua CWE-457/CWE-200."},{"num":7,"question":"Giải pháp cho lỗi rò rỉ padding là gì?","options":{"A":"Không có giải pháp","B":"memset(&s, 0, sizeof(s)) trước khi điền dữ liệu","C":"Tăng kích thước struct","D":"Chỉ dùng union thay vì struct"},"correct":"B","explanation":"memset(&s,0,sizeof(s)) trước khi điền dữ liệu."},{"num":8,"question":"#pragma pack(push, 1) có tác dụng gì?","options":{"A":"Tăng padding lên tối đa","B":"Tắt padding, dùng 1-byte alignment","C":"Xóa toàn bộ struct","D":"Không có tác dụng thực tế"},"correct":"B","explanation":"#pragma pack(push,1): tắt padding."},{"num":9,"question":"Khi nào thường cần #pragma pack(1)?","options":{"A":"Khi cần khớp định dạng binary chính xác (network protocol, file format)","B":"Luôn luôn cần dùng","C":"Không bao giờ cần dùng","D":"Chỉ khi lập trình game"},"correct":"A","explanation":"Cần khi khớp định dạng binary chính xác."}],"ly_thuyet":[{"num":1,"question":"Trình bày khái niệm Memory Alignment và giải thích tại sao CPU yêu cầu nó.","answer":"Alignment: yêu cầu giá trị kiểu T đặt tại địa chỉ là bội số của alignof(T); CPU cần điều này để đọc/ghi hiệu quả theo các ”word” phần cứng, tránh truy cập chia làm nhiều lần."},{"num":2,"question":"Giải thích Padding trong struct C và lý do compiler tự động thêm padding.","answer":"Padding: byte đệm compiler tự thêm giữa/sau các field để đảm bảo mỗi field bắt đầu ĐÚNG alignment yêu cầu và tổng kích thước struct là bội số alignment lớn nhất."},{"num":3,"question":"Mô tả ví dụ cụ thể struct với 3 field (char, int, char) và giải thích vì sao sizeof KHÔNG bằng tổng đơn giản.","answer":"struct{char a;int b;char c;}: a(1B)+pad(3B)+b(4B)+c(1B)+pad(3B)=12B, KHÔNG phải 1+4+1=6B vì cần padding để b căn chỉnh 4-byte và tổng struct là bội số 4."},{"num":4,"question":"Trình bày nguyên tắc sắp xếp field theo kích thước giảm dần để giảm padding.","answer":"Nguyên tắc: đặt field LỚN NHẤT trước, NHỎ NHẤT sau – giúp gom các field nhỏ lại gần nhau, giảm số lượng padding ”lẻ” xen giữa. 20\n\n```\nMỤC 2.4 – SẮP XẾP CẤU TRÚC DỮ LIỆU (DATA STRUCTURE\n```\n\nALIGNMENT) – An toàn phần mềm"},{"num":5,"question":"Giải thích hệ quả bảo mật của padding: rò rỉ dữ liệu qua CWE-457/CWE- 200.","answer":"Padding KHÔNG được khởi tạo tự động, chứa dữ liệu ”rác” còn sót từ lần cấp phát trước; nếu serialize/gửi TOÀN BỘ struct (bao gồm padding) qua mạng/file, dữ liệu rác này có thể rò rỉ (CWE-457/CWE-200)."},{"num":6,"question":"Mô tả giải pháp memset(&s, 0, sizeof(s)) và tại sao nó ngăn được rò rỉ padding.","answer":"memset xóa TOÀN BỘ byte của struct (kể cả padding) về 0 TRƯỚC KHI điền dữ liệu thực – đảm bảo không còn ”rác” từ lần cấp phát trước khi serialize."},{"num":7,"question":"Trình bày cách dùng #pragma pack và alignas để kiểm soát alignment.","answer":"#pragma pack(push,N) đặt alignment tối đa N byte (thường N=1 để tắt padding hoàn toàn); alignas(N) bắt buộc MỘT biến/field align theo N byte cụ thể (C11)."},{"num":8,"question":"Giải thích khi nào cần dùng #pragma pack(1) và đánh đổi hiệu năng đi kèm.","answer":"Dùng khi cần khớp CHÍNH XÁC định dạng binary với hệ thống khác (network protocol, file format cố định) – đánh đổi: giảm hiệu năng do CPU phải xử lý truy cập misaligned."},{"num":9,"question":"Phân biệt sizeof và offsetof, cho ví dụ minh họa ứng dụng thực tế.","answer":"sizeof trả tổng kích thước CẢ struct; offsetof trả VỊ TRÍ BYTE cụ thể của MỘT field – offsetof hữu ích khi cần debug layout hoặc thao tác trực tiếp với buffer binary."},{"num":10,"question":"Trình bày ví dụ struct PacketHeader cho network protocol dùng #pragma pack(1).","answer":"PacketHeader dùng pack(1) với version(1B)+flags(1B)+length(2B)+seq(4B)=8B không padding, khớp CHÍNH XÁC với wire format của giao thức mạng."},{"num":11,"question":"Giải thích tại sao cần kiểm tra kích thước buffer trước khi ép kiểu con trỏ thành struct khi parse dữ liệu mạng.","answer":"Vì nếu buffer nhận được NHỎ HƠN sizeof(struct), việc ép kiểu con trỏ và truy cập field sẽ ĐỌC NGOÀI BIÊN buffer – gây crash hoặc đọc dữ liệu rác/nhạy cảm."},{"num":12,"question":"Mô tả Bitfields trong C và giải thích tại sao chúng KHÔNG PHÙ HỢP cho network protocol.","answer":"Bitfields có layout (thứ tự bit, padding) PHỤ THUỘC trình biên dịch/kiến trúc cụ thể (implementation-defined) – không đảm bảo giống nhau giữa các hệ thống khác nhau."},{"num":13,"question":"Trình bày giải pháp thay thế Bitfields bằng bit-mask thủ công cho network protocol.","answer":"Giải pháp: dùng kiểu uint8_t với các phép AND/OR/SHIFT thủ công để trích xuất/thiết lập từng bit, đảm bảo hành vi NHẤT QUÁN trên mọi compiler/kiến trúc."},{"num":14,"question":"Bàn luận: tại sao việc sắp xếp lại field không PHẢI LÚC NÀO CŨNG giảm được kích thước struct?","answer":"KHÔNG phải lúc nào cũng giảm được vì alignment TỔNG THỂ của struct quyết định bởi field có alignment LỚN NHẤT (VD double 8-byte) – nếu field đó luôn cần padding theo sau, sắp xếp lại các field nhỏ khác không ảnh hưởng tổng kích thước."},{"num":15,"question":"Giải thích quy tắc ”sizeof struct luôn là bội số của alignment lớn nhất trong các field”.","answer":"sizeof struct luôn là BỘI SỐ của alignment LỚN NHẤT trong các field – đảm bảo khi đặt struct trong MẢNG, mọi phần tử đều alignment đúng."}],"thuc_hanh":[{"num":1,"question":"Tính sizeof của struct {char a; int b; char c;} trên hệ 64-bit và vẽ layout với padding.","answer":"struct{char a;int b;char c;}: a(1)+pad(3)+b(4)+c(1)+pad(3) = 12 byte trên hệ 64-bit."},{"num":2,"question":"Sắp xếp lại field của struct câu 1 để giảm padding, tính lại sizeof.","answer":"Sắp xếp lại int b;char a;char c;: 4+1+1+2(pad) = 8 byte – giảm từ 12 xuống 8."},{"num":3,"question":"Viết đoạn code in ra sizeof và offsetof của từng field trong một struct\n\n```\nfield.\n```","answer":"In offsetof từng field bằng printf(\"%zu\",offsetof(S,field)); cho 4 field."},{"num":4,"question":"Cho struct {double d; char c; int i;}, tính sizeof trên hệ 64-bit, giải thích padding.","answer":"struct{double d;char c;int i;}: d(8)+c(1)+pad(3)+i(4) = 16 byte (alignment lớn nhất là 8 của double)."},{"num":5,"question":"Viết struct PacketHeader dùng #pragma pack(1) với version(uint8), flags(uint8), length(uint16), seq(uint32), tính sizeof.","answer":"PacketHeader pack(1): version(1)+flags(1)+length(2)+seq(4) = 8 byte, không padding."},{"num":6,"question":"Viết đoạn code minh họa memset trước khi gửi struct qua socket (giả lập bằng write vào buffer).","answer":"memset(&rec,0,sizeof(rec)); rec.field=val; write(fd,&rec,sizeof(rec));"},{"num":7,"question":"Cho một struct chứa bitfields, viết bản thay thế dùng bit-mask thủ công với uint8_t.","answer":"Bitfield thay bằng: uint8_t flags; #define IS_ADMIN(f) ((f)&0x01) và các macro tương tự cho từng bit."},{"num":8,"question":"Viết hàm struct_has_padding(size_t naive_sum, size_t actual_sizeof) kiểm tra struct có padding hay không.","answer":"bool has_padding(size_t naive, size_t actual){return naive != actual;}"},{"num":9,"question":"Cho một struct 5 field kích thước khác nhau, sắp xếp lại theo giảm dần và so sánh sizeof trước/sau.","answer":"Struct 5 field (double,int,short,char,char) sắp xếp giảm dần: giảm padding so với thứ tự ngẫu nhiên ban đầu."},{"num":10,"question":"Viết đoạn code dùng alignas(16) cho một buffer, giải thích ứng dụng thực tế (SIMD alignment).","answer":"alignas(16) char buf[64]; dùng cho SIMD instructions cần dữ liệu align 16-byte."},{"num":11,"question":"Cho một struct network protocol, viết code parse buffer nhận được thành struct với kiểm tra kích thước trước.","answer":"if(recv_len < sizeof(Header)) return ERROR; Header *h = (Header*)buffer; 22\n\n```\nMỤC 2.4 – SẮP XẾP CẤU TRÚC DỮ LIỆU (DATA STRUCTURE\n```\n\nALIGNMENT) – An toàn phần mềm"},{"num":12,"question":"Viết đoạn code minh họa lỗi: cast buffer nhỏ hơn sizeof(struct) thành con trỏ struct, gây đọc ngoài biên.","answer":"Minh họa lỗi: Header *h = (Header*)small_buffer; khi sizeof(small_buffer) < sizeof(Header) – đọc ngoài biên."},{"num":13,"question":"Tính offsetof cho tất cả field trong struct {char a; double b; char c; int d;}. 23\n\n```\nMỤC 2.4 – SẮP XẾP CẤU TRÚC DỮ LIỆU (DATA STRUCTURE\n```\n\nALIGNMENT) – An toàn phần mềm","answer":"offsetof(a)=0, offsetof(b)=8(pad 7 sau a), offsetof(c)=16, offsetof(d)=20(pad giữa c,d nếu cần)."},{"num":14,"question":"Viết đoạn code so sánh sizeof của cùng một struct với và không có #pragma pack(1).","answer":"So sánh: không pack thường lớn hơn (VD 12 vs 8 byte) do padding."},{"num":15,"question":"Cho struct chứa thông tin nhạy cảm (VD password field + padding), viết bản đã sửa dùng memset trước serialize.","answer":"memset(&rec,0,sizeof(rec)); rec.password_hash=...; trước khi serialize."}],"thuc_te":[{"num":1,"question":"Một công ty phát hiện dữ liệu nhạy cảm bị rò rỉ qua padding khi struct được ghi trực tiếp ra file log. Phân tích nguyên nhân và đề xuất khắc phục.","answer":"Nguyên nhân: thiếu memset trước khi ghi log; khắc phục: thêm memset(&s,0,sizeof(s)) TRƯỚC MỌI serialize/log struct chứa dữ liệu nhạy cảm."},{"num":2,"question":"Một hệ thống giao tiếp giữa server 64-bit và thiết bị nhúng 32-bit gặp lỗi parse dữ liệu do khác biệt alignment. Phân tích và đề xuất giải pháp.","answer":"Giải pháp: dùng #pragma pack(1) cho struct giao tiếp để đảm bảo layout NHẤT QUÁN bất kể alignment mặc định khác nhau giữa 2 kiến trúc."},{"num":3,"question":"Một dự án game network dùng struct không pack để gửi packet, gây lãng phí băng thông đáng kể. Phân tích và đề xuất tối ưu. 24\n\n```\nMỤC 2.4 – SẮP XẾP CẤU TRÚC DỮ LIỆU (DATA STRUCTURE\n```\n\nALIGNMENT) – An toàn phần mềm","answer":"Tối ưu: thêm #pragma pack(1) cho struct packet, giảm đáng kể overhead băng thông khi gửi số lượng lớn packet. 23\n\n```\nMỤC 2.4 – SẮP XẾP CẤU TRÚC DỮ LIỆU (DATA STRUCTURE\n```\n\nALIGNMENT) – An toàn phần mềm"},{"num":4,"question":"Một công ty bảo mật phát hiện một ứng dụng rò rỉ một phần khóa mã hóa qua padding của struct gửi qua mạng. Phân tích mức độ nghiêm trọng.","answer":"Mức độ nghiêm trọng CAO: rò rỉ một phần khóa mã hóa qua padding tương đương một dạng side-channel – cần vá NGAY và audit toàn bộ struct liên quan crypto."},{"num":5,"question":"Một hệ thống IoT dùng bitfields cho protocol riêng, gặp lỗi không tương thích khi đổi sang compiler khác. Phân tích nguyên nhân và đề xuất sửa.","answer":"Nguyên nhân: bitfield layout implementation-defined, khác nhau giữa compiler; sửa: chuyển sang bit-mask thủ công với uint8_t đảm bảo tính portable."},{"num":6,"question":"Một tổ chức tài chính phát hiện struct giao dịch có padding chứa dữ liệu từ giao dịch TRƯỚC đó (do tái sử dụng vùng nhớ không memset). Phân tích rủi ro nghiêm trọng.","answer":"Rủi ro nghiêm trọng: dữ liệu giao dịch cũ rò rỉ qua padding của bản ghi mới (tái sử dụng vùng nhớ); khắc phục khẩn: memset MỌI struct giao dịch trước khi ghi/gửi."},{"num":7,"question":"Một công ty phát hiện việc thêm #pragma pack(1) không cần thiết cho một struct chỉ dùng nội bộ đã làm CHẬM chương trình. Phân tích và đề xuất khi nào nên/không nên pack.","answer":"Không nên pack(1) không cần thiết cho struct chỉ dùng NỘI BỘ – pack chỉ nên dùng khi thực sự cần khớp binary format bên ngoài (network/file)."},{"num":8,"question":"Một dự án firmware phát hiện lỗi crash khi struct network header được cast từ buffer QUÁ NHỎ (thiếu vài byte). Phân tích và đề xuất validate trước khi parse.","answer":"Đề xuất: LUÔN validate buffer_size >= sizeof(struct) trước khi ép kiểu con trỏ, trả lỗi rõ ràng nếu không đủ thay vì cast liều lĩnh."},{"num":9,"question":"Một hệ thống trading tần suất cao cần tối ưu CẢ tốc độ VÀ kích thước struct cho dữ liệu thị trường. Đề xuất chiến lược cân bằng.","answer":"Chiến lược: pack(1) cho phần HEADER cố định (tối ưu băng thông truyền), nhưng có thể để mặc định alignment cho phần xử lý nội bộ (tối ưu tốc độ tính toán)."},{"num":10,"question":"Một công ty phát hiện struct dùng cho save file game bị lỗi khi load trên platform khác (khác alignment mặc định). Phân tích và đề xuất giải pháp portable.","answer":"Giải pháp portable: dùng #pragma pack(1) HOẶC serialize/deserialize thủ công từng field (đọc/ghi byte theo thứ tự cố định) thay vì dựa vào memory layout tự nhiên."},{"num":11,"question":"Một hệ thống y tế phát hiện dữ liệu bệnh nhân cũ bị lộ qua padding của struct record mới được cấp phát lại từ cùng vùng nhớ. Phân tích và đề xuất khắc phục khẩn cấp.","answer":"Khắc phục khẩn cấp: memset TOÀN BỘ struct record trước khi tái sử dụng vùng nhớ cho bệnh nhân mới, audit toàn bộ hệ thống quản lý record."},{"num":12,"question":"Một công ty phát hiện một CVE liên quan tới đọc ngoài biên do thiếu kiểm tra kích thước trước khi cast buffer thành struct. Phân tích chuỗi lỗi và đề xuất vá.","answer":"Chuỗi lỗi: thiếu validate size→cast buffer nhỏ thành struct lớn→đọc ngoài biên→crash/leak; vá: thêm size check trước MỌI cast."},{"num":13,"question":"Một dự án vệ tinh dùng struct pack(1) cho toàn bộ telemetry data để tối ưu băng thông truyền tín hiệu. Phân tích đánh đổi hiệu năng xử lý trên board.","answer":"Đánh đổi: pack(1) giảm băng thông truyền (quan trọng cho vệ tinh) nhưng tăng chi phí xử lý misaligned trên board – cần benchmark cụ thể để cân bằng."},{"num":14,"question":"Một hệ thống ngân hàng phát hiện lỗi so sánh 2 struct bằng memcmp cho kết quả sai do padding chứa giá trị rác khác nhau dù dữ liệu logic giống nhau. Phân tích và đề xuất sửa.","answer":"Sửa: viết hàm so sánh TỪNG FIELD thay vì memcmp toàn bộ struct (memcmp so sánh CẢ padding có thể khác giá trị dù data logic giống nhau)."},{"num":15,"question":"Một công ty phần cứng phát hiện misaligned access gây lỗi bus error trên một dòng CPU nhúng cụ thể. Phân tích và đề xuất kiểm tra alignment kỹ hơn.","answer":"Đề xuất: kiểm tra kỹ tài liệu alignment requirement của CPU đích, dùng alignas hoặc test kỹ trên hardware thật trước khi deploy."}]}},{"id":"2.5","title":"Công cụ phân tích tĩnh tìm lỗi bảo mật","knowledge_summary":"","categories":{"trac_nghiem":[{"num":1,"question":"Compiler warnings được coi là tuyến phòng thủ nào?","options":{"A":"Phân tích động duy nhất","B":"Static analysis cơ bản, rẻ nhất","C":"Không liên quan tới static analysis","D":"Chỉ có tác dụng thẩm mỹ"},"correct":"B","explanation":"Static analysis cơ bản, rẻ nhất."},{"num":2,"question":"Cờ nào cảnh báo lỗi format string trong GCC?","options":{"A":"-O2","B":"-Wformat=2","C":"-c","D":"-shared"},"correct":"B","explanation":"-Wformat=2 cảnh báo lỗi format string."},{"num":3,"question":"-fanalyzer (GCC 10+) có tác dụng gì?","options":{"A":"Tăng tốc biên dịch","B":"Static analyzer tích hợp phát hiện UAF, double-free, NULL deref","C":"Chỉ dùng cho C++","D":"Xóa toàn bộ warning"},"correct":"B","explanation":"-fanalyzer: phát hiện UAF, double-free, NULL deref."},{"num":4,"question":"Cppcheck có đặc điểm gì nổi bật?","options":{"A":"Cần build toàn bộ project mới chạy được","B":"Không cần build, phân tích trực tiếp mã nguồn, tỷ lệ false positive thấp","C":"Chỉ hoạt động trên Windows","D":"Chỉ phát hiện lỗi cú pháp"},"correct":"B","explanation":"Không cần build, false positive thấp."},{"num":5,"question":"cppcheck --enable=all dùng để làm gì?","options":{"A":"Tắt toàn bộ cảnh báo","B":"Bật tất cả loại kiểm tra có sẵn","C":"Chỉ kiểm tra cú pháp","D":"Xóa file tạm"},"correct":"B","explanation":"--enable=all: bật tất cả loại kiểm tra."},{"num":6,"question":"Trong output Cppcheck, mã lỗi [memleak] nghĩa là gì?","options":{"A":"Lỗ
